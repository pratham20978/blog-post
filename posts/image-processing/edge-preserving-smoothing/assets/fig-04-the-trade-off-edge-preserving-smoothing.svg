  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="32" y="40" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">TWO FEATURES, ONE TRADE-OFF: WHAT EACH METHOD KEEPS OF THE STEP AND OF THE IMPULSE</text><line x1="110" y1="426" x2="650" y2="426" stroke="#bfc0c0" stroke-width="1"/><line x1="110" y1="96" x2="110" y2="426" stroke="#bfc0c0" stroke-width="1"/><line x1="110" y1="408.3" x2="650" y2="408.3" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="103" y="411.32142857142856" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">0</text><line x1="110" y1="349.4" x2="650" y2="349.4" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="103" y="352.3928571428571" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">20</text><line x1="110" y1="290.5" x2="650" y2="290.5" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="103" y="293.4642857142857" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">40</text><line x1="110" y1="231.5" x2="650" y2="231.5" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="103" y="234.53571428571428" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">60</text><line x1="110" y1="172.6" x2="650" y2="172.6" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="103" y="175.60714285714283" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">80</text><line x1="110" y1="113.7" x2="650" y2="113.7" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="103" y="116.67857142857144" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">100</text><text x="110.0" y="440" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0</text><text x="212.85714285714283" y="440" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">20</text><text x="315.71428571428567" y="440" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">40</text><text x="418.57142857142856" y="440" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">60</text><text x="521.4285714285713" y="440" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">80</text><text x="624.2857142857142" y="440" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">100</text><text x="650" y="456" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.18em">STEP CONTRAST KEPT, %</text><text x="110" y="86" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">IMPULSE CONTRAST LEFT, %</text><rect x="521.4" y="334.7" width="128.6" height="91.3" fill="#7c8f6f" fill-opacity="0.10"/><text x="525.4285714285713" y="317.6607142857143" fill="#7c8f6f" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">wanted: edge kept,</text><text x="525.4285714285713" y="328.6607142857143" fill="#7c8f6f" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">impulse gone</text><polyline points="624.3,113.7 624.3,113.7 624.2,113.7 622.4,113.9 615.1,115.6 601.1,122.5 582.4,137.7 561.8,160.2 541.7,186.1 506.7,234.8 479.8,271.6 459.7,297.7 433.3,329.5 412.1,353.0 397.5,368.3 387.9,377.9 380.8,384.8 378.5,387.1" fill="none" stroke="#2e5aa8" stroke-width="2" stroke-linejoin="round"/><polyline points="624.3,113.7 572.9,161.2 531.0,210.8 489.6,267.8 448.7,331.5 407.0,390.0 364.5,407.5 323.3,409.9 288.1,411.6 259.3,412.0 236.1,412.3 217.9,412.2 203.6,412.0" fill="none" stroke="#b8915a" stroke-width="2" stroke-linejoin="round"/><circle cx="582.4" cy="137.7" r="3.4" fill="#2e5aa8"/><text x="572.3515398496486" y="140.72939878788446" fill="#2e5aa8" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">σr = 80</text><circle cx="541.7" cy="186.1" r="3.4" fill="#2e5aa8"/><text x="531.6856116548522" y="189.11357058967977" fill="#2e5aa8" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">σr = 100</text><circle cx="459.7" cy="297.7" r="3.4" fill="#2e5aa8"/><text x="449.71058888226355" y="300.6584169966211" fill="#2e5aa8" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">σr = 160</text><circle cx="572.9" cy="161.2" r="3.4" fill="#b8915a"/><text x="582.8571428571429" y="164.2107484158111" fill="#b8915a" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">1 iteration</text><circle cx="489.6" cy="267.8" r="3.4" fill="#b8915a"/><text x="499.6463371125804" y="270.7907585558294" fill="#b8915a" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">3 iterations</text><circle cx="407.0" cy="390.0" r="3.4" fill="#b8915a"/><text x="416.956944265969" y="393.01346464725435" fill="#b8915a" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">5 iterations</text><circle cx="236.1" cy="412.3" r="3.4" fill="#b8915a"/><text x="236.08666833422922" y="400.33815204650944" fill="#b8915a" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">10 iterations</text><circle cx="378.5" cy="387.1" r="4.4" fill="#7a8399"/><text x="368.46304107349556" y="379.08217494946837" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">Gaussian</text><circle cx="624.3" cy="408.3" r="5" fill="#7c8f6f"/><text x="614.2857142857142" y="411.32142857142856" fill="#7c8f6f" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">median</text><circle cx="624.3" cy="349.4" r="5" fill="#9c6b50"/><text x="614.2857142857142" y="352.3928571428571" fill="#9c6b50" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">NL-means, max rule</text><circle cx="624.3" cy="113.7" r="5" fill="#ffffff" stroke="#9c6b50" stroke-width="1.6"/><text x="612.2857142857142" y="104.67857142857144" fill="#9c6b50" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">no change: NL-means with own weight 1</text><text x="700" y="112" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">HOW TO READ IT</text><text x="700" y="136" fill="#2e5aa8" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">blue: the bilateral filter as σr runs</text><text x="700" y="152" fill="#2e5aa8" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">from 10 up to ∞, where it is the Gaussian</text><text x="700" y="168" fill="#b8915a" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">mustard: Perona–Malik, K = 80,</text><text x="700" y="184" fill="#b8915a" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">iterations 0 to 12</text><text x="700" y="200" fill="#9c6b50" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">NL-means at h = 20, and the median:</text><text x="700" y="216" fill="#9c6b50" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">single points</text><text x="700" y="248" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">both contrast curves run from no change,</text><text x="700" y="264" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">top right, towards the Gaussian; neither</text><text x="700" y="280" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">enters the shaded corner. Rank (the</text><text x="700" y="296" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">median) and repetition (NL-means under</text><text x="700" y="312" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the max rule) sit on its right edge.</text><text x="700" y="348" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">impulse contrast: (r2, c1) minus the mean</text><text x="700" y="362" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">of its four neighbours, so spreading the</text><text x="700" y="376" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">impulse counts as lowering it</text><text x="700" y="390" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">step contrast: r0 c3 minus r0 c2</text><line x1="32" y1="492" x2="984" y2="492" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="508" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><line x1="108" y1="505" x2="126" y2="505" stroke="#2e5aa8" stroke-width="1.8"/><text x="132" y="509" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">bilateral</text><line x1="217.8" y1="505" x2="235.8" y2="505" stroke="#b8915a" stroke-width="1.8"/><text x="241.8" y="509" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">Perona–Malik</text><circle cx="354.2" cy="505.0" r="4" fill="#9c6b50"/><text x="370.20000000000005" y="509" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">NL-means, max rule</text><circle cx="519.8000000000001" cy="505" r="4.2" fill="#ffffff" stroke="#9c6b50" stroke-width="1.6"/><text x="535.8000000000001" y="509" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">NL-means, own weight 1</text><circle cx="710.2" cy="505.0" r="4" fill="#7c8f6f"/><text x="726.2" y="509" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">median</text><circle cx="801.4" cy="505.0" r="4" fill="#7a8399"/><text x="817.4000000000001" y="509" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">Gaussian</text>
</svg>