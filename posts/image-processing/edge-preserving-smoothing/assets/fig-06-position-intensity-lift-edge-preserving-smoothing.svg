<text x="32" y="40" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">ROW R2 LIFTED INTO POSITION × INTENSITY: THE BILATERAL FILTER IS A GAUSSIAN BLUR IN THIS PLANE</text><line x1="110" y1="432" x2="630" y2="432" stroke="#bfc0c0" stroke-width="1"/><line x1="110" y1="92" x2="110" y2="432" stroke="#bfc0c0" stroke-width="1"/><line x1="110" y1="432.0" x2="630" y2="432.0" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="103" y="435.0" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">0</text><line x1="110" y1="347.0" x2="630" y2="347.0" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="103" y="350.0" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">80</text><line x1="110" y1="262.0" x2="630" y2="262.0" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="103" y="265.0" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">160</text><line x1="110" y1="177.0" x2="630" y2="177.0" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="103" y="180.0" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">240</text><text x="184.28571428571428" y="446" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">c0</text><text x="277.14285714285717" y="446" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">c1</text><text x="370.0" y="446" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">c2</text><text x="462.8571428571429" y="446" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">c3</text><text x="555.7142857142858" y="446" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">c4</text><text x="630" y="462" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.18em">POSITION ALONG THE ROW</text><text x="110" y="82" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">INTENSITY</text><clipPath id="plot06"><rect x="110" y="92" width="520" height="340"/></clipPath><line x1="110.0" y1="92" x2="110.0" y2="432" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" stroke-dasharray="2,3"/><line x1="184.3" y1="92" x2="184.3" y2="432" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" stroke-dasharray="2,3"/><line x1="258.6" y1="92" x2="258.6" y2="432" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" stroke-dasharray="2,3"/><line x1="332.9" y1="92" x2="332.9" y2="432" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" stroke-dasharray="2,3"/><line x1="407.1" y1="92" x2="407.1" y2="432" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" stroke-dasharray="2,3"/><line x1="481.4" y1="92" x2="481.4" y2="432" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" stroke-dasharray="2,3"/><line x1="555.7" y1="92" x2="555.7" y2="432" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" stroke-dasharray="2,3"/><line x1="630.0" y1="92" x2="630.0" y2="432" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" stroke-dasharray="2,3"/><g clip-path="url(#plot06)"><ellipse cx="184.3" cy="389.5" rx="74.3" ry="85.0" fill="#2d3142" fill-opacity="0.06" stroke="#2d3142" stroke-opacity="0.45" stroke-width="1"/><ellipse cx="277.1" cy="161.1" rx="74.3" ry="85.0" fill="#eb6c36" fill-opacity="0.06" stroke="#eb6c36" stroke-opacity="0.45" stroke-width="1"/><ellipse cx="370.0" cy="389.5" rx="74.3" ry="85.0" fill="#2d3142" fill-opacity="0.06" stroke="#2d3142" stroke-opacity="0.45" stroke-width="1"/><ellipse cx="462.9" cy="219.5" rx="74.3" ry="85.0" fill="#2d3142" fill-opacity="0.06" stroke="#2d3142" stroke-opacity="0.45" stroke-width="1"/><ellipse cx="555.7" cy="219.5" rx="74.3" ry="85.0" fill="#2d3142" fill-opacity="0.06" stroke="#2d3142" stroke-opacity="0.45" stroke-width="1"/></g><circle cx="184.3" cy="389.5" r="5" fill="#2d3142"/><text x="193.28571428571428" y="380.5" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">40</text><circle cx="277.1" cy="161.1" r="5" fill="#eb6c36"/><text x="286.14285714285717" y="152.0625" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">255</text><circle cx="370.0" cy="389.5" r="5" fill="#2d3142"/><text x="379.0" y="380.5" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">40</text><circle cx="462.9" cy="219.5" r="5" fill="#2d3142"/><text x="453.8571428571429" y="210.5" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">200</text><circle cx="555.7" cy="219.5" r="5" fill="#2d3142"/><text x="564.7142857142858" y="210.5" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">200</text><line x1="230.7" y1="389.5" x2="230.7" y2="161.1" stroke="#eb6c36" stroke-width="1.4"/><text x="220.71428571428572" y="272.625" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">215 = 2.69 σr</text><line x1="416.4" y1="389.5" x2="416.4" y2="219.5" stroke="#2e5aa8" stroke-width="1.4"/><text x="406.42857142857144" y="283.25" fill="#2e5aa8" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">160 = 2.00 σr</text><text x="676" y="112" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">HOW THE LIFT WORKS</text><text x="676" y="136" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">each pixel becomes a point (x, I)</text><text x="676" y="152" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">blur the points with a 2-D Gaussian</text><text x="676" y="168" fill="#7a8399" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">σs wide and σr tall (ellipses: 1σ)</text><text x="676" y="184" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">read each pixel at its own (x, I)</text><text x="676" y="200" fill="#7a8399" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">and divide by the blurred weight</text><text x="676" y="236" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">points far apart in intensity barely</text><text x="676" y="252" fill="#eb6c36" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">mix: the impulse sits 2.69 σr above its</text><text x="676" y="268" fill="#2e5aa8" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">neighbours, the step 2.00 σr across</text><text x="676" y="304" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the blurred plane is smooth, so it can be</text><text x="676" y="320" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">stored at one cell per σs × σr: the</text><text x="676" y="336" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">bilateral grid, and the fast versions</text><text x="676" y="372" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">dotted grid: cells 0.8 px wide (σs)</text><text x="676" y="386" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">and 80 levels tall (σr)</text>
</svg>