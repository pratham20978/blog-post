<text x="32" y="40" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">ONE SEARCH, THREE LIBRARIES: MAPPED FROM SOURCE AND DOCUMENTATION, NOT RUN</text><text x="32" y="76" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start"></text><text x="196" y="76" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">OpenCV</text><text x="470" y="76" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">scikit-image</text><text x="752" y="76" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">MATLAB</text><line x1="32.0" y1="86.0" x2="984.0" y2="86.0" stroke="#bfc0c0" stroke-width="1.0"/><rect x="28" y="90" width="960" height="40" fill="rgba(45,49,66,0.03)"/><text x="32" y="112" fill="#7a8399" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.08em">call</text><text x="196" y="112" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">SIFT_create().detect(img, None)</text><text x="470" y="112" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">feature.SIFT().detect(img)</text><text x="752" y="112" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">detectSIFTFeatures(I)</text><text x="32" y="152" fill="#7a8399" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.08em">doubling</text><text x="196" y="152" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">linear resize ×2 (default)</text><text x="470" y="152" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">rescale ×2, order 1</text><text x="752" y="152" fill="#7a8399" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">not documented</text><rect x="28" y="170" width="960" height="40" fill="rgba(45,49,66,0.03)"/><text x="32" y="192" fill="#7a8399" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.08em">positions</text><text x="196" y="192" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">+0.25 px unless precise upscale</text><text x="470" y="192" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">+0.25 px, by its code</text><text x="752" y="192" fill="#7a8399" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">not documented</text><text x="32" y="232" fill="#7a8399" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.08em">levels / octave</text><text x="196" y="232" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">nOctaveLayers 3</text><text x="470" y="232" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">n_scales 3</text><text x="752" y="232" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">NumLayersInOctave 3</text><rect x="28" y="250" width="960" height="40" fill="rgba(45,49,66,0.03)"/><text x="32" y="272" fill="#7a8399" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.08em">base σ</text><text x="196" y="272" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">1.6 (assumes 0.5)</text><text x="470" y="272" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">sigma_min 1.6 (sigma_in 0.5)</text><text x="752" y="272" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Sigma 1.6</text><text x="32" y="312" fill="#7a8399" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.08em">DoG threshold</text><text x="196" y="312" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">0.04 ÷ 3 = 0.0133</text><text x="470" y="312" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">0.04/3, rescaled</text><text x="752" y="312" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">ContrastThreshold 0.0133</text><rect x="28" y="330" width="960" height="40" fill="rgba(45,49,66,0.03)"/><text x="32" y="352" fill="#7a8399" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.08em">edge ratio r</text><text x="196" y="352" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">10</text><text x="470" y="352" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">c_edge 10</text><text x="752" y="352" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">EdgeThreshold 10</text><text x="32" y="392" fill="#7a8399" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.08em">26-neighbour</text><text x="196" y="392" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">≥ / ≤: ties pass</text><text x="470" y="392" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">3×3×3 extrema</text><text x="752" y="392" fill="#7a8399" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">not documented</text><rect x="28" y="410" width="960" height="40" fill="rgba(45,49,66,0.03)"/><text x="32" y="432" fill="#7a8399" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.08em">border</text><text x="196" y="432" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">5 px never searched</text><text x="470" y="432" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">1 sample per octave</text><text x="752" y="432" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">ROI at least 63 × 63</text><text x="32" y="472" fill="#7a8399" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.08em">size field</text><text x="196" y="472" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">size = 2σ (a diameter)</text><text x="470" y="472" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">sigmas: σ itself</text><text x="752" y="472" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Scale: σ itself</text><rect x="28" y="490" width="960" height="40" fill="rgba(45,49,66,0.03)"/><text x="32" y="512" fill="#7a8399" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.08em">orientation</text><text x="196" y="512" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">degrees, 360 − bin</text><text x="470" y="512" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">radians</text><text x="752" y="512" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">radians, counterclockwise</text><text x="32" y="552" fill="#7a8399" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.08em">since</text><text x="196" y="552" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">main module 4.4.0 (2020)</text><text x="470" y="552" fill="#7a8399" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">—</text><text x="752" y="552" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">R2021b</text><text x="32" y="604" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">pinned: OpenCV 802cf95 (4.10.0 checked), scikit-image b700edc; MATLAB from MathWorks' pages, release R2026b. Orange marks the behaviour most likely to surprise.</text>
