<text x="32" y="40" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">A PLANE WAVE AT 4-PIXEL WAVELENGTH, GRADIENT AT 22.5°: HOW EACH FILTER SHRINKS THE TWO COMPONENTS</text><line x1="90" y1="380" x2="610" y2="380" stroke="#bfc0c0" stroke-width="1"/><line x1="90" y1="80" x2="90" y2="380" stroke="#bfc0c0" stroke-width="1"/><line x1="90" y1="380.0" x2="610" y2="380.0" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="83" y="383.0" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">0.0</text><line x1="90" y1="280.0" x2="610" y2="280.0" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="83" y="283.0" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">0.3</text><line x1="90" y1="180.0" x2="610" y2="180.0" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="83" y="183.0" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">0.6</text><line x1="90" y1="80.0" x2="610" y2="80.0" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="83" y="83.0" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">0.9</text><text x="90.0" y="394" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0.0</text><text x="252.5" y="394" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0.5</text><text x="415.0" y="394" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1.0</text><text x="577.5" y="394" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1.5</text><text x="610" y="410" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.18em">X COMPONENT</text><text x="90" y="70" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">Y COMPONENT</text><line x1="90.0" y1="380.0" x2="561.6" y2="179.6" stroke="#2d3142" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/><line x1="90.0" y1="380.0" x2="412.7" y2="191.5" stroke="#8e7aa6" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="90.0" y1="380.0" x2="384.4" y2="274.5" stroke="#5e7a9b" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="90.0" y1="380.0" x2="391.5" y2="253.7" stroke="#eb6c36" stroke-width="2" marker-end="url(#arrow-accent)"/><rect x="443.48863722265753" y="154.6274233718846" width="112.16" height="16" rx="2" fill="#f5f5f5"/><text x="551.6486372226575" y="165.6274233718846" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.04em">true gradient  22.50°</text><rect x="414.67951626658964" y="172.4784590750685" width="181.6" height="16" rx="2" fill="#f5f5f5"/><text x="418.67951626658964" y="183.4784590750685" fill="#8e7aa6" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">central difference  29.67° (+7.17°)</text><rect x="388.39729907564134" y="275.49532966575225" width="117.12" height="16" rx="2" fill="#f5f5f5"/><text x="392.39729907564134" y="286.49532966575225" fill="#5e7a9b" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">Sobel  19.26° (−3.24°)</text><rect x="395.4678533733784" y="246.74111201808125" width="122.08" height="16" rx="2" fill="#f5f5f5"/><text x="399.4678533733784" y="257.74111201808125" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">Scharr  22.21° (−0.29°)</text><text x="660" y="96" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">SHRINK FACTOR ON EACH COMPONENT</text><text x="660" y="118" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">x: S(ωx) × B(ωy)</text><text x="660" y="134" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">y: S(ωy) × B(ωx)</text><text x="660" y="150" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">ωx = 1.451, ωy = 0.601 rad/px</text><text x="660" y="180" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">filter</text><text x="800" y="180" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">on x</text><text x="870" y="180" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">on y</text><text x="940" y="180" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">turn</text><text x="660" y="204" fill="#8e7aa6" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">central difference</text><text x="800" y="204" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">0.684</text><text x="870" y="204" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">0.941</text><text x="940" y="204" fill="#8e7aa6" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">+7.17°</text><text x="660" y="228" fill="#5e7a9b" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Sobel</text><text x="800" y="228" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">0.624</text><text x="870" y="228" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">0.527</text><text x="940" y="228" fill="#5e7a9b" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">−3.24°</text><text x="660" y="252" fill="#7c8f6f" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">[1 4 1]/6</text><text x="800" y="252" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">0.644</text><text x="870" y="252" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">0.665</text><text x="940" y="252" fill="#7c8f6f" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">+0.64°</text><text x="660" y="276" fill="#eb6c36" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Scharr</text><text x="800" y="276" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">0.639</text><text x="870" y="276" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">0.630</text><text x="940" y="276" fill="#eb6c36" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">−0.29°</text><text x="660" y="318" fill="#2d3142" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">equal factors keep the direction:</text><text x="660" y="334" fill="#eb6c36" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Scharr's 0.639 and 0.630 differ by 1.4%</text><text x="660" y="358" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">S(ω) = sin ω / ω, the difference's own blur</text><text x="660" y="372" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">B(ω) = 1 − 2p + 2p cos ω, the cross-smoothing</text><line x1="32" y1="422" x2="984" y2="422" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="438" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><line x1="108" y1="435" x2="120" y2="435" stroke="#2d3142" stroke-width="1.4"/><text x="126" y="439" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">true direction</text><line x1="254.8" y1="435" x2="266.8" y2="435" stroke="#8e7aa6" stroke-width="1.4"/><text x="272.8" y="439" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">central difference</text><line x1="430.4" y1="435" x2="442.4" y2="435" stroke="#5e7a9b" stroke-width="1.4"/><text x="448.4" y="439" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">Sobel</text><line x1="512.4" y1="435" x2="524.4" y2="435" stroke="#eb6c36" stroke-width="1.4"/><text x="530.4" y="439" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-s