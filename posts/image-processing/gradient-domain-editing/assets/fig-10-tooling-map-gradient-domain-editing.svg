<text x="32" y="40" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">WHERE EACH PIECE LIVES: MAPPED FROM SOURCE AND DOCUMENTATION, NOT RUN</text><text x="32" y="78" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">call</text><text x="236" y="78" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">solves on</text><text x="410" y="78" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">solver</text><text x="588" y="78" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">guidance</text><text x="792" y="78" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">watch for</text><line x1="32.0" y1="88.0" x2="984.0" y2="88.0" stroke="#bfc0c0" stroke-width="1.0"/><rect x="28" y="92" width="960" height="85" fill="rgba(45,49,66,0.03)"/><text x="32" y="112" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">seamlessClone</text><text x="32" y="127" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">NORMAL_CLONE</text><text x="32" y="142" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">MIXED_CLONE</text><text x="32" y="157" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">MONOCHROME_TRANSFER</text><text x="236" y="112" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the mask's</text><text x="236" y="127" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">bounding box</text><text x="410" y="112" fill="#2e5aa8" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">sine transform,</text><text x="410" y="127" fill="#2e5aa8" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">exact</text><text x="588" y="112" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">src in the mask, dst out</text><text x="588" y="127" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">pair with larger abs(gx − gy)</text><text x="588" y="142" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">grey src in the mask</text><text x="792" y="112" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">mask eroded 3 px: under</text><text x="792" y="127" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">7 px clones nothing; MIXED</text><text x="792" y="142" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">drops spikes and 45° edges;</text><text x="792" y="157" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">p is the box centre</text><text x="32" y="197" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">illuminationChange</text><text x="32" y="212" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">alpha 0.2, beta 0.4</text><text x="236" y="197" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the whole image</text><text x="410" y="197" fill="#2e5aa8" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">sine transform,</text><text x="410" y="212" fill="#2e5aa8" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">exact</text><text x="588" y="197" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Pérez's eq. 16</text><text x="588" y="212" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">on the codes</text><text x="792" y="197" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">not in log; α fixed,</text><text x="792" y="212" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">not 0.2 × the mean</text><rect x="28" y="232" width="960" height="55" fill="rgba(45,49,66,0.03)"/><text x="32" y="252" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">textureFlattening</text><text x="32" y="267" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">30, 45, 3</text><text x="236" y="252" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the whole image</text><text x="410" y="252" fill="#2e5aa8" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">sine transform,</text><text x="410" y="267" fill="#2e5aa8" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">exact</text><text x="588" y="252" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">kept only where</text><text x="588" y="267" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Canny marks an edge</text><text x="32" y="307" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">createTonemapMantiuk</text><text x="236" y="307" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the whole image</text><text x="410" y="307" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">≤ 100 conjugate-</text><text x="410" y="322" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">gradient iterations</text><text x="588" y="307" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">contrast on every</text><text x="588" y="322" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">pyramid level</text><text x="792" y="307" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">OpenCV has no</text><text x="792" y="322" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Fattal operator</text><rect x="28" y="342" width="960" height="55" fill="rgba(45,49,66,0.03)"/><text x="32" y="362" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">regionfill (MATLAB)</text><text x="236" y="362" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the masked region</text><text x="410" y="362" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">not documented</text><text x="588" y="362" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">none: the membrane</text><text x="792" y="362" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">spike lost,</text><text x="792" y="377" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">step smeared</text><text x="32" y="417" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">scipy.sparse.linalg</text><text x="32" y="432" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">spsolve</text><text x="236" y="417" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">any region you</text><text x="236" y="432" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">assemble</text><text x="410" y="417" fill="#2e5aa8" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">direct, sparse</text><text x="588" y="417" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">equation (2),</text><text x="588" y="432" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">as you assemble it</text><text x="792" y="417" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the assembly</text><text x="792" y="432" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">is yours</text><rect x="28" y="452" width="960" height="55" fill="rgba(45,49,66,0.03)"/><text x="32" y="472" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">scipy.fft.dstn</text><text x="32" y="487" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">type=1</text><text x="236" y="472" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">a rectangle</text><text x="410" y="472" fill="#2e5aa8" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">direct,</text><text x="410" y="487" fill="#2e5aa8" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">O(n log n)</text><text x="588" y="472" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">b, as you build it</text><text x="792" y="472" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">rectangles only</text><text x="32" y="538" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">From 4.11.0 seamlessClone, colorChange, illuminationChange and textureFlattening erode and invert a 1-channel mask in place;</text><text x="32" y="554" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">OpenCV clamps results to 0–255 and truncates. Tangerine: a departure from Pérez et al. or a trap. Blue: a direct solve, no iteration.</text><text x="32" y="570" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">OpenCV read at 802cf95, 4.10.0–4.14.0 and 5.0.0; MATLAB R2026b and SciPy 1.18.0 documentation. None of it was executed.</text>
