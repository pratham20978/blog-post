<text x="32" y="40" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">WHICH CALL DOES WHAT, HOW IT SCALES, WHEN IT SWITCHES, AND THE TRAP — MAPPED FROM DOCS AND SOURCE, NOT RUN</text><text x="32" y="74" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.08em">call</text><text x="336" y="74" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.08em">scaling and layout</text><text x="580" y="74" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.08em">size or switch rule</text><text x="780" y="74" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.08em">trap</text><line x1="32" y1="84" x2="984" y2="84" stroke="#bfc0c0"/><rect x="28" y="90" width="960" height="40" fill="rgba(45,49,66,0.03)"/><text x="32" y="104" fill="#9c6b50" font-size="7" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.12em">NumPy</text><text x="32" y="118" fill="#2d3142" font-size="8.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">np.fft.fft2(img)</text><text x="336" y="112" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">unscaled forward; inverse ÷ MN</text><text x="580" y="112" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">any size</text><text x="780" y="112" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">match scaling before comparing</text><text x="32" y="144" fill="#9c6b50" font-size="7" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.12em">NumPy</text><text x="32" y="158" fill="#2d3142" font-size="8.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">np.fft.rfft2(img)</text><text x="336" y="152" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">N/2 + 1 columns (even N)</text><text x="580" y="152" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">—</text><text x="780" y="152" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the other half is conjugate</text><rect x="28" y="170" width="960" height="40" fill="rgba(45,49,66,0.03)"/><text x="32" y="184" fill="#9c6b50" font-size="7" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.12em">NumPy</text><text x="32" y="198" fill="#2d3142" font-size="8.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">np.fft.fftshift / ifftshift</text><text x="336" y="192" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">roll by n//2 / −(n//2)</text><text x="580" y="192" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">—</text><text x="780" y="192" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">not inverses on odd n</text><text x="32" y="224" fill="#5e7a9b" font-size="7" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.12em">OpenCV</text><text x="32" y="238" fill="#2d3142" font-size="8.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">cv2.dft(img, flags=DFT_COMPLEX_OUTPUT)</text><text x="336" y="232" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">full complex array</text><text x="580" y="232" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">—</text><text x="780" y="232" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">without the flag: CCS-packed</text><rect x="28" y="250" width="960" height="40" fill="rgba(45,49,66,0.03)"/><text x="32" y="264" fill="#5e7a9b" font-size="7" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.12em">OpenCV</text><text x="32" y="278" fill="#2d3142" font-size="8.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">cv2.idft(F, flags=DFT_SCALE|DFT_REAL_OUTPUT)</text><text x="336" y="272" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">DFT_SCALE divides by MN</text><text x="580" y="272" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">—</text><text x="780" y="272" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">omit it and get × MN</text><text x="32" y="304" fill="#5e7a9b" font-size="7" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.12em">OpenCV</text><text x="32" y="318" fill="#2d3142" font-size="8.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">cv2.getOptimalDFTSize(n)</text><text x="336" y="312" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">—</text><text x="580" y="312" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">next 2^p 3^q 5^r</text><text x="780" y="312" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">zero padding adds a jump</text><rect x="28" y="330" width="960" height="40" fill="rgba(45,49,66,0.03)"/><text x="32" y="344" fill="#5e7a9b" font-size="7" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.12em">OpenCV</text><text x="32" y="358" fill="#2d3142" font-size="8.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">cv2.filter2D(img, -1, k)</text><text x="336" y="352" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">correlation; caller's border</text><text x="580" y="352" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">DFT at area ≥ 130 or ≥ 50</text><text x="780" y="352" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">11 × 11 (121) stays direct</text><text x="32" y="384" fill="#5e7a9b" font-size="7" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.12em">OpenCV</text><text x="32" y="398" fill="#2d3142" font-size="8.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">cv2.phaseCorrelate(a, b, window)</text><text x="336" y="392" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">R = Ga Gb* / |Ga Gb*|</text><text x="580" y="392" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">pads to optimal size</text><text x="780" y="392" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">sign set by argument order</text><rect x="28" y="410" width="960" height="40" fill="rgba(45,49,66,0.03)"/><text x="32" y="424" fill="#b8915a" font-size="7" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.12em">SciPy</text><text x="32" y="438" fill="#2d3142" font-size="8.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">signal.fftconvolve(a, k)</text><text x="336" y="432" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">float output</text><text x="580" y="432" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">always the FFT</text><text x="780" y="432" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">slow when few outputs needed</text><text x="32" y="464" fill="#b8915a" font-size="7" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.12em">SciPy</text><text x="32" y="478" fill="#2d3142" font-size="8.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">signal.convolve(a, k, method='auto')</text><text x="336" y="472" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">fitted constants</text><text x="580" y="472" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">2-D: FFT from 3 × 3</text><text x="780" y="472" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">direct if int sums pass 2^52</text><rect x="28" y="490" width="960" height="40" fill="rgba(45,49,66,0.03)"/><text x="32" y="504" fill="#b8915a" font-size="7" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.12em">SciPy</text><text x="32" y="518" fill="#2d3142" font-size="8.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">fft.next_fast_len(n)</text><text x="336" y="512" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">—</text><text x="580" y="512" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">next fast length</text><text x="780" y="512" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">may change by version</text><text x="32" y="544" fill="#7c8f6f" font-size="7" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.12em">scikit-image</text><text x="32" y="558" fill="#2d3142" font-size="8.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">registration.phase_cross_correlation</text><text x="336" y="552" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">normalization='phase'</text><text x="580" y="552" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">—</text><text x="780" y="552" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">illumination yes, noise no</text><text x="32" y="594" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">OpenCV's 130 applies with SSE3 for 8-bit to 8-bit or 16-bit and float to float filtering; 50 otherwise</text>
</svg>