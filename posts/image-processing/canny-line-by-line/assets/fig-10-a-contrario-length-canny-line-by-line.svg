xt x="712.0" y="123.6956507446765" fill="#2e5aa8" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">high: one pixel, 5.26 s</text><text x="712.0" y="246.34782537233826" fill="#5e7a9b" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">high ÷ 2 = 2.63 s: a chain of 4</text><text x="712.0" y="287.2318835815588" fill="#b8915a" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">high ÷ 3 = 1.75 s: a chain of 9</text><text x="139.0344827586207" y="170.66666666666666" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">μmin(l) = s √(2 ln N / l)</text><text x="744" y="112" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">a curve is meaningful when</text><text x="744" y="128" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">N · H(μ)^l ≤ 1 (Desolneux,</text><text x="744" y="144" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Moisan and Morel)</text><text x="744" y="176" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">with the Rayleigh tail as H,</text><text x="744" y="192" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">N = 10⁶ curves:</text><text x="744" y="224" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">a chain k² times longer needs</text><text x="744" y="240" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">1/k of the contrast, so Canny's</text><text x="744" y="256" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">ratio of 2 to 3 is the drop</text><text x="744" y="272" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">for chains of 4 to 9 pixels</text><line x1="32" y1="426" x2="984" y2="426" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="442" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><line x1="108" y1="439" x2="126" y2="439" stroke="#2d3142" stroke-width="1.8"/><text x="132" y="443" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">required contrast</text><line x1="257.2" y1="439" x2="275.2" y2="439" stroke="#2e5aa8" stroke-width="1.8" stroke-dasharray="5,3"/><text x="281.2" y="443" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">high threshold</text><line x1="389.59999999999997" y1="439" x2="407.59999999999997" y2="439" stroke="#5e7a9b" stroke-width="1.8" stroke-dasharray="5,3"/><text x="413.59999999999997" y="443" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">high ÷ 2</text><line x1="488.4" y1="439" x2="506.4" y2="439" stroke="#b8915a" stroke-width="1.8" stroke-dasharray="5,3"/><text x="512.4" y="443" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">high ÷ 3</text>
