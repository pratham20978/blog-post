 3: peak at σ = r/√2 = 2.12</text><text x="80" y="1000" fill="#7a8399" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.10em">model — closed forms, contrast 160, nothing measured</text><text x="80" y="1052" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">The raw response falls as 1/σ², so the smallest σ always wins.</text><text x="80" y="1084" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Multiply by σ² and the σ at the peak is the size of the structure.</text><text x="80" y="1128" fill="#4f5d75" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">That derivation is why blob_log reports radius = √2 σ.</text><line x1="80" y1="1176" x2="1000" y2="1176" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="1216" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">A difference of Gaussians at a constant ratio carries the σ²</text><text x="80" y="1246" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">for free — which is why SIFT and blob_dog can use it instead.</text><text x="80" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.16em">the laplacian by hand</text><text x="1000" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">canery</text>
</svg>