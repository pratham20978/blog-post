<text x="80" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.24em">scale selection</text><text x="1000" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">5 / 6</text><line x1="80" y1="148" x2="1000" y2="148" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="232" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">Multiply by σ²,</text><text x="80" y="300" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">and σ is a ruler.</text><text x="80" y="374" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Lindeberg's normalisation turns the Laplacian into a</text><text x="80" y="404" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">measuring instrument: search σ, read off the size.</text><line x1="120" y1="920" x2="1000" y2="920" stroke="#bfc0c0" stroke-width="1.5"/><line x1="120" y1="520" x2="120" y2="920" stroke="#bfc0c0" stroke-width="1.5"/><text x="245.71428571428572" y="948" fill="#7a8399" font-size="15" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">σ = 1</text><text x="497.1428571428571" y="948" fill="#7a8399" font-size="15" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">σ = 2</text><text x="748.5714285714286" y="948" fill="#7a8399" font-size="15" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">σ = 3</text><text x="1000.0" y="948" fill="#7a8399" font-size="15" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">σ = 4</text><polyline points