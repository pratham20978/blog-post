<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1016 440" width="1016" height="440" role="img">
  <defs>
    <style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');/*]]>*/</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="32" y="44" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">A STRAIGHT EDGE, AND THE FRAME ROTATED TO IT</text><rect x="96" y="80" width="240" height="240" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><g transform="rotate(-30 216.0 200.0)"><rect x="216.0" y="0.0" width="200" height="400" fill="rgba(45,49,66,0.10)"/><line x1="216.0" y1="0.0" x2="216.0" y2="400.0" stroke="#2d3142" stroke-width="1.6"/><line x1="216.0" y1="200.0" x2="304.0" y2="200.0" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/><line x1="216.0" y1="200.0" x2="216.0" y2="112.0" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/></g><rect x="0" y="0" width="1016" height="80" fill="#f5f5f5"/><rect x="0" y="320" width="1016" height="120" fill="#f5f5f5"/><rect x="0" y="0" width="96" height="440" fill="#f5f5f5"/><rect x="336" y="0" width="680" height="440" fill="#f5f5f5"/><rect x="96" y="80" width="240" height="240" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="32" y="44" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">A STRAIGHT EDGE, AND THE FRAME ROTATED TO IT</text><rect x="340" y="145.0" width="110.24" height="16" rx="2" fill="#f5f5f5"/><text x="348" y="156.0" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">n — across the edge</text><rect x="67.36" y="93.0" width="105.28" height="16" rx="2" fill="#f5f5f5"/><text x="120.0" y="104.0" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">t — along the edge</text><text x="216.0" y="340" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">dark on the left, bright on the right</text><text x="420" y="124" fill="#2d3142" font-size="28" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">∇²f</text><text x="484" y="124" fill="#4f5d75" font-size="28" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">=</text><rect x="524" y="96" width="176" height="48" rx="6" fill="#f5f5f5"/><rect x="524" y="96" width="176" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="612" y="118" fill="#eb6c36" font-size="16" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="middle">∂²f / ∂n²</text><text x="612" y="134" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">across</text><text x="716" y="124" fill="#4f5d75" font-size="28" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">+</text><rect x="756" y="96" width="176" height="48" rx="6" fill="#f5f5f5"/><rect x="756" y="96" width="176" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="844" y="118" fill="#2d3142" font-size="16" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="middle">∂²f / ∂t²</text><text x="844" y="134" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">along</text><text x="612" y="184" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Canny's directional operator:</text><text x="612" y="200" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">all of the detection,</text><text x="612" y="216" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">all of the localisation</text><text x="844" y="184" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">zero on a straight edge —</text><text x="844" y="200" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the intensity is constant along it —</text><text x="844" y="216" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">and pure noise everywhere else</text><line x1="420" y1="256" x2="984" y2="256" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="420" y="284" fill="#2d3142" font-size="14" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start" font-style="italic">Across scales, the sum wins:</text><text x="420" y="304" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">the Gaussian never creates new zeros of ∇²f as σ grows,</text><text x="420" y="320" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">and no filter has that property for ∂²f/∂n² alone.</text><text x="420" y="344" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.10em">Canny 1986 · Yuille &amp; Poggio 1986</text><line x1="32" y1="384" x2="984" y2="384" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="400" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><rect x="108" y="392" width="10" height="10" rx="2" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36" stroke-width="0.8"/><text x="126" y="401" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">the term that carries the edge</text><rect x="370.0" y="392" width="10" height="10" rx="2" fill="#2d3142" fill-opacity="0.18" stroke="#2d3142" stroke-width="0.8"/><text x="388.0" y="401" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">the term that carries only noise</text>
</svg>