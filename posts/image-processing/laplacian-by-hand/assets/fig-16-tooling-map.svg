<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1016 560" width="1016" height="560" role="img">
  <defs>
    <style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');/*]]>*/</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="32" y="44" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">JOB → CALL, WITH THE SCALE FACTOR THE CALL APPLIES</text><text x="32" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">five-point Laplacian</text><line x1="232" y1="98" x2="296" y2="98" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="248.56" y="75" width="30.88" height="16" rx="2" fill="#f5f5f5"/><text x="264" y="86" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">× 1</text><rect x="304" y="80" width="344" height="36" rx="6" fill="#f5f5f5"/><rect x="304" y="80" width="344" height="36" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="476" y="102" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">cv2.Laplacian(img, CV_64F, ksize=1)</text><rect x="664" y="80" width="320" height="36" rx="6" fill="#f5f5f5"/><rect x="664" y="80" width="320" height="36" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="824" y="102" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">scipy.ndimage.laplace(img)</text><text x="32" y="166" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">the diagonal Laplacian</text><line x1="232" y1="162" x2="296" y2="162" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow-accent)"/><rect x="248.56" y="139" width="30.88" height="16" rx="2" fill="#f5f5f5"/><text x="264" y="150" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">× 4</text><rect x="304" y="144" width="344" height="36" rx="6" fill="#f5f5f5"/><rect x="304" y="144" width="344" height="36" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="476" y="166" fill="#eb6c36" font-size="9" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">cv2.Laplacian(img, CV_64F, ksize=3)</text><rect x="664" y="144" width="320" height="36" rx="6" fill="#f5f5f5"/><rect x="664" y="144" width="320" height="36" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="824" y="166" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">add scale=0.25 to compare</text><text x="32" y="230" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Laplacian of Gaussian</text><line x1="232" y1="226" x2="296" y2="226" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="243.6" y="203" width="40.8" height="16" rx="2" fill="#f5f5f5"/><text x="264" y="214" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">no σ²</text><rect x="304" y="208" width="344" height="36" rx="6" fill="#f5f5f5"/><rect x="304" y="208" width="344" height="36" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="476" y="230" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">cv2.GaussianBlur → cv2.Laplacian</text><rect x="664" y="208" width="320" height="36" rx="6" fill="#f5f5f5"/><rect x="664" y="208" width="320" height="36" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="824" y="230" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">scipy.ndimage.gaussian_laplace(img, σ)</text><text x="32" y="294" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">blob scale selection</text><line x1="232" y1="290" x2="296" y2="290" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="226.24" y="267" width="75.52" height="16" rx="2" fill="#f5f5f5"/><text x="264" y="278" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">σ² · 1/(k−1)</text><rect x="304" y="272" width="344" height="36" rx="6" fill="#f5f5f5"/><rect x="304" y="272" width="344" height="36" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="476" y="294" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">skimage.feature.blob_log(img, …)</text><rect x="664" y="272" width="320" height="36" rx="6" fill="#f5f5f5"/><rect x="664" y="272" width="320" height="36" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="824" y="294" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">skimage.feature.blob_dog(img, sigma_ratio=1.6)</text><text x="32" y="358" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">the pyramid</text><line x1="232" y1="354" x2="296" y2="354" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="243.6" y="331" width="40.8" height="16" rx="2" fill="#f5f5f5"/><text x="264" y="342" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">exact</text><rect x="304" y="336" width="344" height="36" rx="6" fill="#f5f5f5"/><rect x="304" y="336" width="344" height="36" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="476" y="358" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">cv2.pyrDown · cv2.pyrUp(dstsize=…)</text><rect x="664" y="336" width="320" height="36" rx="6" fill="#f5f5f5"/><rect x="664" y="336" width="320" height="36" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="824" y="358" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">cv2.buildPyramid(img, maxlevel)</text><text x="32" y="422" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Poisson editing</text><line x1="232" y1="418" x2="296" y2="418" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="253.52" y="395" width="20.96" height="16" rx="2" fill="#f5f5f5"/><text x="264" y="406" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">—</text><rect x="304" y="400" width="344" height="36" rx="6" fill="#f5f5f5"/><rect x="304" y="400" width="344" height="36" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="476" y="422" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one 5-point equation per pixel</text><rect x="664" y="400" width="320" height="36" rx="6" fill="#f5f5f5"/><rect x="664" y="400" width="320" height="36" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="824" y="422" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">any sparse linear solver</text><text x="32" y="472" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">ddepth: CV_16S or CV_64F, never 8-bit — the negative half is the half the zero-crossing needs</text><line x1="32" y1="504" x2="984" y2="504" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="520" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><rect x="108" y="512" width="10" height="10" rx="2" fill="#2d3142" fill-opacity="0.18" stroke="#2d3142" stroke-width="0.8"/><text x="126" y="521" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">the call that runs the job</text><rect x="341.20000000000005" y="512" width="10" height="10" rx="2" fill="#4f5d75" fill-opacity="0.18" stroke="#4f5d75" stroke-width="0.8"/><text x="359.20000000000005" y="521" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">the alternative</text><rect x="495.20000000000005" y="512" width="10" height="10" rx="2" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36" stroke-width="0.8"/><text x="513.2" y="521" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">the one whose scale surprises people</text>
</svg>