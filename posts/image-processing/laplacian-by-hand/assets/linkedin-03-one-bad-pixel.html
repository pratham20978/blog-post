<text x="80" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.24em">why nobody runs the raw stencil</text><text x="1000" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">3 / 6</text><line x1="80" y1="148" x2="1000" y2="148" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="232" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">One bad pixel.</text><text x="80" y="300" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">A 134% error.</text><text x="80" y="374" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">At its own location the hot pixel scores −860, 5.4 times the</text><text x="80" y="404" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">genuine edge. At the edge pixel next to it, 375 instead of 160.</text><text x="80" y="500" fill="#7a8399" font-size="15" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">the same window, one bad pixel three columns from nothing</text><rect x="80" y="524" width="96" height="96" fill="#ffffff" stroke="rgba(45,49,66,0.26)" stroke-width="0.8"/><text x="128.0" y="576.0" fill="#2d3142" font-size="30" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">40</text><rect x="176" y="524" width="96" height="96" fill="#ffffff" stroke="rgba(45,49,66,0.26)" stroke-width="0.8"/><text x="224.0" y="576.0" fill="#2d3142" font-size="30" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">40</text><rect x="272" y="524" width="96" height="96" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.26)" stroke-width="0.8"/><text x="320.0" y="576.0" fill="#2d3142" font-size="30" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">200</text><rect x="80" y="620" width="96" height="96" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/><text x="128.0" y="672.0" fill="#eb6c36" font-size="30" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">255</text><rect x="176" y="620" width="96" height="96" fill="rgba(45,49,66,0.10)" stroke="#2d3142" stroke-width="0.8"/><text x="224.0" y="672.0" fill="#2d3142" font-size="30" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">40</text><rect x="272" y="620" width="96" height="96" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.26)" stroke-width="0.8"/><text x="320.0" y="672.0" fill="#2d3142" font-size="30" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">200</text><rect x="80" y="716" width="96" height="96" fill="#ffffff" stroke="rgba(45,49,66,0.26)" stroke-width="0.8"/><text x="128.0" y="768.0" fill="#2d3142" font-size="30" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">40</text><rect x="176" y="716" width="96" height="96" fill="#ffffff" stroke="rgba(45,49,66,0.26)" stroke-width="0.8"/><text x="224.0" y="768.0" fill="#2d3142" font-size="30" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">40</text><rect x="272" y="716" width="96" height="96" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.26)" stroke-width="0.8"/><text x="320.0" y="768.0" fill="#2d3142" font-size="30" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">200</text><text x="416" y="570" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">neighbour sum</text><text x="416" y="604" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">40 + 40 + 255 + 200 = 535</text><text x="416" y="660" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">minus four times the centre</text><text x="416" y="694" fill="#eb6c36" font-size="30" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">535 − 160 = 375</text><text x="416" y="750" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">was 160 without it</text><text x="416" y="784" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">a 134% error</text><line x1="80" y1="860" x2="1000" y2="860" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="300" y="904" fill="#7a8399" font-size="15" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em"></text><text x="620" y="904" fill="#7a8399" font-size="15" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">raw</text><text x="860" y="904" fill="#7a8399" font-size="15" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">after σ = 0.8</text><text x="80" y="948" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">clean edge</text><text x="620" y="948" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">160</text><text x="860" y="948" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">45.3</text><text x="80" y="988" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">with the bad pixel</text><text x="620" y="988" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">375</text><text x="860" y="988" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">21.1</text><text x="80" y="1028" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">error</text><text x="620" y="1028" fill="#eb6c36" font-size="22" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">+215</text><text x="860" y="1028" fill="#eb6c36" font-size="22" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">−24</text><text x="80" y="1108" fill="#7a8399" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the damage falls nine times over; the relative error is still 53%, because σ = 0.8 &lt; one pixel</text><line x1="80" y1="1176" x2="1000" y2="1176" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="1216" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Smooth first. Every discrete Laplacian without a σ is a defect</text><text x="80" y="1246" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">detector first and an edge detector second.</text><text x="80" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.16em">the laplacian by hand</text><text x="1000" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">canery</text>
