<text x="80" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.24em">the library is not the math</text><text x="1000" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">4 / 6</text><line x1="80" y1="148" x2="1000" y2="148" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="232" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">ksize=3 is not</text><text x="80" y="300" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">a smoother ksize=1.</text><text x="80" y="374" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Change one argument and every value quadruples, the</text><text x="80" y="404" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">threshold you tuned yesterday passes everything, and the</text><text x="80" y="434" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">hot pixel's smear moves one diagonal step.</text><text x="80" y="500" fill="#7a8399" font-size="15" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">cv2.Laplacian(img, CV_64F, ksize=1)</text><rect x="80" y="524" width="88" height="88" fill="#ffffff" stroke="rgba(45,49,66,0.26)" stroke-width="0.8"/><text x="124.0" y="572.0" fill="#7a8399" font-size="30" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0</text><rect x="168" y="524" width="88" height="88" fill="#ffffff" stroke="rgba(45,49,66,0.26)" stroke-width="0.8"/><text x="212.0" y="572.0" fill="#2d3142" font-size="30" font- y="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0</text><rect x="736" y="700" width="88" height="88" fill="#ffffff" stroke="rgba(45,49,66,0.26)" stroke-width="0.8"/><text x="780.0" y="748.0" fill="#2d3142" font-size="30" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">2</text><rect x="824" y="700" width="88" height="88" fill="#ffffff" stroke="rgba(45,49,66,0.26)" stroke-width="0.8"/><text x="868.0" y="748.0" fill="#7a8399" font-size="30" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0</text><rect x="912" y="700" width="88" height="88" fill="#ffffff" stroke="rgba(45,49,66,0.26)" stroke-width="0.8"/><text x="956.0" y="748.0" fill="#2d3142" font-size="30" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">2</text><text x="868" y="830" fill="#eb6c36" font-size="22" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">≈ 4 × ∇²</text><text x="868" y="862" fill="#4f5d75" font-size="15" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">at the edge: 640</text><line x1="80" y1="912" x2="1000" y2="912" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="960" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">The docs say Sobel second derivatives. The source says a</text><text x="80" y="992" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">precomputed 3×3 — and it is the Sobel pair summed: diagonals only,</text><text x="80" y="1024" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">four times the scale. A hot pixel now spills onto its diagonal</text><text x="80" y="1056" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">neighbours instead of the ones beside it.</text><text x="80" y="1112" fill="#eb6c36" font-size="15" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">pass scale=0.25 to compare — on smooth data only</text><line x1="80" y1="1176" x2="1000" y2="1176" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="1216" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">There are at least five 3×3 Laplacians. They agree on smooth</text><text x="80" y="1246" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">data and disagree on exactly the pixels you care about.</text><text x="80" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.16em">the laplacian by hand</text><text x="1000" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">canery</text>
