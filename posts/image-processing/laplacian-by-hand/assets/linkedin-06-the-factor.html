<text x="80" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.24em">the tooling map</text><text x="1000" y="120" fill="#eb6c36" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">6 / 6</text><line x1="80" y1="148" x2="1000" y2="148" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="232" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">The library is the</text><text x="80" y="300" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">math — with a factor.</text><text x="80" y="374" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Every call applies a scale the docs mention on a different</text><text x="80" y="404" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">page. Written on the arrow, none of them is a surprise.</text><text x="80" y="530" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">five-point</text><rect x="280" y="500" width="520" height="48" rx="6" fill="#f5f5f5"/><rect x="280" y="500" width="520" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="540" y="530" fill="#2d3142" font-size="17" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">cv2.Laplacian(…, ksize=1)</text><text x="1000" y="530" fill="#4f5d75" font-size="22" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">× 1</text><text x="80" y="602" fill="#eb6c36" font-size="20" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">diagonal</text><rect x="280" y="572" width="520" height="48" rx="6" fill="#f5f5f5"/><rect x="280" y="572" width="520" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="540" y="602" fill="#eb6c36" font-size="17" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">cv2.Laplacian(…, ksize=3)</text><text x="1000" y="602" fill="#eb6c36" font-size="22" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">× 4</text><text x="80" y="674" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">LoG</text><rect x="280" y="644" width="520" height="48" rx="6" fill="#f5f5f5"/><rect x="280" y="644" width="520" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="540" y="674" fill="#2d3142" font-size="17" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">scipy.ndimage.gaussian_laplace</text><text x="1000" y="674" fill="#4f5d75" font-size="22" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">no σ²</text><text x="80" y="746" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">blob scale</text><rect x="280" y="716" width="520" height="48" rx="6" fill="#f5f5f5"/><rect x="280" y="716" width="520" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="540" y="746" fill="#2d3142" font-size="17" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">skimage.feature.blob_log</text><text x="1000" y="746" fill="#4f5d75" font-size="22" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">× σ²</text><text x="80" y="818" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">blob scale</text><rect x="280" y="788" width="520" height="48" rx="6" fill="#f5f5f5"/><rect x="280" y="788" width="520" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="540" y="818" fill="#2d3142" font-size="17" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">skimage.feature.blob_dog</text><text x="1000" y="818" fill="#4f5d75" font-size="22" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">× 1/(k−1)</text><text x="80" y="890" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">pyramid</text><rect x="280" y="860" width="520" height="48" rx="6" fill="#f5f5f5"/><rect x="280" y="860" width="520" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="540" y="890" fill="#2d3142" font-size="17" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">cv2.pyrDown · cv2.pyrUp</text><text x="1000" y="890" fill="#4f5d75" font-size="22" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">exact</text><line x1="80" y1="940" x2="1000" y2="940" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="988" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Never write the Laplacian into 8 bits: the negative half is</text><text x="80" y="1020" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">the half the zero-crossing needs, and convertScaleAbs</text><text x="80" y="1052" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">throws it away before you can look for one.</text><line x1="80" y1="1176" x2="1000" y2="1176" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="1216" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Sixteen figures, one 5×5 patch, thirty-one sources, and every</text><text x="80" y="1246" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">number worked by hand before any library was named.</text><text x="80" y="1300" fill="#eb6c36" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.16em">read it on canery →</text><text x="1000" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">canery</text>
