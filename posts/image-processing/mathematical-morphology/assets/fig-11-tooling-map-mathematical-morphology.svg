ont-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">disk(2): 13 px</text><text x="600" y="388" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">build the array</text><text x="800" y="388" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">periodic lines, n = 4</text><rect x="28" y="416" width="960" height="54" fill="rgba(45,49,66,0.03)"/><text x="32" y="442" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">RECONSTRUCTION</text><text x="190" y="442" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">none in imgproc</text><text x="400" y="442" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">reconstruction(), 3×3</text><text x="600" y="442" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">binary_propagation</text><text x="800" y="442" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">imreconstruct, 8-conn</text><text x="32" y="496" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">PINNED</text><text x="190" y="496" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">802cf95, 4.10–4.12</text><text x="400" y="496" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">b700edc, 0.25.2, 0.26.0</text><text x="600" y="496" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">1.18.1</text><text x="800" y="496" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">R2026b</text><text x="32" y="544" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Orange marks the behaviour most likely to surprise. scikit-image's next namespace, skimage2, drops its own mirroring, so grey dilation reflects as SciPy's does, and defaults to 'ignore'.</text>
