: pass a strel</text><text x="32" y="172" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">OUTSIDE, EROSION</text><text x="190" y="172" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">max of the type: ignored</text><text x="400" y="172" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">grey 'reflect', binary ignored</text><text x="600" y="172" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">binary: 0, erodes edges</text><text x="800" y="172" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">+∞: ignored</text><rect x="28" y="200" width="960" height="54" fill="rgba(45,49,66,0.03)"/><text x="32" y="226" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">DILATION REFLECTS</text><text x="190" y="226" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">no: same offsets as erode</text><text x="400" y="226" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">binary yes, grey no</text><text x="600" y="226" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">yes</text><text x="800" y="226" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">yes</text><text x="32" y="280" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">ASYMMETRIC ELEMENT</text><tex