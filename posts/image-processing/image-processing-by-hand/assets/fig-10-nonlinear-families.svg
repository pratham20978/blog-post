nospace" text-anchor="middle" letter-spacing="0.04em">min and max, with set semantics</text><rect x="32" y="280" width="952" height="40" rx="6" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" stroke-dasharray="4,3"/><text x="508" y="304" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">none of them is a weighted sum, so none of them has a transfer function</text><line x1="32" y1="344" x2="984" y2="344" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="360" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><rect x="108" y="352" width="10" height="10" rx="2" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36" stroke-width="0.8"/><text x="126" y="361" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">no free parameter</text><rect x="276.4" y="352" width="10" height="10" rx="2" fill="#2d3142" fill-opacity="0.18" stroke="#2d3142" stroke-width="0.8"/><text x="294.4" y="361" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">takes a parameter</text>
