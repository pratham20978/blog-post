<text x="32" y="44" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">ONE 3X3 PASS VS TWO 1-D PASSES</text><rect x="32" y="128" width="112" height="72" rx="6" fill="#f5f5f5"/><rect x="32" y="128" width="112" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="88.0" y="166.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Input</text><text x="88.0" y="180.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">row of pixels</text><rect x="232" y="64" width="200" height="72" rx="6" fill="#f5f5f5"/><rect x="232" y="64" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="332.0" y="102.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">3 × 3 stencil</text><text x="332.0" y="116.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">9 multiplies / pixel</text><rect x="232" y="216" width="168" height="72" rx="6" fill="#f5f5f5"/><rect x="232" y="216" width="168" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="316.0" y="254.0" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Row pass 1 × 3</text><text x="316.0" y="268.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">3 multiplies</text><rect x="456" y="216" width="168" height="72" rx="6" fill="#f5f5f5"/><rect x="456" y="216" width="168" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="540.0" y="254.0" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Column pass 3 × 1</text><text x="540.0" y="268.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">3 multiplies</text><rect x="760" y="128" width="112" height="72" rx="6" fill="#f5f5f5"/><rect x="760" y="128" width="112" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="816.0" y="166.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Output</text><text x="816.0" y="180.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">identical</text><path d="M 144 164 H 224 Q 232 164 232 156 V 100" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="432" y1="100" x2="752" y2="100" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><path d="M 144 164 H 224 Q 232 164 232 172 V 252" fill="none" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow-accent)"/><line x1="400" y1="252" x2="452" y2="252" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow-accent)"/><path d="M 624 252 H 748 Q 756 252 756 244 V 176" fill="none" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow-accent)"/><rect x="564.0" y="82" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="592" y="91" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">9 MULTS</text><rect x="664.0" y="234" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="692" y="243" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">6 MULTS</text><text x="508" y="316" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">k × k costs k² one way and 2k the other: 9 vs 6 at k = 3, 225 vs 30 at k = 15</text>
