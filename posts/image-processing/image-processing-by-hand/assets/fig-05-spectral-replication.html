<p class="eyebrow">STAGE 1 — SAMPLE</p>
<h1>Why aliasing cannot be fixed afterwards</h1>
<p class="sub">Sampling copies the spectrum at every multiple of the sampling frequency.</p>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1016 516" width="1016" height="516" role="img">

  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="32" y="44" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">SAMPLING REPLICATES THE SPECTRUM</text><line x1="96" y1="184" x2="920" y2="184" stroke="#bfc0c0" stroke-width="0.8"/><polygon points="80,184 212,96 344,184" fill="#4f5d75" fill-opacity="0.06" stroke="#4f5d75" stroke-width="1"/><polygon points="376,184 508,96 640,184" fill="#2d3142" fill-opacity="0.1" stroke="#2d3142" stroke-width="1"/><polygon points="672,184 804,96 936,184" fill="#4f5d75" fill-opacity="0.06" stroke="#4f5d75" stroke-width="1"/><text x="212" y="202" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">-ωs</text><text x="508" y="202" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">0</text><text x="804" y="202" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">+ωs</text><text x="96" y="88" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">SAMPLED FAST ENOUGH — COPIES CLEAR EACH OTHER</text><line x1="96" y1="392" x2="920" y2="392" stroke="#bfc0c0" stroke-width="0.8"/><polygon points="168,392 300,304 432,392" fill="#4f5d75" fill-opacity="0.06" stroke="#4f5d75" stroke-width="1"/><polygon points="376,392 508,304 640,392" fill="#2d3142" fill-opacity="0.1" stroke="#2d3142" stroke-width="1"/><polygon points="584,392 716,304 848,392" fill="#4f5d75" fill-opacity="0.06" stroke="#4f5d75" stroke-width="1"/><polygon points="376,392 404.0,373.3333333333333 432,392" fill="#eb6c36" fill-opacity="0.22" stroke="#eb6c36" stroke-width="1"/><polygon points="584,392 612.0,373.3333333333333 640,392" fill="#eb6c36" fill-opacity="0.22" stroke="#eb6c36" stroke-width="1"/><text x="300" y="410" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">-ωs</text><text x="508" y="410" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">0</text><text x="716" y="410" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">+ωs</text><text x="96" y="296" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">SAMPLED TOO SLOWLY — COPIES SUM IN THE OVERLAP</text><text x="508" y="440" fill="#eb6c36" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">aliasing: the overlap is added before you ever see a sample</text><line x1="32" y1="464" x2="984" y2="464" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="480" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><rect x="108" y="472" width="10" height="10" rx="2" fill="#2d3142" fill-opacity="0.18" stroke="#2d3142" stroke-width="0.8"/><text x="126" y="481" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">baseband</text><rect x="211.6" y="472" width="10" height="10" rx="2" fill="#4f5d75" fill-opacity="0.18" stroke="#4f5d75" stroke-width="0.8"/><text x="229.6" y="481" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">replicas</text><rect x="315.2" y="472" width="10" height="10" rx="2" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36" stroke-width="0.8"/><text x="333.2" y="481" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">aliased energy</text>
