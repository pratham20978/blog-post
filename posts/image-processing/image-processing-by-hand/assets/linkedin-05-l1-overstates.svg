<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img">
  <defs>
    <style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');/*]]>*/</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="80" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.24em">the default nobody checks</text><text x="1000" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">5 / 6</text><line x1="80" y1="148" x2="1000" y2="148" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="232" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">Your edge threshold</text><text x="80" y="300" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">is orientation-biased.</text><text x="80" y="374" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">cv2.Canny defaults to L2gradient=False, so it measures</text><text x="80" y="404" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">magnitude as |Gx| + |Gy| rather than the hypotenuse.</text><text x="150" y="660" fill="#7a8399" font-size="15" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">the gradient at a 45° edge</text><line x1="170" y1="1060" x2="540" y2="1060" stroke="#bfc0c0" stroke-width="1"/><line x1="170" y1="1060" x2="170" y2="690" stroke="#bfc0c0" stroke-width="1"/><text x="554" y="1066" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Gx</text><text x="158" y="676" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">Gy</text><polyline points="170,1060 467.6,1060 467.6,762.4" fill="none" stroke="#4f5d75" stroke-width="3.5"/><rect x="296.85" y="1080" width="43.900000000000006" height="23" rx="2" fill="#f5f5f5"/><text x="318.8" y="1098" fill="#4f5d75" font-size="15" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">480</text><rect x="493.65000000000003" y="893.2" width="43.900000000000006" height="23" rx="2" fill="#f5f5f5"/><text x="515.6" y="911.2" fill="#4f5d75" font-size="15" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">480</text><line x1="170" y1="1060" x2="467.6" y2="762.4" stroke="#eb6c36" stroke-width="4"/><circle cx="467.6" cy="762.4" r="8" fill="#eb6c36"/><text x="282" y="1028" fill="#7a8399" font-size="15" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">45°</text><rect x="580" y="620" width="420" height="126" rx="6" fill="#f5f5f5"/><rect x="580" y="620" width="420" height="126" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/><text x="606" y="664" fill="#4f5d75" font-size="17" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">L1  |480| + |480|</text><text x="606" y="696" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">OpenCV's Canny default</text><text x="974" y="732" fill="#4f5d75" font-size="40" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">960</text><rect x="580" y="772" width="420" height="126" rx="6" fill="#f5f5f5"/><rect x="580" y="772" width="420" height="126" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="606" y="816" fill="#eb6c36" font-size="17" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">L2  √(480² + 480²)</text><text x="606" y="848" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">the true magnitude</text><text x="974" y="884" fill="#eb6c36" font-size="40" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">678.8</text><rect x="670.4" y="945" width="239.2" height="26" rx="2" fill="#f5f5f5"/><text x="790.0" y="966" fill="#eb6c36" font-size="18" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">larger by exactly √2</text><line x1="80" y1="1176" x2="1000" y2="1176" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="1216" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">At 45° the reported magnitude is 41% too large.</text><text x="80" y="1246" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Where either component is zero, the two agree.</text><text x="80" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.16em">image processing by hand</text><text x="1000" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">canery</text>
</svg>