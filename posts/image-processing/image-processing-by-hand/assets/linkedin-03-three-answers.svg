<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img">
  <defs>
    <style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');/*]]>*/</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="80" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.24em">worked by hand, on real integers</text><text x="1000" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">3 / 6</text><line x1="80" y1="148" x2="1000" y2="148" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="232" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">Same nine numbers.</text><text x="80" y="300" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">Three answers.</text><text x="80" y="374" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">A 3 × 3 neighbourhood: eight pixels at 40, one bad</text><text x="80" y="404" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">pixel at 255. Three operators that all claim to denoise.</text><text x="100" y="572" fill="#7a8399" font-size="15" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">the identical nine numbers</text><rect x="100" y="600" width="110" height="110" fill="#ffffff" stroke="rgba(45,49,66,0.26)" stroke-width="0.8"/><text x="155.0" y="659.0" fill="#2d3142" font-size="30" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">40</text><rect x="210" y="600" width="110" height="110" fill="#ffffff" stroke="rgba(45,49,66,0.26)" stroke-width="0.8"/><text x="265.0" y="659.0" fill="#2d3142" font-size="30" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">40</text><rect x="320" y="600" width="110" height="110" fill="#ffffff" stroke="rgba(45,49,66,0.26)" stroke-width="0.8"/><text x="375.0" y="659.0" fill="#2d3142" font-size="30" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">40</text><rect x="100" y="710" width="110" height="110" fill="#ffffff" stroke="rgba(45,49,66,0.26)" stroke-width="0.8"/><text x="155.0" y="769.0" fill="#2d3142" font-size="30" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">40</text><rect x="210" y="710" width="110" height="110" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/><text x="265.0" y="769.0" fill="#eb6c36" font-size="30" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">255</text><rect x="320" y="710" width="110" height="110" fill="#ffffff" stroke="rgba(45,49,66,0.26)" stroke-width="0.8"/><text x="375.0" y="769.0" fill="#2d3142" font-size="30" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">40</text><rect x="100" y="820" width="110" height="110" fill="#ffffff" stroke="rgba(45,49,66,0.26)" stroke-width="0.8"/><text x="155.0" y="879.0" fill="#2d3142" font-size="30" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">40</text><rect x="210" y="820" width="110" height="110" fill="#ffffff" stroke="rgba(45,49,66,0.26)" stroke-width="0.8"/><text x="265.0" y="879.0" fill="#2d3142" font-size="30" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">40</text><rect x="320" y="820" width="110" height="110" fill="#ffffff" stroke="rgba(45,49,66,0.26)" stroke-width="0.8"/><text x="375.0" y="879.0" fill="#2d3142" font-size="30" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">40</text><rect x="500" y="596" width="500" height="112" rx="6" fill="#f5f5f5"/><rect x="500" y="596" width="500" height="112" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/><text x="528" y="640" fill="#4f5d75" font-size="16" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">BOX MEAN</text><text x="528" y="676" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">smears it across nine pixels</text><text x="972" y="670" fill="#4f5d75" font-size="48" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">64</text><rect x="500" y="724" width="500" height="112" rx="6" fill="#f5f5f5"/><rect x="500" y="724" width="500" height="112" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/><text x="528" y="768" fill="#4f5d75" font-size="16" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">GAUSSIAN</text><text x="528" y="804" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">27% of the weight on the bad pixel</text><text x="972" y="798" fill="#4f5d75" font-size="48" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">99</text><rect x="500" y="852" width="500" height="112" rx="6" fill="#f5f5f5"/><rect x="500" y="852" width="500" height="112" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="528" y="896" fill="#eb6c36" font-size="16" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">MEDIAN</text><text x="528" y="932" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">removes it exactly</text><text x="972" y="926" fill="#eb6c36" font-size="48" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">40</text><rect x="284.31000000000006" y="1020" width="511.37999999999994" height="25" rx="2" fill="#f5f5f5"/><text x="540.0" y="1040" fill="#eb6c36" font-size="17" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">only one of the three actually removed anything</text><line x1="80" y1="1176" x2="1000" y2="1176" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="1216" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">The Gaussian does worse than the box, because it</text><text x="80" y="1246" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">puts 27% of its weight on the one wrong pixel.</text><text x="80" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.16em">image processing by hand</text><text x="1000" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">canery</text>
</svg>