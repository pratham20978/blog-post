ily="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.16em">read it on canery →</text><text x="1000" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">canery</text>
