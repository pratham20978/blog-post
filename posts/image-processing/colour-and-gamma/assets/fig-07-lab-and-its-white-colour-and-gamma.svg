.0)</text><text x="272.71174645436867" y="430.96014817997906" fill="#eb6c36" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">(−22.6, −57.0)</text><text x="399.0" y="123.0" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">white (0, 0)</text><text x="367.62070936728014" y="220.41070567982052" fill="#eb6c36" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">white (−2.4, −19.4)</text><rect x="540.0" y="74.0" width="30.0" height="30.0" rx="0" fill="rgb(40,200,255)" stroke="rgba(45,49,66,0.45)" stroke-width="0.8"/><text x="582" y="86" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the azure (40, 200, 255)</text><text x="582" y="101" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">a* and b* in the plot; L* in the list</text><circle cx="546.0" cy="146.0" r="4.2" fill="#2d3142"/><text x="560" y="150" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">D65: OpenCV, scikit-image, MATLAB</text><text x="560" y="170" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">azure (75.4, −20.8, −38.0)</text><text x="560" y="188" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">sRGB's own white; the default in all three</text><circle cx="546.0" cy="238.0" r="4.2" fill="#2e5aa8"/><text x="560" y="242" fill="#2e5aa8" font-size="9.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">D50 by Bradford adaptation: CSS</text><text x="560" y="262" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, 