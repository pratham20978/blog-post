xt x="32" y="168" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">GREY WEIGHTS</text><text x="196" y="168" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">0.299, 0.587, 0.114</text><text x="406" y="168" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">0.2125, 0.7154, 0.0721</text><text x="616" y="168" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">0.299, 0.587, 0.114</text><text x="790" y="168" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">0.298936…, 0.587043…, 0.114021…</text><rect x="28" y="192" width="960" height="50" fill="rgba(45,49,66,0.03)"/><text x="32" y="218" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">DECODES FIRST?</text><text x="196" y="218" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">no: luma, 158</text><text x="406" y="218" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">no: luma, 0.6665</text><text x="616" y="218" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">no: luma, 158</text><text x="790" y="218" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">no: luma, 158.44</text><text x="32" y="268" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">DOCS CALL IT</text><text x="196" y="268" fill="#2