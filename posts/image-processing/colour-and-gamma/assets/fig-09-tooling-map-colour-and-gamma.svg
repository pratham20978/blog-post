amily="'Geist Mono', ui-monospace, monospace" text-anchor="start">decode first with rgb2lin</text><rect x="28" y="492" width="960" height="50" fill="rgba(45,49,66,0.03)"/><text x="32" y="518" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">PINNED</text><text x="196" y="518" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">802cf95; 4.10, 4.14, 5.0</text><text x="406" y="518" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">b700edc, 0.26.0</text><text x="616" y="518" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">12.3.0</text><text x="790" y="518" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">R2026b</text><text x="32" y="570" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Tangerine: the call weighs codes, or its documentation says otherwise. Blue: the call decodes sRGB first and so works on light. — : not covered here.</text><text x="32" y="586" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Values are for the azure (40, 200, 255); scikit-image's are on its 0-to-1 float scale.</text>
