<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Three small graphical models side by side: a VAE with a learned encoder, a hierarchical VAE with a chain of learned encoders, and a diffusion model whose encoder chain is fixed and whose latents have the image&#x27;s size"><defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="arrow-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
<marker id="arrow-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
</defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="60" y="52" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="start" letter-spacing="0.18em">DIFFUSION IS A HIERARCHICAL VAE WITH A FROZEN ENCODER</text><text x="60" y="112" fill="#2d3142" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">VARIATIONAL AUTOENCODER</text><rect x="60" y="162" width="88" height="60" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="60" y="162" width="88" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="104.0" y="192.0" fill="#2d3142" font-size="13" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="middle">x</text><text x="104.0" y="212.0" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="middle" letter-spacing="0.06em">data</text><rect x="278" y="162" width="88" height="60" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="278" y="162" width="88" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="322.0" y="192.0" fill="#2d3142" font-size="13" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="middle">z</text><text x="322.0" y="212.0" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="middle" letter-spacing="0.06em">smaller latent</text><line x1="148" y1="174" x2="278" y2="174" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="278" y1="210" x2="148" y2="210" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-a)"/><rect x="183.2" y="148" width="59.6" height="15" rx="3" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="213.0" y="158" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="middle">qφ learned</text><rect x="183.2" y="232" width="59.6" height="15" rx="3" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="213.0" y="242" fill="#eb6c36" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="middle">pθ learned</text><text x="60" y="282" fill="#4f5d75" font-size="10" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start">1 latent, smaller than x</text><text x="60" y="302" fill="#4f5d75" font-size="10" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start">encoder and decoder both trained</text><text x="426" y="112" fill="#2d3142" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">HIERARCHICAL VAE</text><rect x="426" y="162" width="88" height="60" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="426" y="162" width="88" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="470.0" y="192.0" fill="#2d3142" font-size="13" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="middle">x</text><text x="470.0" y="212.0" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="middle" letter-spacing="0.06em">data</text><rect x="556" y="162" width="88" height="60" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="556" y="162" width="88" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="600.0" y="192.0" fill="#2d3142" font-size="13" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="middle">z<tspan font-size="8.58" dy="2.86">1</tspan></text><rect x="686" y="162" width="88" height="60" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="686" y="162" width="88" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="730.0" y="192.0" fill="#2d3142" font-size="13" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="middle">z<tspan font-size="8.58" dy="2.86">2</tspan></text><line x1="514" y1="174" x2="556" y2="174" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="556" y1="210" x2="514" y2="210" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-a)"/><rect x="525.04" y="148" width="19.92" height="15" rx="3" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="535.0" y="158" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="middle">qφ</text><rect x="525.04" y="232" width="19.92" height="15" rx="3" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="535.0" y="242" fill="#eb6c36" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="middle">pθ</text><line x1="644" y1="174" x2="686" y2="174" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="686" y1="210" x2="644" y2="210" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-a)"/><rect x="655.04" y="148" width="19.92" height="15" rx="3" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="665.0" y="158" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="middle">qφ</text><rect x="655.04" y="232" width="19.92" height="15" rx="3" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="665.0" y="242" fill="#eb6c36" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="middle">pθ</text><text x="426" y="282" fill="#4f5d75" font-size="10" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start">a chain of latents</text><text x="426" y="302" fill="#4f5d75" font-size="10" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start">every arrow trained</text><text x="792" y="112" fill="#eb6c36" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">DIFFUSION MODEL</text><rect x="792" y="162" width="88" height="60" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="792" y="162" width="88" height="60" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="836.0" y="192.0" fill="#eb6c36" font-size="13" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="middle">x<tspan font-size="8.58" dy="2.86">0</tspan></text><text x="836.0" y="212.0" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="middle" letter-spacing="0.06em">image</text><rect x="922" y="162" width="88" height="60" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="922" y="162" width="88" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="966.0" y="192.0" fill="#2d3142" font-size="13" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="middle">x<tspan font-size="8.58" dy="2.86">t</tspan></text><text x="966.0" y="212.0" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="middle" letter-spacing="0.06em">same size</text><rect x="1052" y="162" width="88" height="60" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="1052" y="162" width="88" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="1096.0" y="192.0" fill="#2d3142" font-size="13" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="middle">x<tspan font-size="8.58" dy="2.86">T</tspan></text><text x="1096.0" y="212.0" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="middle" letter-spacing="0.06em">≈ N(0, I)</text><line x1="880" y1="174" x2="922" y2="174" stroke="#7a8399" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="5,4"/><line x1="922" y1="210" x2="880" y2="210" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-a)"/><rect x="878.64" y="148" width="44.72" height="15" rx="3" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="901.0" y="158" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="middle">q fixed</text><rect x="891.04" y="232" width="19.92" height="15" rx="3" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="901.0" y="242" fill="#eb6c36" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="middle">pθ</text><line x1="1010" y1="174" x2="1052" y2="174" stroke="#7a8399" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="5,4"/><line x1="1052" y1="210" x2="1010" y2="210" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-a)"/><rect x="1008.64" y="148" width="44.72" height="15" rx="3" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="1031.0" y="158" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="middle">q fixed</text><rect x="1021.04" y="232" width="19.92" height="15" rx="3" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="1031.0" y="242" fill="#eb6c36" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="middle">pθ</text><text x="792" y="282" fill="#4f5d75" font-size="10" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start">latents the size of the image</text><text x="792" y="302" fill="#4f5d75" font-size="10" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start">only the reverse arrows trained</text><rect x="60" y="340" width="1080" height="62" rx="5" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/><text x="80" y="364" fill="#2d3142" font-size="12" font-family="'Geist Mono',ui-monospace,monospace" font-weight="600" text-anchor="start">log p(x) = ELBO + KL( encoder ‖ true posterior )</text><text x="80" y="388" fill="#4f5d75" font-size="10" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start">In a VAE either side can shrink that gap. In diffusion the encoder cannot move, so the reverse chain must close it alone.</text><rect x="60" y="430" width="1080" height="30" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="74" y="449" fill="#2d3142" font-size="10" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="start">Set T = 1 and the diffusion bound is the ordinary VAE bound; freeze the encoder and every KL becomes Gaussian.</text></svg>