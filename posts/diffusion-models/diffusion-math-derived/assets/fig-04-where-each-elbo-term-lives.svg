<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 440" width="1180" height="440" role="img" aria-label="The chain from x-zero to x-T with three brackets: the prior term at the noise end, one denoising-matching term per intermediate step, and the reconstruction term at the image end, each marked with whether it touches the network"><defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="arrow-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
<marker id="arrow-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
</defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="60" y="52" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="start" letter-spacing="0.18em">WHERE EACH TERM OF THE BOUND LIVES ON THE CHAIN</text><rect x="70" y="120" width="96" height="50" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="70" y="120" width="96" height="50" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="118.0" y="145.0" fill="#eb6c36" font-size="13" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="middle">x<tspan font-size="8.58" dy="2.86">0</tspan></text><rect x="250" y="120" width="96" height="50" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="250" y="120" width="96" height="50" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="298.0" y="145.0" fill="#2d3142" font-size="13" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="middle">x<tspan font-size="8.58" dy="2.86">1</tspan></text><rect x="500" y="120" width="96" height="50" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="500" y="120" width="96" height="50" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="548.0" y="145.0" fill="#2d3142" font-size="13" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="middle">x<tspan font-size="8.58" dy="2.86">t−1</tspan></text><rect x="680" y="120" width="96" height="50" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="680" y="120" width="96" height="50" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="728.0" y="145.0" fill="#2d3142" font-size="13" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="middle">x<tspan font-size="8.58" dy="2.86">t</tspan></text><rect x="960" y="120" width="96" height="50" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="960" y="120" width="96" height="50" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="1008.0" y="145.0" fill="#2d3142" font-size="13" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="middle">x<tspan font-size="8.58" dy="2.86">T</tspan></text><text x="423.0" y="150" fill="#7a8399" font-size="16" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="middle">· · ·</text><text x="868.0" y="150" fill="#7a8399" font-size="16" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="middle">· · ·</text><line x1="166" y1="133" x2="250" y2="133" stroke="#7a8399" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="5,4"/><line x1="250" y1="157" x2="166" y2="157" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-a)"/><line x1="596" y1="133" x2="680" y2="133" stroke="#7a8399" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="5,4"/><line x1="680" y1="157" x2="596" y2="157" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-a)"/><rect x="185.64" y="104" width="44.72" height="15" rx="3" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="208.0" y="114" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="middle">q fixed</text><rect x="175.72" y="180" width="64.56" height="15" rx="3" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="208.0" y="190" fill="#eb6c36" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="middle">pθ(x₀ | x₁)</text><rect x="588.36" y="104" width="99.28" height="15" rx="3" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="638.0" y="114" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="middle">q(xₜ | xₜ₋₁) fixed</text><rect x="600.76" y="180" width="74.48" height="15" rx="3" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="638.0" y="190" fill="#eb6c36" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="middle">pθ(xₜ₋₁ | xₜ)</text><path d="M70,214 v10 H346 v-10" fill="none" stroke="#eb6c36" stroke-width="1.4"/><text x="208.0" y="248" fill="#eb6c36" font-size="11" font-family="'Geist Mono',ui-monospace,monospace" font-weight="600" text-anchor="middle"><tspan>L₀  reconstruction</tspan></text><text x="208.0" y="268" fill="#2d3142" font-size="10" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="middle"><tspan>−log pθ(x₀ | x₁)</tspan></text><text x="208.0" y="286" fill="#4f5d75" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="middle">discrete decoder, once</text><text x="208.0" y="304" fill="#eb6c36" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" font-weight="600" text-anchor="middle">trains θ</text><path d="M500,214 v10 H776 v-10" fill="none" stroke="#eb6c36" stroke-width="1.4"/><text x="638.0" y="248" fill="#eb6c36" font-size="11" font-family="'Geist Mono',ui-monospace,monospace" font-weight="600" text-anchor="middle"><tspan>Lₜ₋₁  denoising matching</tspan></text><text x="638.0" y="268" fill="#2d3142" font-size="10" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="middle"><tspan>KL( q(xₜ₋₁|xₜ,x₀) ‖ pθ(xₜ₋₁|xₜ) )</tspan></text><text x="638.0" y="286" fill="#4f5d75" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="middle">teacher sees x₀, student does not · t = 2 … T</text><text x="638.0" y="304" fill="#eb6c36" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" font-weight="600" text-anchor="middle">trains θ at every noise level</text><path d="M920,214 v10 H1096 v-10" fill="none" stroke="#7a8399" stroke-width="1.4"/><text x="1008.0" y="248" fill="#7a8399" font-size="11" font-family="'Geist Mono',ui-monospace,monospace" font-weight="600" text-anchor="middle"><tspan>L</tspan><tspan font-size="7.48" dy="2.75">T</tspan><tspan font-size="11" dy="-2.75">  prior matching</tspan></text><text x="1008.0" y="268" fill="#2d3142" font-size="10" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="middle"><tspan>KL( q(x</tspan><tspan font-size="6.8" dy="2.5">T</tspan><tspan font-size="10" dy="-2.5"> | x₀) ‖ N(0, I) )</tspan></text><text x="1008.0" y="286" fill="#4f5d75" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="middle">≈ 1e-5 bits/dim in DDPM</text><text x="1008.0" y="304" fill="#7a8399" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" font-weight="600" text-anchor="middle">no θ: a constant</text><rect x="60" y="366" width="1060" height="30" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="74" y="385" fill="#2d3142" font-size="10" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="start">Only the middle bracket repeats. Every noise level the denoiser learns, it learns there.</text></svg>