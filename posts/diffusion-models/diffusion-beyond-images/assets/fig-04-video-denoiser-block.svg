</defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="40" y="46" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="start" letter-spacing="0.18em">STABLE VIDEO DIFFUSION&#x27;S DENOISER, FIRST LEVEL · 14 FRAMES AT 576 × 1024 IN A 4-CHANNEL LATENT AT 1/8 PER SIDE</text><rect x="250.0" y="84" width="300" height="62" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="250.0" y="84" width="300" height="62" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="400.0" y="115.0" fill="#2d3142" font-size="12" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="middle">Noisy latent clip</text><text x="400.0" y="135.0" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="middle" letter-spacing="0.06em">B × 14 × 8 × 72 × 128  (4 noisy + 4 condition)</text><rect x="250.0" y="192" width="300" height="62" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="250.0" y="192" width="300" height="62" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="400.0" y="223.0" fill="#2d3142" font-size="12" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="middle">conv_in, per frame</text><text x="400.0" y="243.0" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="middle" letter-spacing="0.06em">8 → 320 channels</text><rect x="250.0" y="300" width="300" height="62" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="250.0" y="300" width="300" height="62" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400.0" y="331.0" fill="#2d3142" font-size="12" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="middle">Spatial ResBlock + attention</text><text x="400.0" y="351.0" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="middle" letter-spacing="0.06em">9,216 tokens per frame; frames never meet</text><rect x="250.0" y="408" width="300" height="62" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="250.0" y="408" width="300" height="62" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="400.0" y="439.0" fill="#eb6c36" font-size="12" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="middle">Temporal conv + attention</text><text x="400.0" y="459.0" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="middle" letter-spacing="0.06em">14 tokens per position · where frames meet</text><rect x="250.0" y="516" width="300" height="62" rx="6" fill="#f5f5f5" stroke="none" stroke-width="1"/><rect x="250.0" y="516" width="300" height="62" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="400.0" y="547.0" fill="#2d3142" font-size="12" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="middle">Next level, then decoder</text><text x="400.0" y="567.0" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="middle" letter-spacing="0.06em">same pattern at 36 × 64 and 18 × 32</text><line x1="400" y1="148" x2="400" y2="190" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><text x="414" y="167.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="start" letter-spacing="0.06em">B·14 × 8 × 72 × 128</text><text x="414" y="180.0" fill="#7a8399" font-size="7" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">frames as batch</text><line x1="400" y1="256" x2="400" y2="298" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><text x="414" y="275.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="start" letter-spacing="0.06em">B·14 × 320 × 72 × 128</text><text x="414" y="288.0" fill="#7a8399" font-size="7" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">frames as batch</text><line x1="400" y1="364" x2="400" y2="406" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-a)"/><text x="414" y="383.0" fill="#eb6c36" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="start" letter-spacing="0.06em">B·9,216 × 14 × 320</text><text x="414" y="396.0" fill="#7a8399" font-size="7" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">reshape: positions as batch</text><line x1="400" y1="472" x2="400" y2="514" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><text x="414" y="491.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="start" letter-spacing="0.06em">B·14 × 320 × 72 × 128</text><text x="414" y="504.0" fill="#7a8399" font-size="7" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">reshape back</text><path d="M234.0,300 H224.0 V362 H234.0" fill="none" stroke="#4f5d75" stroke-width="1"/><text x="216.0" y="318" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="end" letter-spacing="0.06em">IMAGE MODEL&#x27;S LAYERS</text><text x="216.0" y="334" fill="#7a8399" font-size="7" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="end" letter-spacing="0.06em">Align your Latents</text><text x="216.0" y="346" fill="#7a8399" font-size="7" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="end" letter-spacing="0.06em">keeps these frozen</text><path d="M234.0,408 H224.0 V470 H234.0" fill="none" stroke="#eb6c36" stroke-width="1"/><text x="216.0" y="432" fill="#eb6c36" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="end" letter-spacing="0.06em">NEW LAYERS</text><text x="216.0" y="446" fill="#7a8399" font-size="7" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="end" letter-spacing="0.06em">656M of SVD&#x27;s</text><text x="216.0" y="458" fill="#7a8399" font-size="7" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="end" letter-spacing="0.06em">1,521M parameters</text><rect x="690" y="300" width="246" height="220" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/><text x="704" y="322" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="start" letter-spacing="0.18em">TOKEN PAIRS SCORED PER LAYER</text><text x="704" y="348" fill="#2d3142" font-size="11" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="start">spatial</text><text x="704" y="364" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">14 × 9,216² = 1,189,085,184</text><text x="704" y="392" fill="#eb6c36" font-size="11" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="start">temporal</text><text x="704" y="408" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">9,216 × 14² = 1,806,336</text><text x="704" y="436" fill="#4f5d75" font-size="11" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="start">full space-time</text><text x="704" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">(14 × 9,216)² = 16,647,192,576</text><text x="704" y="484" fill="#2d3142" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">full attention would score 14× the</text><text x="704" y="498" fill="#2d3142" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">spatial pass&#x27;s pairs</text><text x="40" y="650" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">Shapes from SVD&#x27;s inference config (4 latent channels, ch_mult [1, 2, 4, 4]) and the paper&#x27;s 14 frames at 576 × 1024.</text><text x="40" y="668" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">Token pairs computed from those shapes for one attention layer at this level; B is the batch size.</text></svg>