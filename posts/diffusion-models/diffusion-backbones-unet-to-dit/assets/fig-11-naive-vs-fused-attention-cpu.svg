t-weight="400" text-anchor="start" letter-spacing="0.06em">Naive: softmax(QKᵀ/√d)·V written out. Fused: torch.nn.functional.scaled_dot_product_attention, profiler op _scaled_dot_product_flash_attention_for_cpu.</text><text x="60" y="434" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">Times vary between runs and machines; the arithmetic of the two paths is identical.</text></svg>