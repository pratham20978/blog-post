"6" fill="#2d3142"/><rect x="438.28931807094773" y="304.0" width="129.04" height="15" rx="3" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="502.8093180709477" y="314.0" fill="#2d3142" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="600" text-anchor="middle">DiT-XL/2 · 512 px · 0.89</text><circle cx="823.6" cy="328.0" r="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.6"/><rect x="754.1530109114701" y="304.0" width="138.96" height="15" rx="3" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="823.6330109114701" y="314.0" fill="#2d3142" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="600" text-anchor="middle">DiT-XL/2 · 2048 px · 14.22</text><circle cx="731.2" cy="228.0" r="6" fill="#5e7a9b"/><rect x="738.2355392607835" y="204.0" width="134.0" height="15" rx="3" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="743.2355392607835" y="214.0" fill="#5e7a9b" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="600" text-anchor="start">SDXL · 64×64 level · 6.40</text><circle cx="811.4" cy="228.0" r="6" fill="#5e7a9b"/><rect x="738.4414624709141" y="244.0" width="148.88" height="15" rx="3" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="743.4414624709141" y="254.0" fill="#5e7a9b" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="600" text-anchor="start">SD 1.5 · 64×64 level · 12.80</text><circle cx="634.2" cy="128.0" r="6" fill="#eb6c36"/><rect x="503.1234335868176" y="104.0" width="124.08" height="15" rx="3" fill="#f5f5f5" stroke="none" stroke-width="1"/><text x="622.2034335868176" y="114.0" fill="#eb6c36" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="600" text-anchor="end">SD3-2B · 1024 px · 2.77</text><text x="271.0969173559276" y="370" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono',ui-monospace,monospace" font-weight="600" text-anchor="start" letter-spacing="0.06em">← UNIFORM TRANSFORMER PAYS OFF</text><text x="902.0166494105067" y="370" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono',ui-monospace,monospace" font-weight="600" text-anchor="end" letter-spacing="0.06em">ATTENTION DOMINATES →</text><text x="60" y="438" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">Right of N = 6D, attention is over half of a transformer block: go hierarchical (U-Net, U-DiT), local (HDiT), or at least fused.</text><text x="60" y="452" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">U-Net positions use the width at their finest attended grid (320 for SD 1.5, 640 for SDXL); SDXL removed attention from its 128×128 level.</text><text x="60" y="466" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">Hollow: DiT-XL/2 run at 2048 px, a configuration it was not trained at, shown for its token count.</text></svg>