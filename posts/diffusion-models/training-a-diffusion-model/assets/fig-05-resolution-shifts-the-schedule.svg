">shifted for 4× the side  −2.8</text><rect x="128.0" y="362.7142857142857" width="318" height="30" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="142.0" y="381.7142857142857" fill="#2d3142" font-size="10" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="start">SHIFT −2.8 + POOL 4×4 = THE BLACK CURVE AGAIN</text><text x="40" y="460" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">Averaging an s×s window multiplies SNR by s², so log-SNR rises by 2 ln s (simple diffusion, eq. 4). simple diffusion shifts by 2 ln(d/64); SD3 at 1024² by 2 ln 3 = 2.2.</text><text x="40" y="476" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">Cosine schedule λ = −2 ln tan(πt/2), as simple diffusion writes it; computed, not measured.</text></svg>