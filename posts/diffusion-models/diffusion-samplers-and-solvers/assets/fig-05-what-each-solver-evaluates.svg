<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="Seven samplers drawn as one step on a log-SNR axis, with dots where each calls the denoiser: one call for DDIM, two for Heun, three for DPM-Solver-3, one plus a reused call for DPM-Solver++(2M)"><defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="arrow-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
<marker id="arrow-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
</defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="40" y="36" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="start" letter-spacing="0.18em">ONE STEP FROM σ TO σ′ ON A LOG-SNR AXIS · FILLED = A NEW DENOISER CALL, HOLLOW = REUSED</text><text x="330" y="66" fill="#2d3142" font-size="10" font-family="'Geist Mono',ui-monospace,monospace" font-weight="600" text-anchor="middle" letter-spacing="0.06em">σ</text><text x="560" y="66" fill="#2d3142" font-size="10" font-family="'Geist Mono',ui-monospace,monospace" font-weight="600" text-anchor="middle" letter-spacing="0.06em">σ′</text><text x="170" y="66" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">NOISIER</text><text x="650" y="66" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="end" letter-spacing="0.06em">CLEANER</text><text x="40" y="94" fill="#2d3142" font-size="12" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="start">DDIM / Euler</text><text x="40" y="110" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">order 1 · 1 NFE</text><line x1="165" y1="92" x2="655" y2="92" stroke="#bfc0c0" stroke-width="1"/><line x1="330" y1="86" x2="330" y2="98" stroke="#bfc0c0" stroke-width="1"/><line x1="560" y1="86" x2="560" y2="98" stroke="#bfc0c0" stroke-width="1"/><path d="M337.0,80.0 L554.0,80.0" fill="none" stroke="#eb6c36" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arrow-a)"/><circle cx="330" cy="92" r="5" fill="#eb6c36"/><text x="680" y="90" fill="#2d3142" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="start" letter-spacing="0.06em">x′ = D + (σ′/σ)(x − D)</text><text x="680" y="104" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">exact if D does not move</text><text x="40" y="164" fill="#2d3142" font-size="12" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="start">Heun (EDM)</text><text x="40" y="180" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">order 2 · 2 NFE</text><line x1="165" y1="162" x2="655" y2="162" stroke="#bfc0c0" stroke-width="1"/><line x1="330" y1="156" x2="330" y2="168" stroke="#bfc0c0" stroke-width="1"/><line x1="560" y1="156" x2="560" y2="168" stroke="#bfc0c0" stroke-width="1"/><path d="M337.0,150.0 L554.0,150.0" fill="none" stroke="#eb6c36" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arrow-a)"/><circle cx="330" cy="162" r="5" fill="#eb6c36"/><circle cx="560" cy="162" r="5" fill="#eb6c36"/><text x="680" y="160" fill="#2d3142" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="start" letter-spacing="0.06em">Euler to σ′, call D there,</text><text x="680" y="174" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">average the two slopes</text><text x="40" y="234" fill="#2d3142" font-size="12" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="start">DPM-Solver-2</text><text x="40" y="250" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">order 2 · 2 NFE</text><line x1="165" y1="232" x2="655" y2="232" stroke="#bfc0c0" stroke-width="1"/><line x1="330" y1="226" x2="330" y2="238" stroke="#bfc0c0" stroke-width="1"/><line x1="560" y1="226" x2="560" y2="238" stroke="#bfc0c0" stroke-width="1"/><path d="M337.0,220.0 L554.0,220.0" fill="none" stroke="#eb6c36" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arrow-a)"/><circle cx="330" cy="232" r="5" fill="#eb6c36"/><circle cx="445.0" cy="232" r="5" fill="#eb6c36"/><text x="680" y="230" fill="#2d3142" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="start" letter-spacing="0.06em">first-order step to √(σσ′);</text><text x="680" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">its noise estimate drives the step</text><text x="40" y="304" fill="#2d3142" font-size="12" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="start">DPM-Solver-3</text><text x="40" y="320" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">order 3 · 3 NFE</text><line x1="165" y1="302" x2="655" y2="302" stroke="#bfc0c0" stroke-width="1"/><line x1="330" y1="296" x2="330" y2="308" stroke="#bfc0c0" stroke-width="1"/><line x1="560" y1="296" x2="560" y2="308" stroke="#bfc0c0" stroke-width="1"/><path d="M337.0,290.0 L554.0,290.0" fill="none" stroke="#eb6c36" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arrow-a)"/><circle cx="330" cy="302" r="5" fill="#eb6c36"/><circle cx="406.6666666666667" cy="302" r="5" fill="#eb6c36"/><circle cx="483.33333333333337" cy="302" r="5" fill="#eb6c36"/><text x="680" y="300" fill="#2d3142" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="start" letter-spacing="0.06em">two inner calls at 1/3 and 2/3</text><text x="680" y="314" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">of the log-SNR step</text><text x="40" y="374" fill="#2d3142" font-size="12" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="start">DPM-Solver++(2M)</text><text x="40" y="390" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">order 2 · 1 NFE</text><line x1="165" y1="372" x2="655" y2="372" stroke="#bfc0c0" stroke-width="1"/><line x1="330" y1="366" x2="330" y2="378" stroke="#bfc0c0" stroke-width="1"/><line x1="560" y1="366" x2="560" y2="378" stroke="#bfc0c0" stroke-width="1"/><path d="M337.0,360.0 L554.0,360.0" fill="none" stroke="#eb6c36" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arrow-a)"/><circle cx="180" cy="372" r="5" fill="#f5f5f5" stroke="#eb6c36" stroke-width="1.6"/><text x="180" y="392" fill="#7a8399" font-size="7" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="middle" letter-spacing="0.06em">LAST STEP&#x27;S D</text><circle cx="330" cy="372" r="5" fill="#eb6c36"/><text x="680" y="370" fill="#2d3142" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="start" letter-spacing="0.06em">D extrapolated from this call</text><text x="680" y="384" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">and the last: (1 + 1/2r)Dᵢ − (1/2r)Dᵢ₋₁</text><text x="40" y="444" fill="#2d3142" font-size="12" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="start">Ancestral, η = 1</text><text x="40" y="460" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">stochastic · 1 NFE</text><line x1="165" y1="442" x2="655" y2="442" stroke="#bfc0c0" stroke-width="1"/><line x1="330" y1="436" x2="330" y2="448" stroke="#bfc0c0" stroke-width="1"/><line x1="560" y1="436" x2="560" y2="448" stroke="#bfc0c0" stroke-width="1"/><path d="M337.0,430.0 L628.0,430.0" fill="none" stroke="#eb6c36" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arrow-a)"/><text x="480.0" y="424" fill="#eb6c36" font-size="7" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="middle" letter-spacing="0.06em">STEP TO σ_DOWN</text><circle cx="630" cy="442" r="3" fill="#f5f5f5" stroke="#7a8399" stroke-width="1.2"/><path d="M626.0,454.0 L566.0,454.0" fill="none" stroke="#2e5aa8" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arrow-l)"/><text x="595.0" y="466" fill="#2e5aa8" font-size="7" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="middle" letter-spacing="0.06em">+ NOISE σ_UP</text><circle cx="330" cy="442" r="5" fill="#eb6c36"/><text x="680" y="440" fill="#2d3142" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="start" letter-spacing="0.06em">overshoot to σ_down = σ′²/σ,</text><text x="680" y="454" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">then add fresh noise σ_up</text><text x="40" y="514" fill="#2d3142" font-size="12" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="start">EDM stochastic</text><text x="40" y="530" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">stochastic · 2 NFE</text><line x1="165" y1="512" x2="655" y2="512" stroke="#bfc0c0" stroke-width="1"/><line x1="330" y1="506" x2="330" y2="518" stroke="#bfc0c0" stroke-width="1"/><line x1="560" y1="506" x2="560" y2="518" stroke="#bfc0c0" stroke-width="1"/><path d="M326.0,524.0 L276.0,524.0" fill="none" stroke="#2e5aa8" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arrow-l)"/><text x="300.0" y="536" fill="#2e5aa8" font-size="7" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="middle" letter-spacing="0.06em">+ NOISE</text><path d="M277.0,500.0 L554.0,500.0" fill="none" stroke="#eb6c36" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arrow-a)"/><text x="415.0" y="494" fill="#eb6c36" font-size="7" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="middle" letter-spacing="0.06em">HEUN STEP FROM (1 + γ)σ</text><circle cx="270" cy="512" r="5" fill="#eb6c36"/><circle cx="560" cy="512" r="5" fill="#eb6c36"/><text x="680" y="510" fill="#2d3142" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="start" letter-spacing="0.06em">add noise up to (1 + γ)σ,</text><text x="680" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">then one Heun step to σ′</text><text x="40" y="582" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">To scale on a log-SNR axis except two marks: the ancestral overshoot, which really reaches as far past σ′ as σ is before it,</text><text x="40" y="598" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">and 2M&#x27;s previous call, drawn after a step two-thirds as long. Every method ends with a plain DDIM step to σ = 0.</text></svg>