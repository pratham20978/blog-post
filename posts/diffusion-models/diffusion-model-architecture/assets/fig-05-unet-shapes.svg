<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A U-shaped tensor trace descends from 4 by 64 by 64 to 512 by 8 by 8 and climbs back, one dashed skip joining each resolution to its mirror"><defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="arrow-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
<marker id="arrow-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
</defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="44" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="start" letter-spacing="0.18em">BLOCK SIZE IS THE TENSOR SHAPE</text><rect x="104" y="118.0" width="16" height="100" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="112.0" y="106.0" fill="#2d3142" font-size="11" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="middle">Input</text><text x="112.0" y="236.0" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="middle" letter-spacing="0.06em">4×64×64</text><rect x="188" y="216.0" width="48" height="72" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="212.0" y="204.0" fill="#2d3142" font-size="11" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="middle">Down 1</text><text x="212.0" y="306.0" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="middle" letter-spacing="0.06em">128×32×32</text><rect x="300" y="296.0" width="66" height="52" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="333.0" y="284.0" fill="#2d3142" font-size="11" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="middle">Down 2</text><text x="333.0" y="366.0" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="middle" letter-spacing="0.06em">256×16×16</text><rect x="430" y="361.0" width="88" height="38" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/><text x="474.0" y="349.0" fill="#eb6c36" font-size="11" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="middle">Middle</text><text x="474.0" y="417.0" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="middle" letter-spacing="0.06em">512×8×8</text><rect x="588" y="296.0" width="66" height="52" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="621.0" y="284.0" fill="#2d3142" font-size="11" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="middle">Up 2</text><text x="621.0" y="366.0" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="middle" letter-spacing="0.06em">256×16×16</text><rect x="700" y="216.0" width="48" height="72" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="724.0" y="204.0" fill="#2d3142" font-size="11" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="middle">Up 1</text><text x="724.0" y="306.0" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="middle" letter-spacing="0.06em">128×32×32</text><rect x="792" y="118.0" width="16" height="100" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="800.0" y="106.0" fill="#2d3142" font-size="11" font-family="'Geist',system-ui,sans-serif" font-weight="600" text-anchor="middle">Output</text><text x="800.0" y="236.0" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="middle" letter-spacing="0.06em">4×64×64</text><line x1="120" y1="218" x2="196" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="236" y1="288" x2="296" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="366" y1="348" x2="424" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="518" y1="380" x2="582" y2="342" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="654" y1="296" x2="696" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="748" y1="216" x2="788" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="120" y1="150" x2="792" y2="150" stroke="#5e7a9b" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-l)"/><line x1="236" y1="234" x2="700" y2="234" stroke="#5e7a9b" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-l)"/><line x1="366" y1="304" x2="588" y2="304" stroke="#5e7a9b" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-l)"/><text x="456" y="132" fill="#5e7a9b" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="middle" letter-spacing="0.06em">EACH SKIP JOINS ONE RESOLUTION TO ITS MIRROR</text><rect x="60" y="404" width="300" height="62" rx="6" fill="rgba(45,49,66,0.04)" stroke="#bfc0c0" stroke-width="1"/><text x="76" y="428" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">height  =  spatial resolution</text><text x="76" y="450" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">width   =  channel count</text><text x="600" y="428" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">the pyramid trades one for the other</text><text x="600" y="450" fill="#eb6c36" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">64² × 4ch  →  8² × 512ch</text><line x1="32" y1="484" x2="928" y2="484" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="500" fill="#7a8399" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" text-anchor="start" letter-spacing="0.18em">LEGEND</text><rect x="120" y="488" width="12" height="12" rx="2" fill="#eb6c3622" stroke="#eb6c36" stroke-width="0.8"/><text x="140" y="498" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">bottleneck</text><rect x="254" y="488" width="12" height="12" rx="2" fill="#2e5aa822" stroke="#2e5aa8" stroke-width="0.8"/><text x="274" y="498" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">long skip</text><rect x="381" y="488" width="12" height="12" rx="2" fill="#4f5d7522" stroke="#4f5d75" stroke-width="0.8"/><text x="401" y="498" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" font-weight="400" text-anchor="start" letter-spacing="0.06em">main path</text></svg>