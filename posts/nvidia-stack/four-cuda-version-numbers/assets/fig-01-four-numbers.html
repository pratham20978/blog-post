<p class="eyebrow">PART 2 · FIGURE 1</p>
<h1>The four CUDA version numbers</h1>
<p class="sub">Each number is a property of one artifact. The fourth column is the one that matters: only rows 2 and 3 take part in the decision that lets a program run.</p>

e</text><text x="736" y="306" fill="#7a8399" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">never discovered at run time</text><rect x="40" y="346" width="880" height="84" rx="6" fill="#f5f5f5"/><rect x="40" y="346" width="880" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><circle cx="68" cy="388.0" r="13" fill="none" stroke="#2d3142" stroke-width="1"/><text x="68" y="393.0" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">4</text><text x="92" y="380" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Toolkit compiler</text><text x="92" y="400" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">version looks like  13.4</text><line x1="340" y1="358" x2="340" y2="418" stroke="#bfc0c0" stroke-width="0.8"/><text x="360" y="386" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">nvcc</text><text x="360" y="404" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.10em">Toolkit</text><line x1="560" y1="358" x2="560" y2="418" stroke="#bfc0c0" stroke-width="0.8"/><text x="580" y="392" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">nvcc --version</text><line x1="720" y1="358" x2="720" y2="418" stroke="#bfc0c0" stroke-width="0.8"/><text x="736" y="384" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">which compiler is installed</text><text x="736" y="400" fill="#7a8399" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">says nothing about what runs</text><line x1="32" y1="468" x2="
