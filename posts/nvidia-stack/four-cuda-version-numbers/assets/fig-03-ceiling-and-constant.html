<p class="eyebrow">PART 2 · FIGURE 3</p>
<h1>A ceiling, and three constants</h1>
<p class="sub">The host fixes one ceiling. Each application carries a constant. What decides the launch is the major family, not whether the runtime sits above the ceiling.</p>
