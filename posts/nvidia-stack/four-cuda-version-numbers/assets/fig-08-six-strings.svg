  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="40" y="44" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">ONE `PIP INSTALL TORCH`, SIX VERSION STRINGS</text><rect x="40" y="74" width="880" height="48" rx="5" fill="#f5f5f5"/><rect x="40" y="74" width="880" height="48" rx="5" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="60" y="103.0" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">2.14.0</text><line x1="230" y1="84" x2="230" y2="112" stroke="#bfc0c0" stroke-width="0.8"/><text x="250" y="102.0" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">PyPI distribution version</text><line x1="510" y1="84" x2="510" y2="112" stroke="#bfc0c0" stroke-width="0.8"/><text x="530" y="102.0" fill="#7a8399" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">what the resolver matched</text><rect x="40" y="130" width="880" height="48" rx="5" fill="#f5f5f5"/><rect x="40" y="130" width="880" height="48" rx="5" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="60" y="159.0" fill="#eb6c36" font-size="13" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">2.14.0+cu130</text><line x1="230" y1="140" x2="230" y2="168" stroke="#bfc0c0" stroke-width="0.8"/><text x="250" y="158.0" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">torch.__version__</text><line x1="510" y1="140" x2="510" y2="168" stroke="#bfc0c0" stroke-width="0.8"/><text x="530" y="158.0" fill="#7a8399" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">a PEP 440 local label — no semantics</text><rect x="40" y="186" width="880" height="48" rx="5" fill="#f5f5f5"/><rect x="40" y="186" width="880" height="48" rx="5" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="60" y="215.0" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">13.0</text><line x1="230" y1="196" x2="230" y2="224" stroke="#bfc0c0" stroke-width="0.8"/><text x="250" y="214.0" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">torch.version.cuda</text><line x1="510" y1="196" x2="510" y2="224" stroke="#bfc0c0" stroke-width="0.8"/><text x="530" y="214.0" fill="#7a8399" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">the build-time CUDA, recorded at build</text><rect x="40" y="242" width="880" height="48" rx="5" fill="#f5f5f5"/><rect x="40" y="242" width="880" height="48" rx="5" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="60" y="271.0" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">13.0.3</text><line x1="230" y1="252" x2="230" y2="280" stroke="#bfc0c0" stroke-width="0.8"/><text x="250" y="270.0" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">cuda-toolkit pin</text><line x1="510" y1="252" x2="510" y2="280" stroke="#bfc0c0" stroke-width="0.8"/><text x="530" y="270.0" fill="#7a8399" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">a meta-package release, not a CUDA release</text><rect x="40" y="298" width="880" height="48" rx="5" fill="#f5f5f5"/><rect x="40" y="298" width="880" height="48" rx="5" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="60" y="327.0" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">13.0.96</text><line x1="230" y1="308" x2="230" y2="336" stroke="#bfc0c0" stroke-width="0.8"/><text x="250" y="326.0" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">nvidia-cuda-runtime pin</text><line x1="510" y1="308" x2="510" y2="336" stroke="#bfc0c0" stroke-width="0.8"/><text x="530" y="326.0" fill="#7a8399" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">the component wheel's own version</text><rect x="40" y="354" width="880" height="48" rx="5" fill="#f5f5f5"/><rect x="40" y="354" width="880" height="48" rx="5" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="60" y="383.0" fill="#eb6c36" font-size="13" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">13000</text><line x1="230" y1="364" x2="230" y2="392" stroke="#bfc0c0" stroke-width="0.8"/><text x="250" y="382.0" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">CUDART_VERSION</text><line x1="510" y1="364" x2="510" y2="392" stroke="#bfc0c0" stroke-width="0.8"/><text x="530" y="382.0" fill="#7a8399" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">the constant the runtime actually reports</text><text x="480.0" y="442" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="middle" font-style="italic">Six namespaces. No two of these strings are interchangeable, and only the last one is compared against anything.</text><line x1="32" y1="488" x2="928" y2="488" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="504" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><rect x="108" y="496" width="10" height="10" rx="2" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36" stroke-width="0.8"/><text x="126" y="505" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">read as a requirement, but is not one</text><rect x="420.40000000000003" y="496" width="10" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="1"/><text x="438.40000000000003" y="505" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">a name in some other namespace</text>
</svg>