  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="40" y="44" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">WHICH COMMAND REPORTS WHICH ARTIFACT'S NUMBER</text><text x="495.0" y="86" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">nvidia.ko</text><text x="495.0" y="102" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">kernel module</text><text x="495.0" y="118" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">number 1</text><text x="625.0" y="86" fill="#eb6c36" font-size="9.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">libcuda.so.1</text><text x="625.0" y="102" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">user-mode driver</text><text x="625.0" y="118" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">number 2</text><rect x="566" y="128" width="118" height="228" rx="4" fill="#eb6c36" fill-opacity="0.06"/><text x="755.0" y="86" fill="#eb6c36" font-size="9.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">libcudart.so.13</text><text x="755.0" y="102" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">in the wheel</text><text x="755.0" y="118" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">number 3</text><rect x="696" y="128" width="118" height="228" rx="4" fill="#eb6c36" fill-opacity="0.06"/><text x="885.0" y="86" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">nvcc</text><text x="885.0" y="102" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Toolkit</text><text x="885.0" y="118" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">number 4</text><line x1="40" y1="170" x2="950" y2="170" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="48" y="154" fill="#2d3142" font-size="10" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">nvidia-smi</text><text x="48" y="167" fill="#7a8399" font-size="8.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">prints two fields at once</text><text x="414" y="156" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">580.65.06  ·  13.0</text><circle cx="495.0" cy="152" r="5.5" fill="#2d3142"/><circle cx="625.0" cy="152" r="5.5" fill="#eb6c36"/><circle cx="755.0" cy="152" r="2" fill="none" stroke="#bfc0c0" stroke-width="0.8"/><circle cx="885.0" cy="152" r="2" fill="none" stroke="#bfc0c0" stroke-width="0.8"/><line x1="40" y1="214" x2="950" y2="214" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="48" y="198" fill="#2d3142" font-size="10" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">cat /proc/driver/nvidia/version</text><text x="48" y="211" fill="#7a8399" font-size="8.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">procfs, no intermediary</text><text x="414" y="200" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">580.65.06</text><circle cx="495.0" cy="196" r="5.5" fill="#2d3142"/><circle cx="625.0" cy="196" r="2" fill="none" stroke="#bfc0c0" stroke-width="0.8"/><circle cx="755.0" cy="196" r="2" fill="none" stroke="#bfc0c0" stroke-width="0.8"/><circle cx="885.0" cy="196" r="2" fill="none" stroke="#bfc0c0" stroke-width="0.8"/><line x1="40" y1="258" x2="950" y2="258" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="48" y="242" fill="#2d3142" font-size="10" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">deviceQuery</text><text x="48" y="255" fill="#7a8399" font-size="8.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">prints the pair</text><text x="414" y="244" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">13.0 / 13.4</text><circle cx="495.0" cy="240" r="2" fill="none" stroke="#bfc0c0" stroke-width="0.8"/><circle cx="625.0" cy="240" r="5.5" fill="#eb6c36"/><circle cx="755.0" cy="240" r="5.5" fill="#eb6c36"/><circle cx="885.0" cy="240" r="2" fill="none" stroke="#bfc0c0" stroke-width="0.8"/><line x1="40" y1="302" x2="950" y2="302" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="48" y="286" fill="#2d3142" font-size="10" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">torch.version.cuda</text><text x="48" y="299" fill="#7a8399" font-size="8.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">the build-time record</text><text x="414" y="288" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">13.0</text><circle cx="495.0" cy="284" r="2" fill="none" stroke="#bfc0c0" stroke-width="0.8"/><circle cx="625.0" cy="284" r="2" fill="none" stroke="#bfc0c0" stroke-width="0.8"/><circle cx="755.0" cy="284" r="5.5" fill="#eb6c36"/><circle cx="885.0" cy="284" r="2" fill="none" stroke="#bfc0c0" stroke-width="0.8"/><line x1="40" y1="346" x2="950" y2="346" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="48" y="330" fill="#2d3142" font-size="10" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">nvcc --version</text><text x="48" y="343" fill="#7a8399" font-size="8.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">often absent entirely</text><text x="414" y="332" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">13.4</text><circle cx="495.0" cy="328" r="2" fill="none" stroke="#bfc0c0" stroke-width="0.8"/><circle cx="625.0" cy="328" r="2" fill="none" stroke="#bfc0c0" stroke-width="0.8"/><circle cx="755.0" cy="328" r="2" fill="none" stroke="#bfc0c0" stroke-width="0.8"/><circle cx="885.0" cy="328" r="5.5" fill="#2d3142"/><rect x="436" y="132" width="118" height="88" rx="4" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4 3"/><text x="200" y="400" fill="#eb6c36" font-size="14" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start" font-style="italic">two commands, one artifact — which is why it is four numbers, not five</text><path d="M 200 386 Q 330 396 495.0 362" fill="none" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,3"/><circle cx="495.0" cy="362" r="2" fill="#eb6c36"/><line x1="32" y1="438" x2="928" y2="438" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="454" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><circle cx="113" cy="451" r="4" fill="#eb6c36"/><text x="126" y="455" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">the two numbers the launch decision compares</text><circle cx="475.8" cy="451" r="4" fill="#2d3142"/><text x="488.8" y="455" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">reported, never decisive</text>
</svg>