<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img">
  <defs>
    <style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');/*]]>*/</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="40" y="44" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">TWO MECHANISMS, TWO BOUNDARIES</text><rect x="286" y="80" width="300" height="58" rx="6" fill="#f5f5f5"/><rect x="286" y="80" width="300" height="58" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="436.0" y="111.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">your application</text><text x="436.0" y="125.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">compiled against a Toolkit</text><rect x="286" y="152" width="300" height="58" rx="6" fill="#f5f5f5"/><rect x="286" y="152" width="300" height="58" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="436.0" y="183.0" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">libcudart.so.13</text><text x="436.0" y="197.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">CUDA runtime · in the wheel</text><rect x="286" y="224" width="300" height="58" rx="6" fill="#f5f5f5"/><rect x="286" y="224" width="300" height="58" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="436.0" y="255.0" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">libcuda.so.1</text><text x="436.0" y="269.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">CUDA user-mode driver · host</text><rect x="286" y="296" width="300" height="58" rx="6" fill="#f5f5f5"/><rect x="286" y="296" width="300" height="58" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="436.0" y="327.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">nvidia.ko</text><text x="436.0" y="341.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">kernel-mode driver · host</text><rect x="286" y="368" width="300" height="58" rx="6" fill="#f5f5f5"/><rect x="286" y="368" width="300" height="58" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="436.0" y="399.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the GPU</text><text x="436.0" y="413.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">hardware</text><path d="M 602 160 H 610 V 274 H 602" fill="none" stroke="#eb6c36" stroke-width="1"/><text x="622" y="220.0" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.10em">minor version compatibility</text><text x="626" y="296" fill="#eb6c36" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the runtime may be NEWER than the driver,</text><text x="626" y="310" fill="#eb6c36" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">within one major family</text><path d="M 270 232 H 262 V 346 H 270" fill="none" stroke="#2e5aa8" stroke-width="1"/><text x="250" y="292.0" fill="#2e5aa8" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.10em">forward compatibility</text><text x="246" y="368" fill="#2e5aa8" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">cuda-compat-13-4 replaces</text><text x="246" y="382" fill="#2e5aa8" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">this library only</text><text x="480.0" y="492" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="middle" font-style="italic">The package swaps the user-mode driver and leaves the kernel module alone. That is exactly why a platform team under change control can accept it.</text><line x1="32" y1="528" x2="928" y2="528" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="544" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><line x1="108" y1="541" x2="120" y2="541" stroke="#eb6c36" stroke-width="1.4"/><text x="126" y="545" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">minor version compatibility · runtime to user-mode driver</text><line x1="564.4000000000001" y1="541" x2="576.4000000000001" y2="541" stroke="#2e5aa8" stroke-width="1.4"/><text x="582.4000000000001" y="545" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">forward compatibility · user-mode driver to kernel module</text>
</svg>