<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img">
  <defs>
    <style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');/*]]>*/</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="40" y="44" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">WHAT MINOR VERSION COMPATIBILITY DOES NOT COVER</text><rect x="40" y="76" width="277.3333333333333" height="196" rx="6" fill="#f5f5f5"/><rect x="40" y="76" width="277.3333333333333" height="196" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/><text x="178.66666666666666" y="116" fill="#eb6c36" font-size="13" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Features spanning</text><text x="178.66666666666666" y="136" fill="#eb6c36" font-size="13" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">toolkit and driver</text><line x1="64" y1="170" x2="293.3333333333333" y2="170" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="178.66666666666666" y="194" fill="#7a8399" font-size="9.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Some capabilities need code on</text><text x="178.66666666666666" y="209" fill="#7a8399" font-size="9.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">both sides.</text><rect x="96.26666666666665" y="240" width="165" height="16" rx="3" fill="#f5f5f5" stroke="#eb6c36" stroke-opacity="0.45" stroke-width="0.8"/><text x="178.76666666666665" y="251.0" fill="#eb6c36" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">cudaErrorCallRequiresNewerDriver</text><text x="178.66666666666666" y="268" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">value 36 in driver_types.h</text><rect x="341.3333333333333" y="76" width="277.3333333333333" height="196" rx="6" fill="#f5f5f5"/><rect x="341.3333333333333" y="76" width="277.3333333333333" height="196" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="480.0" y="116" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Device code compiled</text><text x="480.0" y="136" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">to PTX</text><line x1="365.3333333333333" y1="170" x2="594.6666666666666" y2="170" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="480.0" y="194" fill="#7a8399" font-size="9.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">The driver compiles PTX, so it</text><text x="480.0" y="209" fill="#7a8399" font-size="9.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">joins your toolchain.</text><rect x="383.65" y="240" width="193" height="16" rx="3" fill="#f5f5f5" stroke="#4f5d75" stroke-opacity="0.45" stroke-width="0.8"/><text x="480.15" y="251.0" fill="#4f5d75" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">no error code — it simply will not run</text><rect x="642.6666666666666" y="76" width="277.3333333333333" height="196" rx="6" fill="#f5f5f5"/><rect x="642.6666666666666" y="76" width="277.3333333333333" height="196" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="781.3333333333333" y="116" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">The target architecture</text><text x="781.3333333333333" y="136" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">argument to nvcc</text><line x1="666.6666666666666" y1="170" x2="896.0" y2="170" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="781.3333333333333" y="194" fill="#7a8399" font-size="9.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">A build-time flag. Part 6 of this</text><text x="781.3333333333333" y="209" fill="#7a8399" font-size="9.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">series owns it.</text><rect x="691.9583333333333" y="240" width="179" height="16" rx="3" fill="#f5f5f5" stroke="#4f5d75" stroke-opacity="0.45" stroke-width="0.8"/><text x="781.4583333333333" y="251.0" fill="#4f5d75" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">caught at build time, or not at all</text><text x="480.0" y="320" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="middle" font-style="italic">If any one of these bites, the repair is the pre-CUDA-11 one: install a driver from the same minor version as the toolkit you built with, or newer.</text><line x1="32" y1="366" x2="928" y2="366" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="382" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><rect x="108" y="374" width="10" height="10" rx="2" fill="none" stroke="#eb6c36" stroke-width="1"/><text x="126" y="383" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">announces itself with a named error</text><rect x="406.0" y="374" width="10" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="1"/><text x="424.0" y="383" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">silent — found at build time or at first launch</text>
</svg>