<p class="eyebrow">PART 3 · FIGURE 7</p>
<h1>Host-side sync points</h1>
<p class="sub">What each call waits for, and where it hides in a training loop. The PyTorch rows are the five kinds its Performance Tuning Guide names, plus the default copy.</p>

<text x="640" y="271.0" fill="#7a8399" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">saving, metrics, NumPy</text><rect x="40" y="296" width="880" height="46" rx="5" fill="#f5f5f5"/><rect x="40" y="296" width="880" height="46" rx="5" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="58" y="323.0" fill="#eb6c36" font-size="10.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">t.nonzero()</text><line x1="318" y1="306" x2="318" y2="332" stroke="#bfc0c0" stroke-width="0.8"/><text x="330" y="323.0" fill="#2d3142" font-size="10.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">the GPU, to learn the output's size</text><line x1="628" y1="306" x2="628" y2="332" stroke="#bfc0c0" stroke-width="0.8"/><text x="640" y="323.0" fill="#7a8399" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">finding the indices of a mask</text><rect x="40" y="348" width="880" height="46" rx="5" fill="#f5f5f5"/><rect x="40" y="348" width="880" height="46" rx="5" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="58" y="375.0" fill="#eb6c36" font-size="10.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">if (t != 0).all():</text><line x1="318" y1="358" x2="318" y2="384" stroke="#bfc0c0" stroke-width="0.8"/><text x="330" y="375.0" fill="#2d3142" font-size="10.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">the value, to pick a Python branch</text><line x1="628" y1="358" x2="628" y2="384" stroke="#bfc0c0" stroke-width="0.8"/><text x="640" y="375.0" fill="#7a8399" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">early stopping, guards</text><rect x="40" y="400" width="880" height="46" rx="5" fill="#f5f5f5"/><rect x="40" y="400" width="880" height="46" rx="5" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="58" y="427.0" fill="#eb6c36" font-size="10.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">x.to('cuda')  non_blocking=False</text><line x1="318" y1="410" x2="318" y2="436" stroke="#bfc0c0" stroke-width="0.8"/><text x="330" y="427.0" fill="#2d3142" font-size="10.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">the copy (a stream sync follows it)</text><line x1="628" y1="410" x2="628" y2="436" stroke="#bfc0c0" stroke-width="0.8"/><text x="640" y="427.0" fill="#7a8399" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">every default copy</text><rect x="40" y="452" width="880" height="46" rx="5" fill="#f5f5f5"/><rect x="40" y="452" width="880" height="46" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.28)" stroke-width="1"/><text x="58" y="479.0" fill="#2d3142" font-size="10.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">cudaFree</text><line x1="318" y1="462" x2="318" y2="488" stroke="#bfc0c0" stroke-width="0.8"/><text x="330" y="479.0" fill="#2d3142" font-size="10.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">work queued on all GPUs, possibly</text><line x1="628" y1="462" x2="628" y2="488" stroke="#bfc0c0" stroke-width="0.8"/><text x="640" y="479.0" fill="#7a8399" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">PyTorch's allocator avoids it</text><rect x="40" y="504" width="880" height="46" rx="5" fill="#f5f5f5"/><rect x="40" y="504" width="880" height="46" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.28)" stroke-width="1"/><text x="58" y="531.0" fill="#2d3142" font-size="10.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">CUDA_LAUNCH_BLOCKING=1</text><line x1="318" y1="514" x2="318" y2="540" stroke="#bfc0c0" stroke-width="0.8"/><text x="330" y="531.0" fill="#2d3142" font-size="10.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">every kernel, after every launch</text><line x1="628" y1="514" x2="628" y2="540" stroke="#bfc0c0" stroke-width="0.8"/><text x="640" y="531.0" fill="#7a8399" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">debugging only</text><text x="480.0" y="586" fill="#4f5d75" font-size="11.5" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="middle" font-style="italic">The shaded rows are the ones nobody writes on purpose: each one moves a value, or a decision, from the GPU back to Python.</text><line x1="32" y1="608" x2="928" y2="608" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="624" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><rect x="108" y="616" width="10" height="10" rx="2" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36" stroke-width="0.8"/><text x="126" y="625" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">an implicit sync: no synchronize in sight</text><rect x="449.2" y="616" width="10" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="1"/><text x="467.2" y="625" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">explicit, or outside the training loop</text>
