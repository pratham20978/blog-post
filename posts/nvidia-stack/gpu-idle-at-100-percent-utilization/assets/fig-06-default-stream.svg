<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img">
  <defs>
    <style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');/*]]>*/</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="40" y="44" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">K1 ON STREAM 1, THEN K2 ON STREAM 0, THEN K3 ON STREAM 2</text><rect x="40" y="64" width="420" height="250" rx="6" fill="#f5f5f5"/><rect x="40" y="64" width="420" height="250" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/><text x="56" y="88" fill="#eb6c36" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">blocking streams (cudaStreamCreate)</text><text x="56" y="136" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">stream 1</text><line x1="130" y1="146" x2="444" y2="146" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><rect x="136.00" y="122" width="96.00" height="24" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="184" y="138" fill="#eb6c36" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">k1</text><text x="56" y="192" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">stream 0</text><line x1="130" y1="202" x2="444" y2="202" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><rect x="236.00" y="178" width="96.00" height="24" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="284" y="194" fill="#eb6c36" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">k2</text><text x="56" y="248" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">stream 2</text><line x1="130" y1="258" x2="444" y2="258" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><rect x="336.00" y="234" width="96.00" height="24" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="384" y="250" fill="#eb6c36" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">k3</text><text x="250.0" y="296" fill="#eb6c36" font-size="9.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">stream 0 waits for stream 1, then stream 2 waits for stream 0</text><rect x="500" y="64" width="420" height="250" rx="6" fill="#f5f5f5"/><rect x="500" y="64" width="420" height="250" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.28)" stroke-width="1"/><text x="516" y="88" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">non-blocking streams (cudaStreamNonBlocking)</text><text x="516" y="136" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">stream 1</text><line x1="590" y1="146" x2="904" y2="146" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><rect x="596.00" y="122" width="96.00" height="24" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="644" y="138" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">k1</text><text x="516" y="192" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">stream 0</text><line x1="590" y1="202" x2="904" y2="202" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><rect x="610.00" y="178" width="96.00" height="24" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="658" y="194" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">k2</text><text x="516" y="248" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">stream 2</text><line x1="590" y1="258" x2="904" y2="258" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><rect x="624.00" y="234" width="96.00" height="24" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="672" y="250" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">k3</text><text x="710.0" y="296" fill="#4f5d75" font-size="9.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">stream 0 no longer synchronises with them; they may overlap</text><text x="480.0" y="350" fill="#4f5d75" font-size="11.5" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="middle" font-style="italic">PyTorch's default stream is stream 0; the side streams it hands out are created non-blocking.</text><line x1="32" y1="388" x2="928" y2="388" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="404" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><rect x="108" y="396" width="10" height="10" rx="2" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36" stroke-width="0.8"/><text x="126" y="405" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">serialised by the legacy default stream</text><rect x="434.8" y="396" width="10" height="10" rx="2" fill="none" stroke="#2d3142" stroke-width="1"/><text x="452.8" y="405" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">free to overlap, resources permitting</text>
</svg>