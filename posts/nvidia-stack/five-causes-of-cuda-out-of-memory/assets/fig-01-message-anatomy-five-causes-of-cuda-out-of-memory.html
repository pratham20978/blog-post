<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

         font-family: 'Geist', system-ui, sans-serif; }

              text-transform: uppercase; color: #7a8399; margin: 0 0 6px; }
  h1 { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 1.75rem; margin: 0 0 4px; }

<p class="eyebrow">THE MESSAGE</p>
<h1>One message, six numbers, three instruments</h1>
<p class="sub">The run 1 message with each number tied to what measured it and what it can reveal.</p>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1016 556" width="1016" height="556" role="img">
  <defs>
    <style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');/*]]>*/</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="32" y="40" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">THE FRAGMENTATION RUN'S MESSAGE, ONE SENTENCE PER LINE, AS PYTORCH 2.15.0 PRINTED IT</text><rect x="32.0" y="64.0" width="548.0" height="210.0" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/><text x="78" y="94" fill="#2d3142" font-size="9.6" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">CUDA out of memory. Tried to allocate 256.00 MiB.</text><circle cx="54.0" cy="90.5" r="9" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/><text x="54" y="94" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1</text><text x="78" y="124" fill="#2d3142" font-size="9.6" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">GPU 0 has a total capacity of 121.63 GiB of which 79.59 GiB is free.</text><circle cx="54.0" cy="120.5" r="9" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/><text x="54" y="124" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">2</text><text x="78" y="154" fill="#2d3142" font-size="9.6" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Including non-PyTorch memory, this process has 23.96 GiB memory in use.</text><circle cx="54.0" cy="150.5" r="9" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/><text x="54" y="154" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">4</text><text x="78" y="184" fill="#2d3142" font-size="9.6" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">23.67 GiB allowed;</text><circle cx="54.0" cy="180.5" r="9" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/><text x="54" y="184" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">5</text><text x="78" y="214" fill="#2d3142" font-size="9.6" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Of the allocated memory 19.00 GiB is allocated by PyTorch,</text><circle cx="54.0" cy="210.5" r="9" fill="#f5f5f5" stroke="#eb6c36" stroke-width="1.2"/><text x="54" y="214" fill="#eb6c36" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">6</text><text x="78" y="244" fill="#2d3142" font-size="9.6" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">and 4.63 GiB is reserved by PyTorch but unallocated.</text><circle cx="54.0" cy="240.5" r="9" fill="#f5f5f5" stroke="#eb6c36" stroke-width="1.2"/><text x="54" y="244" fill="#eb6c36" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">6</text><text x="78" y="292" fill="#7a8399" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">(3) other processes would appear here as  Process N has X memory in use.</text><text x="78" y="308" fill="#7a8399" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">    none did: the card held only this process</text><rect x="612.0" y="64.0" width="372.0" height="64.0" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/><circle cx="632.0" cy="84.0" r="9" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/><text x="632" y="87.5" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1</text><text x="650" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">the request</text><text x="972" y="87" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">measured by the allocator</text><text x="650" y="105" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the block or segment it needed,</text><text x="650" y="119" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">rounded up: 3 MiB can read 20 MiB</text><rect x="612.0" y="140.0" width="372.0" height="64.0" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/><circle cx="632.0" cy="160.0" r="9" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/><text x="632" y="163.5" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">2</text><text x="650" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">total and free</text><text x="972" y="163" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">measured by cudaMemGetInfo</text><text x="650" y="181" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the whole device, every process;</text><text x="650" y="195" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">on this GB10, the machine's memory</text><rect x="612.0" y="216.0" width="372.0" height="64.0" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/><circle cx="632.0" cy="236.0" r="9" fill="#f5f5f5" stroke="#2e5aa8" stroke-width="1.2"/><text x="632" y="239.5" fill="#2e5aa8" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">3</text><text x="650" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">other processes</text><text x="972" y="239" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">measured by NVML, compute list</text><text x="650" y="257" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">one line per other CUDA process;</text><text x="650" y="271" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">graphics clients never appear</text><rect x="612.0" y="292.0" width="372.0" height="64.0" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/><circle cx="632.0" cy="312.0" r="9" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/><text x="632" y="315.5" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">4</text><text x="650" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">this process</text><text x="972" y="315" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">measured by NVML</text><text x="650" y="333" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">minus PyTorch's reserved =</text><text x="650" y="347" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">memory outside PyTorch: 0.33 GiB</text><rect x="612.0" y="368.0" width="372.0" height="64.0" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/><circle cx="632.0" cy="388.0" r="9" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/><text x="632" y="391.5" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">5</text><text x="650" y="392" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">allowed</text><text x="972" y="391" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">set by a memory fraction</text><text x="650" y="409" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">only when a fraction caps PyTorch;</text><text x="650" y="423" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">here, the emulated 24 GiB card</text><rect x="612.0" y="444.0" width="372.0" height="64.0" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/><circle cx="632.0" cy="464.0" r="9" fill="#f5f5f5" stroke="#eb6c36" stroke-width="1.2"/><text x="632" y="467.5" fill="#eb6c36" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">6</text><text x="650" y="468" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">allocated, unallocated</text><text x="972" y="467" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">measured by the allocator</text><text x="650" y="485" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">unallocated 4.63 GiB ≥ request</text><text x="650" y="499" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">256.00 MiB: fragmentation</text><text x="78" y="348" fill="#7a8399" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Numbers 2 and 5 come from the emulation's host:</text><text x="78" y="363" fill="#7a8399" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">a real 24 GiB card prints its own total and</text><text x="78" y="378" fill="#7a8399" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">free, and no "allowed" clause.</text><text x="78" y="393" fill="#7a8399" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start"></text><text x="78" y="408" fill="#7a8399" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Numbers 1, 3, 4 and 6 mean the same on any card.</text>
</svg>
