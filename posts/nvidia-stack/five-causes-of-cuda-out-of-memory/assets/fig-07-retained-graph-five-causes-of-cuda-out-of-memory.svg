" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1</text><text x="205.0909090909091" y="391" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">2</text><text x="259.6363636363636" y="391" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">3</text><text x="314.1818181818182" y="391" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">4</text><text x="368.7272727272727" y="391" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">5</text><text x="423.27272727272725" y="391" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">6</text><text x="477.8181818181818" y="391" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">7</text><text x="532.3636363636364" y="391" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">8</text><text x="586.909090909091" y="391" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">9</text><text x="641.4545454545454" y="391" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">10</text><text x="696.0" y="391" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">11</text><line x1="96.0" y1="376.0" x2="696.0" y2="376.0" stroke="#bfc0c0" stroke-width="1.0"/><line x1="96.0" y1="76.0" x2="96.0" y2="376.0" stroke="#bfc0c0" stroke-width="1.0"/><text x="696" y="408" fill="#7a8399" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">evaluation batch</text><line x1="96.0" y1="102.6" x2="696.0" y2="102.6" stroke="#7a8399" stroke-width="1.0" stroke-dasharray="4,3"/><text x="692" y="96.56097412109375" fill="#7a8399" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">allowed 23.67 GiB</text><polyline points="96.0,336.0 150.5,336.0 205.1,336.0 259.6,336.0 314.2,336.0 368.7,336.0 423.3,336.0 477.8,336.0 532.4,336.0 586.9,336.0 641.5,336.0 696.0,336.0" fill="none" stroke="#2e5aa8" stroke-width="1.9" stroke-linejoin="round"/><circle cx="96.0" cy="336.0" r="3.0" fill="#2e5aa8"/><circle cx="150.5" cy="336.0" r="3.0" fill="#2e5aa8"/><circle cx="205.1" cy="336.0" r="3.0" fill="#2e5aa8"/><circle cx="259.6" cy="336.0" r="3.0" fill="#2e5aa8"/><circle cx="314.2" cy="336.0" r="3.0" fill="#2e5aa8"/><circle cx="368.7" cy="336.0" r="3.0" fill="#2e5aa8"/><circle cx="423.3" cy="336.0" r="3.0" fill="#2e5aa8"/><circle cx="477.8" cy="336.0" r="3.0" fill="#2e5aa8"/><circle cx="532.4" cy="336.0" r="3.0" fill="#2e5aa8"/><circle cx="586.9" cy="336.0" r="3.0" fill="#2e5aa8"/><circle cx="641.5" cy="336.0" r="3.0" fill="#2e5aa8"/><circle cx="696.0" cy="336.0" r="3.0" fill="#2e5aa8"/><polyline points="96.0,336.0 150.5,305.1 205.1,274.1 259.6,243.2 314.2,212.2 368.7,181.3 423.3,150.4 477.8,119.4" fill="none" stroke="#eb6c36" stroke-width="1.9" stroke-linejoin="round"/><circle cx="96.0" cy="336.0" r="3.0" fill="#eb6c36"/><circle cx="150.5" cy="305.1" r="3.0" fill="#eb6c36"/><circle cx="205.1" cy="274.1" r="3.0" fill="#eb6c36"/><circle cx="259.6" cy="243.2" r="3.0" fill="#eb6c36"/><circle cx="314.2" cy="212.2" r="3.0" fill="#eb6c36"/><circle cx="368.7" cy="181.3" r="3.0" fill="#eb6c36"/><circle cx="423.3" cy="150.4" r="3.0" fill="#eb6c36"/><line x1="472.8" y1="114.4" x2="482.8" y2="124.4" stroke="#eb6c36" stroke-width="2.2"/><line x1="472.8" y1="124.4" x2="482.8" y2="114.4" stroke="#eb6c36" stroke-width="2.2"/><text x="487.8181818181818" y="123.43748092651367" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">fails asking for 48 MiB</text><text x="270.54545454545456" y="224.0" fill="#eb6c36" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">+1.55 GiB per batch</text><text x="641.4545454545454" y="352.0" fill="#2e5aa8" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">flat at 12.00 GiB</text><text x="742" y="90" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">each batch keeps its graph:</text><text x="742" y="105" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">33 saved tensors × 48 MiB</text><text x="742" y="120" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">= 1,584 MiB</text><text x="742" y="150" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">16 linear-layer inputs,</text><text x="742" y="165" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">16 GELU inputs,</text><text x="742" y="180" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">1 input to the final square</text><text x="742" y="210" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">at the failure, 514 MiB is</text><text x="742" y="225" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">reserved but unallocated:</text><text x="742" y="240" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">alone, that reads as</text><text x="742" y="255" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">fragmentation</text><line x1="32" y1="438" x2="984" y2="438" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="454" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><line x1="108.0" y1="451.0" x2="126.0" y2="451.0" stroke="#eb6c36" stroke-width="1.9"/><text x="132" y="455" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">total = total + loss, grad on</text><line x1="314.6" y1="451.0" x2="332.6" y2="451.0" stroke="#2e5aa8" stroke-width="1.9"/><text x="338.6" y="455" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">under no_grad, summing loss.item()</text><line x1="548.2" y1="451.0" x2="566.2" y2="451.0" stroke="#7a8399" stroke-width="1.4" stroke-dasharray="5,3"/><text x="572.2" y="455" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the allowance</text>
