  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="32" y="40" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">WHY EXPANDABLE SEGMENTS LET FREE SPACE MERGE: ADDRESSES ON TOP, PHYSICAL MEMORY BELOW</text><text x="32" y="72" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">default: one cudaMalloc per segment, each its own address range</text><rect x="32.0" y="88.0" width="180.0" height="44.0" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1.0"/><rect x="32.0" y="88.0" width="120.0" height="44.0" rx="0" fill="#2d3142" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="92.0" y="114" fill="#f5f5f5" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">live 256 MiB</text><rect x="152.0" y="88.0" width="60.0" height="44.0" rx="0" fill="#eb6c36" fill-opacity="0.35" stroke="#eb6c36" stroke-width="1.0"/><text x="182.0" y="114" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">free 128</text><text x="234" y="114" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">· · ·</text><rect x="256.0" y="88.0" width="180.0" height="44.0" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1.0"/><rect x="256.0" y="88.0" width="120.0" height="44.0" rx="0" fill="#2d3142" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="316.0" y="114" fill="#f5f5f5" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">live 256 MiB</text><rect x="376.0" y="88.0" width="60.0" height="44.0" rx="0" fill="#eb6c36" fill-opacity="0.35" stroke="#eb6c36" stroke-width="1.0"/><text x="406.0" y="114" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">free 128</text><text x="458" y="114" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">· · ·</text><rect x="480.0" y="88.0" width="180.0" height="44.0" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1.0"/><rect x="480.0" y="88.0" width="120.0" height="44.0" rx="0" fill="#2d3142" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="540.0" y="114" fill="#f5f5f5" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">live 256 MiB</text><rect x="600.0" y="88.0" width="60.0" height="44.0" rx="0" fill="#eb6c36" fill-opacity="0.35" stroke="#eb6c36" stroke-width="1.0"/><text x="630.0" y="114" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">free 128</text><rect x="704.0" y="94.0" width="120.0" height="32.0" rx="0" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="3,2"/><text x="764" y="114" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">request 256 MiB</text><text x="32" y="154" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">3 × 128 MiB free, in three tails that can never join: the 256 MiB request fits in none</text><text x="32" y="196" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">expandable_segments:True: one reserved range per stream and pool</text><rect x="32.0" y="230.0" width="952.0" height="44.0" rx="3" fill="#f5f5f5" stroke="#7a8399" stroke-width="1.0" stroke-dasharray="4,3"/><text x="984" y="222" fill="#7a8399" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">cuMemAddressReserve: 1⅛ × device memory of addresses, no memory behind them</text><rect x="32.0" y="230.0" width="120.0" height="44.0" rx="0" fill="#2d3142" fill-opacity="0.85" stroke="#f5f5f5" stroke-width="1.0"/><text x="92.0" y="256" fill="#f5f5f5" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">live 256 MiB</text><rect x="152.0" y="230.0" width="120.0" height="44.0" rx="0" fill="#2d3142" fill-opacity="0.85" stroke="#f5f5f5" stroke-width="1.0"/><text x="212.0" y="256" fill="#f5f5f5" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">live 256 MiB</text><rect x="272.0" y="230.0" width="120.0" height="44.0" rx="0" fill="#2d3142" fill-opacity="0.85" stroke="#f5f5f5" stroke-width="1.0"/><text x="332.0" y="256" fill="#f5f5f5" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">live 256 MiB</text><rect x="392.0" y="230.0" width="180.0" height="44.0" rx="0" fill="#eb6c36" fill-opacity="0.35" stroke="#eb6c36" stroke-width="1.0"/><text x="482.0" y="250" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">384 MiB free, one block:</text><text x="482.0" y="264" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the 256 MiB request fits</text><text x="588" y="256" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">unmapped addresses: the range grows here</text><text x="32" y="296" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">cuMemCreate: physical pages of 20 MiB (2 MiB in the small pool), cuMemMap'd under the range</text><rect x="33.0" y="306.0" width="18.0" height="16.0" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/><rect x="53.0" y="306.0" width="18.0" height="16.0" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/><rect x="73.0" y="306.0" width="18.0" height="16.0" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/><rect x="93.0" y="306.0" width="18.0" height="16.0" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/><rect x="113.0" y="306.0" width="18.0" height="16.0" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/><rect x="133.0" y="306.0" width="18.0" height="16.0" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/><rect x="153.0" y="306.0" width="18.0" height="16.0" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/><rect x="173.0" y="306.0" width="18.0" height="16.0" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/><rect x="193.0" y="306.0" width="18.0" height="16.0" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/><rect x="213.0" y="306.0" width="18.0" height="16.0" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/><rect x="233.0" y="306.0" width="18.0" height="16.0" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/><rect x="253.0" y="306.0" width="18.0" height="16.0" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/><rect x="273.0" y="306.0" width="18.0" height="16.0" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/><rect x="293.0" y="306.0" width="18.0" height="16.0" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/><rect x="313.0" y="306.0" width="18.0" height="16.0" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/><rect x="333.0" y="306.0" width="18.0" height="16.0" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/><rect x="353.0" y="306.0" width="18.0" height="16.0" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/><rect x="373.0" y="306.0" width="18.0" height="16.0" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/><rect x="393.0" y="306.0" width="18.0" height="16.0" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/><rect x="413.0" y="306.0" width="18.0" height="16.0" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/><rect x="433.0" y="306.0" width="18.0" height="16.0" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/><rect x="453.0" y="306.0" width="18.0" height="16.0" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/><rect x="473.0" y="306.0" width="18.0" height="16.0" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/><rect x="493.0" y="306.0" width="18.0" height="16.0" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/><rect x="513.0" y="306.0" width="18.0" height="16.0" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/><rect x="533.0" y="306.0" width="18.0" height="16.0" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/><rect x="553.0" y="306.0" width="18.0" height="16.0" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/><text x="32" y="346" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">On out-of-memory the allocator can unmap whole free pages and map them again at the end of the range,</text><text x="32" y="361" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">where the next request needs them. Free space still cannot merge across a live block.</text><text x="32" y="386" fill="#7a8399" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Blocks in proportion, pages not. Off by default and documented as experimental in PyTorch 2.15.0.</text><line x1="32" y1="408" x2="984" y2="408" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="424" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><rect x="108.0" y="415.0" width="16.0" height="12.0" rx="0" fill="#2d3142" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="132" y="425" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">allocated (live)</text><rect x="244.4" y="415.0" width="16.0" height="12.0" rx="0" fill="#eb6c36" fill-opacity="0.35" stroke="#eb6c36" stroke-width="0.8"/><text x="268.4" y="425" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">free</text><rect x="316.0" y="415.0" width="16.0" height="12.0" rx="0" fill="#f5f5f5" stroke="#7a8399" stroke-width="1.4" stroke-dasharray="4,3"/><text x="340.0" y="425" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">reserved addresses</text><rect x="463.2" y="415.0" width="16.0" height="12.0" rx="0" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.4"/><text x="487.2" y="425" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">physical page</text><rect x="583.4" y="415.0" width="16.0" height="12.0" rx="0" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.4" stroke-dasharray="3,2"/><text x="607.4" y="425" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the request</text>
