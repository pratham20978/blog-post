<p class="eyebrow">OUTSIDE PYTORCH</p>
<h1>What a process holds outside PyTorch</h1>
<p class="sub">The CUDA context is the floor; lazy loading keeps it small, and NCCL on one rank adds more than both.</p>

ng (the default)</text><text x="288" y="111" fill="#2d3142" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">CUDA context, first tensor</text><rect x="300.0" y="96.0" width="74.7" height="22.0" rx="0" fill="#4f5d75" fill-opacity="0.55" stroke="none" stroke-width="0"/><text x="382.70480769230767" y="111" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">173 MiB</text><text x="288" y="145" fill="#2d3142" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">+ first cuBLAS matmul</text><rect x="300.0" y="130.0" width="104.1" height="22.0" rx="0" fill="#4f5d75" fill-opacity="0.55" stroke="none" stroke-width="0"/><text x="412.1048076923077" y="145" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">242 MiB  (+68)</text><text x="288" y="179" fill="#2d3142" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">+ training kernels (GELU, Adam)</text><rect x="300.0" y="164.0" width="144.7" height="22.0" rx="0" fill="#4f5d75" fill-opacity="0.55" stroke="none" stroke-width="0"/><text x="452.70480769230767" y="179" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">336 MiB  (+94)</text><text x="288" y="213" fill="#2d3142" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">+ first cuDNN convolution</text><rect x="300.0" y="198.0" width="148.2" height="22.0" rx="0" fill="#4f5d75" fill-opacity="0.55" stroke="none" stroke-width="0"/><text x="456.15096153846156" y="213" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">344 MiB  (+8)</text><text x="288" y="247" fill="#2d3142" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">+ NCCL communicator, 1 rank</text><rect x="300.0" y="232.0" width="384.2" height="22.0" rx="0" fill="#2e5aa8" fill-opacity="0.55" stroke="none" stroke-width="0"/><text x="692.2125" y="247" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">892 MiB  (+548)</text><text x="288" y="281" fill="#2d3142" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">+ first all_reduce</text><rect x="300.0" y="266.0" width="384.2" height="22.0" rx="0" fill="#2e5aa8" fill-opacity="0.55" stroke="none" stroke-width="0"/><text x="692.2125" y="281" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">892 MiB  (+0)</text><text x="288" y="315" fill="#2d3142" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">after destroy_process_group()</text><rect x="300.0" y="300.0" width="217.1" height="22.0" rx="0" fill="#4f5d75" fill-opacity="0.55" stroke="none" stroke-width="0"/><text x="525.0740384615385" y="315" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">504 MiB  (−388)</text><text x="32" y="358" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">CUDA_MODULE_LOADING=EAGER</text><text x="288" y="381" fill="#2d3142" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">CUDA context, first tensor</text><rect x="300.0" y="366.0" width="406.2" height="22.0" rx="0" fill="#4f5d75" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="714.1817307692309" y="381" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">943 MiB</text><text x="288" y="415" fill="#2d3142" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">+ first cuBLAS matmul</text><rect x="300.0" y="400.0" width="541.4" height="22.0" rx="0" fill="#4f5d75" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="849.4432692307691" y="415" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">1257 MiB</text><text x="32" y="470" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Each bar is NVML's figure for the process minus PyTorch's reserved memory. cuBLAS workspaces are not in it: PyTorch 2.15 takes them from its own allocator.</text><line x1="32" y1="488" x2="984" y2="488" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="504" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><rect x="108.0" y="495.0" width="16.0" height="12.0" rx="0" fill="#4f5d75" fill-opacity="0.55" stroke="none" stroke-width="0"/><text x="132" y="505" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">CUDA context and loaded kernels, lazy</text><rect x="357.8" y="495.0" width="16.0" height="12.0" rx="0" fill="#2e5aa8" fill-opacity="0.55" stroke="none" stroke-width="0"/><text x="381.8" y="505" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">with NCCL</text><rect x="456.4" y="495.0" width="16.0" height="12.0" rx="0" fill="#4f5d75" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="480.4" y="505" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">eager loading</text>
