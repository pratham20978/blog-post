<p class="eyebrow">UNIFIED MEMORY</p>
<h1>On a unified-memory GPU, every program shares the card</h1>
<p class="sub">CUDA's free memory on the GB10 tracks the kernel's MemFree, not MemAvailable, and falls with CPU allocations.</p>

y="'Geist Mono', ui-monospace, monospace" text-anchor="middle">106.43</text><text x="557.3333333333334" y="222.88790839059013" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">104.20</text><text x="557.3333333333334" y="117.08755901881625" fill="#2e5aa8" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">114.42</text><text x="690" y="88" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">CUDA total = MemTotal =</text><text x="690" y="103" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">121.63 GiB</text><text x="690" y="133" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">CUDA free = MemFree,</text><text x="690" y="148" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">to the hundredth of a GiB</text><text x="690" y="178" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">MemAvailable is 10.21 GiB higher:</text><text x="690" y="193" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">memory Linux could reclaim,</text><text x="690" y="208" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">9.18 GiB of it page cache,</text><text x="690" y="223" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">that CUDA does not count as free</text><text x="690" y="253" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the tensor cut CUDA free by 8.02 GiB;</text><text x="690" y="268" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">NVML charged it to no GPU process</text><text x="690" y="298" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">nvidia-smi: Memory-Usage Not Supported</text><text x="110" y="400" fill="#7a8399" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">y axis starts at 90 GiB</text><line x1="32" y1="438" x2="984" y2="438" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="454" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><circle cx="116.0" cy="451.0" r="4.2" fill="#2d3142"/><text x="132" y="455" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">CUDA free (cudaMemGetInfo)</text><circle cx="306.4" cy="451.0" r="6.5" fill="#f5f5f5" stroke="#eb6c36" stroke-width="1.2"/><text x="322.4" y="455" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">MemFree</text><circle cx="394.2" cy="451.0" r="4.2" fill="#2e5aa8"/><text x="410.2" y="455" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">MemAvailable</text>
