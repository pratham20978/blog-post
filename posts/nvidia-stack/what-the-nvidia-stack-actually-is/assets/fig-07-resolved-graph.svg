<rect x="96" y="112" width="560" height="384" rx="8" fill="#f5f5f5"/><rect x="96" y="112" width="560" height="384" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="6,4"/><rect x="116" y="100" width="97" height="24" rx="3" fill="#f5f5f5" stroke="#4f5d75" stroke-opacity="0.45" stroke-width="0.8"/><text x="164.5" y="115.0" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">site-packages</text><rect x="260" y="152" width="232" height="56" rx="6" fill="#f5f5f5"/><rect x="260" y="152" width="232" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="376.0" y="182.0" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">torch</text><text x="376.0" y="196.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the only thing you asked for</text><rect x="124" y="264" width="240" height="56" rx="6" fill="#f5f5f5"/><rect x="124" y="264" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="244.0" y="294.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">cuda-toolkit[…11]</text><text x="244.0" y="308.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">a meta-package, no code of its own</text><rect x="396" y="264" width="232" height="56" rx="6" fill="#f5f5f5"/><rect x="396" y="264" width="232" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="512.0" y="294.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">nvidia-cudnn-cu13</text><text x="512.0" y="308.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">declared by torch</text><rect x="396" y="360" width="232" height="56" rx="6" fill="#f5f5f5"/><rect x="396" y="360" width="232" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="512.0" y="390.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">nvidia-cublas</text><text x="512.0" y="404.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">never asked for directly</text><rect x="124" y="360" width="240" height="56" rx="6" fill="#f5f5f5"/><rect x="124" y="360" width="240" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="244.0" y="390.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">11 component wheels</text><text x="244.0" y="404.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">cublas, cudart, cufft, …</text><rect x="216" y="436" width="320" height="44" rx="6" fill="#f5f5f5"/><rect x="216" y="436" width="320" height="44" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="376.0" y="460.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">nvidia/cu13/lib</text><text x="376.0" y="474.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">where the loader finds them</text><line x1="308" y1="208" x2="308" y2="258" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><path d="M 444 208 H 504 Q 512 208 512 216 V 258" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="244" y1="320" x2="244" y2="354" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="512" y1="320" x2="512" y2="354" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow)"/><rect x="530.0" y="342" width="60" height="12" rx="2" fill="#f5f5f5"/><text x="560" y="351" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PULLS IN</text><path d="M 244 416 H 288 Q 296 416 296 424 V 430" fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/><path d="M 512 416 H 464 Q 456 416 456 424 V 430" fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/><rect x="720" y="112" width="200" height="384" rx="8" fill="#f5f5f5"/><rect x="720" y="112" width="200" height="384" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1" stroke-dasharray="6,4"/><rect x="740" y="100" width="69" height="24" rx="3" fill="#f5f5f5" stroke="#eb6c36" stroke-opacity="0.45" stroke-width="0.8"/><text x="774.5" y="115.0" fill="#eb6c36" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">the host</text><rect x="740" y="264" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="740" y="264" width="160" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="820.0" y="294.0" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">libcuda.so.1</text><text x="820.0" y="308.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the driver API</text><rect x="740" y="360" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="740" y="360" width="160" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="820.0" y="390.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">nvidia.ko</text><text x="820.0" y="404.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the kernel module</text><line x1="820" y1="320" x2="820" y2="354" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow)"/><line x1="664" y1="292.0" x2="736" y2="292.0" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/><rect x="661.0" y="280.0" width="78" height="12" rx="2" fill="#f5f5f5"/><text x="700.0" y="289.0" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ALSO NEEDED</text><text x="96" y="532" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">32 packages   ·   90 shared libraries   ·   4.86 GB unpacked</text><text x="96" y="548" fill="#eb6c36" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">and none of it is the library that talks to the GPU</text><line x1="32" y1="568" x2="984" y2="568" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="584" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><rect x="108" y="576" width="10" height="10" rx="2" fill="none" stroke="#4f5d75" stroke-width="1"/><text x="126" y="585" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">delivered by pip</text><rect x="269.2" y="576" width="10" height="10" rx="2" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36" stroke-width="0.8"/><text x="287.2" y="585" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">must already be on the machine</text>
</svg>