  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="152" y="88" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">STEP</text><text x="840" y="88" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.18em">THE ARTIFACT THAT OWNS IT</text><rect x="96" y="104" width="760" height="432" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="97" y="152" width="758" height="48" fill="#ececec" fill-opacity="0.55"/><line x1="96" y1="152" x2="856" y2="152" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><line x1="96" y1="200" x2="856" y2="200" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><rect x="97" y="248" width="758" height="48" fill="#ececec" fill-opacity="0.55"/><line x1="96" y1="248" x2="856" y2="248" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><line x1="96" y1="296" x2="856" y2="296" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><rect x="97" y="344" width="758" height="48" fill="#ececec" fill-opacity="0.55"/><line x1="96" y1="344" x2="856" y2="344" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><line x1="96" y1="392" x2="856" y2="392" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><rect x="97" y="440" width="758" height="48" fill="#ececec" fill-opacity="0.55"/><line x1="96" y1="440" x2="856" y2="440" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><line x1="96" y1="488" x2="856" y2="488" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="116" y="131.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.10em">1</text><text x="152" y="132.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Python resolves the operator</text><text x="840" y="131.0" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">torch.matmul → aten::mm</text><text x="116" y="179.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.10em">2</text><text x="152" y="180.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">A schema file declares mm</text><text x="840" y="179.0" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">native_functions.yaml</text><text x="116" y="227.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.10em">3</text><text x="152" y="228.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">The dispatcher picks a backend</text><text x="840" y="227.0" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">CUDA dispatch key</text><text x="116" y="275.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.10em">4</text><text x="152" y="276.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">ATen's CUDA implementation runs</text><text x="840" y="275.0" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">native/cuda/Blas.cpp</text><text x="116" y="323.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.10em">5</text><text x="152" y="324.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">It reaches the BLAS wrapper</text><text x="840" y="323.0" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">at::cuda::blas::gemm&lt;float&gt;</text><text x="116" y="371.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.10em">6</text><text x="152" y="372.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">PyTorch picks a cuBLAS flavor</text><text x="840" y="371.0" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">run-time branch, not compile-time</text><rect x="97" y="393" width="758" height="46" fill="rgba(235,108,54,0.08)"/><text x="116" y="419.0" fill="#eb6c36" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.10em">7</text><text x="152" y="420.0" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">The vendor library is called</text><text x="840" y="419.0" fill="#eb6c36" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">cublasSgemm  or  cublasLtMatmul</text><text x="116" y="467.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.10em">8</text><text x="152" y="468.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">The loader resolves the symbol</text><text x="840" y="467.0" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">nvidia/cu13/lib/libcublas.so.13</text><text x="116" y="515.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.10em">9</text><text x="152" y="516.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Down to the hardware</text><text x="840" y="515.0" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">libcudart.so.13 → libcuda.so.1 → nvidia.ko</text><path d="M 872 104 H 880 V 392 H 872" fill="none" stroke="#7a8399" stroke-width="1"/><text x="892" y="251.0" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.10em">your stack</text><path d="M 872 392 H 880 V 536 H 872" fill="none" stroke="#eb6c36" stroke-width="1"/><text x="892" y="467.0" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.10em">nvidia's</text><line x1="72" y1="112" x2="72" y2="528" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><text x="72" y="556" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">down</text><text x="456" y="564" fill="#eb6c36" font-size="14" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="middle" font-style="italic">and you still cannot name the kernel</text><path d="M 456 552 Q 556 520 616 436" fill="none" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,3"/><circle cx="616" cy="436" r="2" fill="#eb6c36"/><line x1="32" y1="596" x2="984" y2="596" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="612" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><rect x="108" y="604" width="10" height="10" rx="2" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36" stroke-width="0.8"/><text x="126" y="613" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">the boundary where your code stops</text>
</svg>