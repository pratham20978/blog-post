"16" rx="2" fill="#f5f5f5"/><text x="508" y="578.0" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">yes</text><line x1="360" y1="520" x2="372.0" y2="520" stroke="#bfc0c0" stroke-width="1"/><polygon points="496 64.0, 620.0 104, 496 144.0, 372.0 104" fill="#f5f5f5"/><polygon points="496 64.0, 620.0 104, 496 144.0, 372.0 104" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-linejoin="round"/><text x="496" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">intended GPU visible?</text><text x="496" y="116" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">device · UUID · compute_cap</text><text x="352" y="107" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">nvidia-smi --query-gpu</text><rect x="712" y="76" width="256" height="56" rx="6" fill="#f5f5f5"/><rect x="712" y="76" width="256" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="840.0" y="106.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Repair assignment</text><text x="840.0" y="120.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">driver · container · CUDA_VISIBLE_DEVICES</text><polygon points="496 168.0, 620.0 208, 496 248.0, 372.0 208" fill="#f5f5f5"/><polygon points="496 168.0, 620.0 208, 496 248.0, 372.0 208" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-linejoin="round"/><text x="496" y="206" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">nvcc lists the target?</text><text x="496" y="220" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">compute_NN and sm_NN</text><text x="352" y="211" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">nvcc --list-gpu-code</text><rect x="712" y="180" width="256" height="56" rx="6" fill="#f5f5f5"/><rect x="712" y="180" width="256" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="840.0" y="210.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Select a Toolkit</text><text x="840.0" y="224.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one that knows the SM · pin CUDA_HOME</text><polygon points="496 272.0, 620.0 312, 496 352.0, 372.0 312" fill="#f5f5f5"/><polygon points="496 272.0, 620.0 312, 496 352.0, 372.0 312" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-linejoin="round"/><text x="496" y="310" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">PyTorch core op passes?</text><text x="496" y="324" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">warning + synchronized op</text><text x="352" y="315" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">audit_torch.py</text><rect x="712" y="284" width="256" height="56" rx="6" fill="#f5f5f5"/><rect x="712" y="284" width="256" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="840.0" y="314.0" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Replace wheel, else build PyTorch</text><text x="840.0" y="328.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Repair 0, then Repair 2</text><polygon points="496 376.0, 620.0 416, 496 456.0, 372.0 416" fill="#f5f5f5"/><polygon points="496 376.0, 620.0 416, 496 456.0, 372.0 416" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-linejoin="round"/><text x="496" y="414" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">extension passes?</text><text x="496" y="428" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">same process, device, dtype</text><text x="352" y="419" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">test_extension.py</text><rect x="712" y="388" width="256" height="56" rx="6" fill="#f5f5f5"/><rect x="712" y="388" width="256" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="840.0" y="418.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Rebuild that extension</text><text x="840.0" y="432.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">TORCH_CUDA_ARCH_LIST · same ABI</text><polygon points="496 480.0, 620.0 520, 496 560.0, 372.0 520" fill="#f5f5f5"/><polygon points="496 480.0, 620.0 520, 496 560.0, 372.0 520" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-linejoin="round"/><text x="496" y="518" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">model class and features listed?</text><text x="496" y="532" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">resolved config vs release table</text><text x="352" y="523" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">inspect_model.py</text><rect x="712" y="492" width="256" height="56" rx="6" fill="#f5f5f5"/><rect x="712" y="492" width="256" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="840.0" y="522.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Pin a release or change runtime</text><text x="840.0" y="536.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Repair 4 · no flag restores it</text><rect x="392" y="592" width="208" height="40" rx="20.0" fill="#f5f5f5"/><rect x="392" y="592" width="208" height="40" rx="20.0" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="496.0" y="616.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">run, then measure</text><text x="48" y="596" fill="#2d3142" font-size="14" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start" font-style="italic">each pass moves the question one layer up</text><path d="M 56 576 Q 240 556 492 584.0" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/><circle cx="492" cy="584.0" r="2" fill="#2d3142"/>
