ans-serif" text-anchor="middle">Verify in a fresh env</text><text x="160.0" y="268.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">arch list · cxx11 abi · matmul + sync</text><text x="952" y="348" fill="#2d3142" font-size="14" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="end" font-style="italic">the deliverable is a verified artifact, not a finished build log</text><path d="M 944 352 Q 600 356 160.0 282" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/><circle cx="160.0" cy="282" r="2" fill="#2d3142"/>
