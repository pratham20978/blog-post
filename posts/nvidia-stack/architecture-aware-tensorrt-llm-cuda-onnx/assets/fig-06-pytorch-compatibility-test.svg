400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">torch/cuda/__init__.py</text><text x="468.0" y="198" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">baseline · family · exact target</text><rect x="656" y="128" width="232" height="64" rx="6" fill="#f5f5f5"/><rect x="656" y="128" width="232" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="772.0" y="162.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Synchronized core op</text><text x="772.0" y="176.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">(arange(8)+1).sum() · item()</text><rect x="608" y="264" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="608" y="264" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="688.0" y="294.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Core passes</text><text x="688.0" y="308.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">move up the stack</text><rect x="792" y="264" width="176" height="56" rx="6" fill="#f5f5f5"/><rect x="792" y="264" width="176" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="880.0" y="294.0" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">No kernel image</text><text x="880.0" y="308.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PyTorch binary owns the gap</text><path d="M 280 120 H 308 Q 316 120 316 128 V 136.0 Q 316 144.0 324 144.0 H 352" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><path d="M