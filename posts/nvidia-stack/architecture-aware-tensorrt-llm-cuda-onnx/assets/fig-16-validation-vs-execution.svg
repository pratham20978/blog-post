  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="32" y="44" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">HOW TO REPORT AN UNLISTED-HARDWARE RUN</text><line x1="508" y1="276" x2="120" y2="276" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="508" y1="276" x2="896" y2="276" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="508" y1="276" x2="508" y2="84" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="508" y1="276" x2="508" y2="468" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arrow)"/><text x="508" y="72" fill="#2d3142" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">listed</text><text x="508" y="488" fill="#2d3142" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">unlisted</text><text x="108" y="279" fill="#2d3142" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.18em">failed</text><text x="908" y="279" fill="#2d3142" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">ran</text><rect x="156" y="116" width="320" height="128" rx="6" fill="#f5f5f5"/><rect x="156" y="116" width="320" height="128" rx="6" fill="rgba(45,49,66,0.04)" stroke="rgba(79,93,117,0.28)" stroke-width="1"/><text x="172" y="138" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">01 · listed / failed</text><text x="172" y="168" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Regression or misconfiguration</text><text x="172" y="192" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">the vendor validated this tuple —</text><text x="172" y="208" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">report it with the full audit packet</text><rect x="540" y="116" width="320" height="128" rx="6" fill="#f5f5f5"/><rect x="540" y="116" width="320" height="128" rx="6" fill="rgba(45,49,66,0.04)" stroke="rgba(79,93,117,0.28)" stroke-width="1"/><text x="556" y="138" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">02 · listed / ran</text><text x="556" y="168" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Documented configuration</text><text x="556" y="192" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">what the 1.2 hardware page promises;</text><text x="556" y="208" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">still record digest, revision, precision</text><rect x="156" y="308" width="320" height="128" rx="6" fill="#f5f5f5"/><rect x="156" y="308" width="320" height="128" rx="6" fill="rgba(45,49,66,0.04)" stroke="rgba(79,93,117,0.28)" stroke-width="1"/><text x="172" y="330" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">03 · unlisted / failed</text><text x="172" y="360" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Observed failure</text><text x="172" y="384" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">preserve the first relevant error;</text><text x="172" y="400" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">never rewrite it as 'T4 cannot run inference'</text><rect x="540" y="308" width="320" height="128" rx="6" fill="#f5f5f5"/><rect x="540" y="308" width="320" height="128" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/><text x="556" y="330" fill="#eb6c36" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">04 · unlisted / ran</text><text x="556" y="360" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Observed working</text><text x="556" y="384" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">exact container digest, model revision,</text><text x="556" y="400" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">precision, shapes — and which path ran</text><rect x="556" y="408" width="100" height="16" rx="3" fill="#ffffff" stroke="#eb6c36" stroke-opacity="0.45" stroke-width="0.8"/><text x="606.0" y="419.0" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">ran with fallback</text><rect x="664" y="408" width="120" height="16" rx="3" fill="#ffffff" stroke="#eb6c36" stroke-opacity="0.45" stroke-width="0.8"/><text x="724.0" y="419.0" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">ran an optimized path</text><line x1="32" y1="512" x2="984" y2="512" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="528" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><rect x="108" y="520" width="10" height="10" rx="2" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36" stroke-width="0.8"/><text x="126" y="529" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">the T4 field report lands here</text><rect x="370.0" y="520" width="10" height="10" rx="2" fill="#4f5d75" fill-opacity="0.18" stroke="#4f5d75" stroke-width="0.8"/><text x="388.0" y="529" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">the other three observations</text>
