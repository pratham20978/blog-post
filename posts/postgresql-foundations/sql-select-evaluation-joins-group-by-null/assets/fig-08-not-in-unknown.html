500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">TRUE</text><rect x="32" y="148" width="96" height="26" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="80.0" y="165.0" fill="#2d3142" font-size="9.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">order 2</text><rect x="128" y="148" width="210" height="26" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="233.0" y="165.0" fill="#2d3142" font-size="9.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">100001 &lt;&gt; 15839</text><rect x="338" y="148" width="96" height="26" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="386.0" y="165.0" fill="#2d3142" font-size="9.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">TRUE</text><rect x="32" y="174" width="96" height="26" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="80.0" y="191.0" fill="#2d3142" font-size="9.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">⋯</text><rect x="128" y="174" width="210" height="26" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="233.0" y="191.0" fill="#2d3142" font-size="9.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">999,997 more comparisons</text><rect x="338" y="174" width="96" height="26" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="386.0" y="191.0" fill="#7a8399" font-size="9.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">TRUE</text><rect x="32" y="200" width="96" height="26" fill="rgba(181,69,42,0.08)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="80.0" y="217.0" fill="#2d3142" font-size="9.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">order 4242</text><rect x="128" y="200" width="210" height="26" fill="rgba(181,69,42,0.08)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="233.0" y="217.0" fill="#b5452a" font-size="9.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">100001 &lt;&gt; NULL</text><rect x="338" y="200" width="96" height="26" fill="rgba(181,69,42,0.08)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="386.0" y="217.0" fill="#b5452a" font-size="9.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">UNKNOWN</text><text x="32" y="254" fill="#b5452a" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">TRUE AND TRUE AND ⋯ AND UNKNOWN = UNKNOWN</text><text x="32" y="274" fill="#b5452a" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">WHERE keeps only TRUE: customer 100,001 is dropped,</text><text x="32" y="288" fill="#b5452a" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">and so is every other customer</text><rect x="32" y="312" width="402" height="60" rx="6" fill="#f5f5f5"/><rect x="32" y="312" width="402" height="60" rx="6" fill="rgba(181,69,42,0.08)" stroke="#b5452a" stroke-width="1"/><text x="46" y="338" fill="#b5452a" font-size="11" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">customers with no orders: 1,000 → 0</text><text x="46" y="358" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">NOT IN, before and after the NULL</text><text x="540" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">not exists (… where o.customer_id = c.id)</text><rect x="540" y="100" width="444" height="128" rx="6" fill="#f5f5f5"/><rect x="540" y="100" width="444" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="556" y="126" fill="#2d3142" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">is there an order with customer_id = 100001?</text><text x="556" y="150" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">1,000,000 orders checked; the NULL one is not a match,</text><text x="556" y="164" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">because NULL = 100001 is UNKNOWN, not TRUE</text><text x="556" y="192" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">no match: NOT EXISTS is TRUE</text><text x="556" y="212" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">customer 100,001 is kept</text><rect x="540" y="312" width="444" height="60" rx="6" fill="#f5f5f5"/><rect x="540" y="312" width="444" height="60" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="554" y="338" fill="#eb6c36" font-size="11" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">customers with no orders: 1,000 → 1,000</text><text x="554" y="358" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">NOT EXISTS, before and after the NULL</text><text x="32" y="404" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">checked in the lab:  100001 not in (1, 2) is TRUE ·  100001 not in (1, 2, null) is NULL</text><line x1="32" y1="446" x2="984" y2="446" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="472" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">NOT IN compares the customer with every value in the list, the NULL included.</text><text x="32" y="492" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">NOT EXISTS only asks whether a matching row exists, and a NULL never matches.</text>
