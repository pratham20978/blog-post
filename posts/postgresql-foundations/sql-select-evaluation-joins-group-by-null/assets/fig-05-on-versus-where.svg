<text x="32" y="40" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">THE SAME CONDITION IN TWO PLACES · CUSTOMER 6</text><rect x="32" y="84" width="130" height="14" rx="2" fill="transparent" stroke="#eb6c36" stroke-opacity="0.55" stroke-width="0.8"/><text x="97.0" y="94" fill="#eb6c36" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">condition in ON</text><rect x="32" y="108" width="300" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="108" width="300" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="46" y="132" fill="#2d3142" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">left join orders o</text><text x="46" y="150" fill="#eb6c36" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">on o.customer_id = c.id and o.status = 'paid'</text><rect x="400" y="108" width="50" height="22" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="425.0" y="122.0" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">c.id</text><rect x="450" y="108" width="70" height="22" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="485.0" y="122.0" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">country</text><rect x="520" y="108" width="60" height="22" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="550.0" y="122.0" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">o.id</text><rect x="580" y="108" width="80" height="22" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="620.0" y="122.0" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">o.status</text><rect x="400" y="130" width="50" height="22" fill="rgba(181,69,42,0.08)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="425.0" y="145.0" fill="#2d3142" font-size="9.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">6</text><rect x="450" y="130" width="70" height="22" fill="rgba(181,69,42,0.08)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="485.0" y="145.0" fill="#2d3142" font-size="9.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">IN</text><rect x="520" y="130" width="60" height="22" fill="rgba(181,69,42,0.08)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="550.0" y="145.0" fill="#b5452a" font-size="9.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">NULL</text><rect x="580" y="130" width="80" height="22" fill="rgba(181,69,42,0.08)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="620.0" y="145.0" fill="#b5452a" font-size="9.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">NULL</text><text x="400" y="170" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">no paid order matches customer 6</text><line x1="332" y1="140" x2="400" y2="140" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="730" y="108" width="254" height="64" rx="6" fill="#f5f5f5"/><rect x="730" y="108" width="254" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="744" y="130" fill="#eb6c36" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the row is padded and kept</text><text x="744" y="152" fill="#2d3142" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">sample 7 rows · full 334,333</text><line x1="660" y1="140" x2="730" y2="140" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="32" y="234" width="130" height="14" rx="2" fill="transparent" stroke="#b5452a" stroke-opacity="0.55" stroke-width="0.8"/><text x="97.0" y="244" fill="#b5452a" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">condition in WHERE</text><rect x="32" y="258" width="300" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="258" width="300" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="46" y="282" fill="#2d3142" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">left join orders o on o.customer_id = c.id</text><text x="46" y="300" fill="#2d3142" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">where o.status = 'paid'</text><rect x="400" y="258" width="50" height="22" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="425.0" y="272.0" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">c.id</text><rect x="450" y="258" width="70" height="22" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="485.0" y="272.0" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">country</text><rect x="520" y="258" width="60" height="22" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="550.0" y="272.0" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">o.id</text><rect x="580" y="258" width="80" height="22" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="620.0" y="272.0" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">o.status</text><rect x="400" y="280" width="50" height="22" fill="rgba(181,69,42,0.08)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="425.0" y="295.0" fill="#2d3142" font-size="9.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">6</text><rect x="450" y="280" width="70" height="22" fill="rgba(181,69,42,0.08)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="485.0" y="295.0" fill="#2d3142" font-size="9.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">IN</text><rect x="520" y="280" width="60" height="22" fill="rgba(181,69,42,0.08)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="550.0" y="295.0" fill="#b5452a" font-size="9.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">NULL</text><rect x="580" y="280" width="80" height="22" fill="rgba(181,69,42,0.08)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="620.0" y="295.0" fill="#b5452a" font-size="9.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">NULL</text><text x="400" y="320" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">padded row: status is NULL</text><line x1="332" y1="290" x2="400" y2="290" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="730" y="258" width="254" height="64" rx="6" fill="#f5f5f5"/><rect x="730" y="258" width="254" height="64" rx="6" fill="rgba(181,69,42,0.08)" stroke="#b5452a" stroke-width="1"/><text x="744" y="280" fill="#b5452a" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">NULL = 'paid' is UNKNOWN: dropped</text><text x="744" y="302" fill="#2d3142" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">sample 6 rows · full 333,333</text><line x1="660" y1="290" x2="730" y2="290" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><text x="400" y="342" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">the result equals the inner join's 333,333:</text><text x="400" y="356" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">the planner dropped the left join from the plan</text><line x1="32" y1="396" x2="984" y2="396" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="422" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">ON decides what counts as a match, before the padding. WHERE filters afterwards,</text><text x="32" y="442" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">and a padded row's NULLs never satisfy it. For an inner join the two are the same.</text>
