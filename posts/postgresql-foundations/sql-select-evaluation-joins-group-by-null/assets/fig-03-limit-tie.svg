ist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">groups reach the sort as BR, DE, IN, JP, US</text><text x="616" y="156" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">returns: DE, IN</text><rect x="600" y="188" width="384" height="78" rx="6" fill="#f5f5f5"/><rect x="600" y="188" width="384" height="78" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="616" y="210" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">max_parallel_workers_per_gather = 0</text><text x="616" y="230" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">a hash aggregate hands them on as US, BR, JP, IN, DE</text><text x="616" y="252" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">returns: DE, JP</text><rect x="600" y="284" width="384" height="78" rx="6" fill="#f5f5f5"/><rect x="600" y="284" width="384" height="78" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="616" y="306" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">fetch first 2 rows with ties</text><text x="616" y="326" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">keeps every row that ties with the last one kept</text><text x="616" y="348" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">returns: DE, IN, JP</text><line x1="32" y1="396" x2="984" y2="396" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="422" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">The same query, the same rows, two different second places. Neither is wrong:</text><text x="32" y="442" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">the query never said how to break the tie. A tiebreaker or WITH TIES does.</text>
