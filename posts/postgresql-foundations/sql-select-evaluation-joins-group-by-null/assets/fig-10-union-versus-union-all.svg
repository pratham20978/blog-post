', ui-monospace, monospace" text-anchor="middle">2</text><rect x="628" y="96" width="22" height="26" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/><text x="639.0" y="113.0" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">5</text><rect x="654" y="96" width="22" height="26" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/><text x="665.0" y="113.0" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">3</text><text x="420" y="140" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">full shop: 333,333 + 333,333 = 666,666 rows</text><text x="420" y="182" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">UNION · 5 rows</text><rect x="420" y="192" width="22" height="26" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="431.0" y="209.0" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1</text><rect x="446" y="192" width="22" height="26" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="457.0" y="209.0" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">2</text><rect x="472" y="192" width="22" height="26" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="483.0" y="209.0" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">3</text><rect x="498" y="192" width="22" height="26" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="509.0" y="209.0" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">4</text><rect x="524" y="192" width="22" height="26" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="535.0" y="209.0" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">5</text><text x="420" y="236" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">full shop: 100,000 rows, one per customer</text><text x="420" y="250" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">the paid list UNIONed with itself: also 100,000</text><rect x="32" y="286" width="952" height="52" rx="6" fill="#f5f5f5"/><rect x="32" y="286" width="952" height="52" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/><text x="48" y="310" fill="#2d3142" font-size="10" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">after order 4242 lost its customer: UNION 100,001 rows, the 100,000 ids and one NULL</text><text x="48" y="328" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">UNION treats two NULLs as equal, as DISTINCT does</text><line x1="32" y1="378" x2="984" y2="378" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="402" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">UNION removes duplicates inside each input as well as across them. UNION ALL keeps every row.</text>
