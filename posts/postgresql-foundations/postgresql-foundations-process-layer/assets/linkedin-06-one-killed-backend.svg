<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img">
  <defs>
    <style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');/*]]>*/</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="80" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.24em">the log line everyone misreads</text><text x="1000" y="120" fill="#eb6c36" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">6 / 6</text><line x1="80" y1="148" x2="1000" y2="148" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="232" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">One backend killed.</text><text x="80" y="300" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">Every session dropped.</text><text x="80" y="374" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">kill -9 on one connection. An innocent second connection got</text><text x="80" y="404" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">'server closed the connection unexpectedly'. Here is why.</text><rect x="80" y="520" width="920" height="250" rx="8" fill="#f5f5f5"/><rect x="80" y="520" width="920" height="250" rx="8" fill="rgba(45,49,66,0.04)" stroke="#bfc0c0" stroke-width="1"/><text x="104" y="556" fill="#2d3142" font-size="13.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">LOG:  server process (PID 130554) was terminated by signal 9: Killed</text><text x="104" y="586" fill="#eb6c36" font-size="13.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">LOG:  terminating any other active server processes</text><text x="104" y="616" fill="#2d3142" font-size="13.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">LOG:  all server processes terminated; reinitializing</text><text x="104" y="646" fill="#2d3142" font-size="13.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">LOG:  database system was not properly shut down;</text><text x="104" y="676" fill="#2d3142" font-size="13.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">      automatic recovery in progress</text><text x="104" y="706" fill="#2d3142" font-size="13.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">LOG:  redo starts at 3/73592518</text><text x="104" y="736" fill="#2d3142" font-size="13.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">LOG:  database system is ready to accept connections</text><text x="80" y="830" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">The postmaster never reads shared memory, so it cannot know what</text><text x="80" y="862" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">a killed backend left behind. It does the only safe thing: terminate</text><text x="80" y="894" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">every child, reset, recover. Two seconds later it was serving again.</text><text x="80" y="960" fill="#eb6c36" font-size="20" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">That is the design, not a fault. Find the child in the line above.</text><line x1="80" y1="1176" x2="1000" y2="1176" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="1216" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Eleven processes, what each decides, and a lab you can run:</text><text x="80" y="1246" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">PostgreSQL 16.2, default settings, every number quoted verbatim.</text><text x="80" y="1300" fill="#eb6c36" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.16em">read it on canery →</text><text x="1000" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">canery</text>
</svg>