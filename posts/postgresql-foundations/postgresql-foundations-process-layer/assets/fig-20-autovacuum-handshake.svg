<text x="32" y="44" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">AUTOVACUUM.C — THE LAUNCHER NEVER FORKS AND NEVER SEES A TABLE</text><line x1="130" y1="100" x2="130" y2="470" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="2,3"/><rect x="75.0" y="70" width="110" height="26" rx="4" fill="#f5f5f5"/><rect x="75.0" y="70" width="110" height="26" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="130" y="88" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">launcher</text><line x1="400" y1="100" x2="400" y2="470" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="2,3"/><rect x="345.0" y="70" width="110" height="26" rx="4" fill="#f5f5f5"/><rect x="345.0" y="70" width="110" height="26" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="88" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">postmaster</text><line x1="700" y1="100" x2="700" y2="470" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="2,3"/><rect x="645.0" y="70" width="110" height="26" rx="4" fill="#f5f5f5"/><rect x="645.0" y="70" width="110" height="26" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="700" y="88" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">worker</text><line x1="900" y1="100" x2="900" y2="470" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="2,3"/><rect x="845.0" y="70" width="110" height="26" rx="4" fill="#f5f5f5"/><rect x="845.0" y="70" width="110" height="26" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="900" y="88" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">database</text><path d="M 130 118 H 166 V 136 H 134" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="170" y="119" width="298.71999999999997" height="16" rx="2" fill="#f5f5f5"/><text x="178" y="130" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">wake (naptime / N databases) · pick the database due next</text><path d="M 130 150 H 166 V 168 H 134" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="170" y="151" width="199.52" height="16" rx="2" fill="#f5f5f5"/><text x="178" y="162" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">write the choice into AutoVacuumShmem</text><line x1="130" y1="196" x2="396" y2="196" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow-accent)"/><rect x="130.51999999999998" y="179" width="268.96000000000004" height="16" rx="2" fill="#f5f5f5"/><text x="265.0" y="190" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">SendPostmasterSignal(PMSIGNAL_START_AUTOVAC_WORKER)</text><line x1="400" y1="232" x2="696" y2="232" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow-accent)"/><rect x="405.6" y="215" width="288.8" height="16" rx="2" fill="#f5f5f5"/><text x="550.0" y="226" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">fork_process() — the child knows only 'become a worker'</text><path d="M 700 250 H 736 V 268 H 704" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="740" y="251" width="239.2" height="16" rx="2" fill="#f5f5f5"/><text x="748" y="262" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">attach to shared memory · read which database</text><line x1="700" y1="292" x2="896" y2="292" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="774.64" y="275" width="50.72" height="16" rx="2" fill="#f5f5f5"/><text x="800.0" y="286" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">connect</text><path d="M 700 310 H 736 V 328 H 704" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="740" y="311" width="214.4" height="16" rx="2" fill="#f5f5f5"/><text x="748" y="322" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">every table: relation_needs_vacanalyze()</text><line x1="700" y1="352" x2="896" y2="352" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="697.76" y="335" width="204.48" height="16" rx="2" fill="#f5f5f5"/><text x="800.0" y="346" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">VACUUM / ANALYZE the ones that qualify</text><rect x="731.24" y="356" width="137.51999999999998" height="15" rx="2" fill="#f5f5f5"/><text x="800.0" y="366" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">under the shared cost budget</text><line x1="700" y1="400" x2="134" y2="400" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/><rect x="332.6" y="383" width="164.8" height="16" rx="2" fill="#f5f5f5"/><text x="415.0" y="394" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">SIGUSR2: done — a slot is free</text><path d="M 130 418 H 166 V 436 H 134" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="170" y="419" width="353.28" height="16" rx="2" fill="#f5f5f5"/><text x="178" y="430" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">rebalance cost limits among remaining workers · maybe launch another</text><line x1="32" y1="488" x2="984" y2="488" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="504" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><line x1="108" y1="501" x2="120" y2="501" stroke="#eb6c36" stroke-width="1.4"/><text x="126" y="505" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">the only two signals that create a process</text><line x1="456.40000000000003" y1="501" x2="468.40000000000003" y2="501" stroke="#4f5d75" stroke-width="1.4"/><text x="474.40000000000003" y="505" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">everything else</text>
