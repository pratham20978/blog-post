<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img">
  <defs>
    <style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');/*]]>*/</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="80" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.24em">the launcher's clock</text><text x="1000" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">3 / 6</text><line x1="80" y1="148" x2="1000" y2="148" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="232" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">Thirty seconds waiting.</text><text x="80" y="300" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">Thirty milliseconds working.</text><text x="80" y="374" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">The table crossed its threshold the instant the UPDATE</text><text x="80" y="404" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">committed. Nobody looked for half a minute. Nothing was misconfigured.</text><line x1="80" y1="640" x2="1000" y2="640" stroke="#bfc0c0" stroke-width="1.4"/><line x1="80.0" y1="634" x2="80.0" y2="646" stroke="#bfc0c0" stroke-width="1.4"/><text x="80.0" y="668" fill="#7a8399" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0 s</text><line x1="207.77777777777777" y1="634" x2="207.77777777777777" y2="646" stroke="#bfc0c0" stroke-width="1.4"/><text x="207.77777777777777" y="668" fill="#7a8399" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">5 s</text><line x1="335.55555555555554" y1="634" x2="335.55555555555554" y2="646" stroke="#bfc0c0" stroke-width="1.4"/><text x="335.55555555555554" y="668" fill="#7a8399" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">10 s</text><line x1="463.3333333333333" y1="634" x2="463.3333333333333" y2="646" stroke="#bfc0c0" stroke-width="1.4"/><text x="463.3333333333333" y="668" fill="#7a8399" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">15 s</text><line x1="591.1111111111111" y1="634" x2="591.1111111111111" y2="646" stroke="#bfc0c0" stroke-width="1.4"/><text x="591.1111111111111" y="668" fill="#7a8399" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">20 s</text><line x1="718.8888888888889" y1="634" x2="718.8888888888889" y2="646" stroke="#bfc0c0" stroke-width="1.4"/><text x="718.8888888888889" y="668" fill="#7a8399" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">25 s</text><line x1="846.6666666666666" y1="634" x2="846.6666666666666" y2="646" stroke="#bfc0c0" stroke-width="1.4"/><text x="846.6666666666666" y="668" fill="#7a8399" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">30 s</text><circle cx="80.0" cy="640" r="8" fill="#2d3142"/><text x="96.0" y="580" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">UPDATE 30,000 rows</text><text x="96.0" y="602" fill="#4f5d75" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">threshold 20,050 crossed at once</text><rect x="80.0" y="635" width="766.6666666666666" height="10" rx="2" fill="#4f5d75" fill-opacity="0.18"/><text x="463.3333333333333" y="540" fill="#4f5d75" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">30.0 seconds · the launcher is asleep</text><circle cx="846.6666666666666" cy="640" r="8" fill="#eb6c36"/><text x="830.6666666666666" y="720" fill="#eb6c36" font-size="15" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">worker forked</text><text x="830.6666666666666" y="742" fill="#eb6c36" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">30,000 removed in 0.03 s</text><text x="80" y="840" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">The launcher visits each database once per autovacuum_naptime,</text><text x="80" y="872" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">60 s by default, round-robin. It does not watch tables; it keeps</text><text x="80" y="904" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">time. A table that qualifies waits for the next visit — up to a minute.</text><line x1="80" y1="1176" x2="1000" y2="1176" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="1216" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Expected arrival: naptime / 2. Worst case: naptime, plus queueing</text><text x="80" y="1246" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">for one of three worker slots. Halving naptime halves the wait, not the work.</text><text x="80" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.16em">how postgresql uses processes</text><text x="1000" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">canery</text>
</svg>