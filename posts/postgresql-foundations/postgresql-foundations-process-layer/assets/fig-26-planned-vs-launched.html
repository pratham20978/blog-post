<p class="eyebrow">PARALLEL WORKERS</p>
<h1>Planned is a decision; launched is a request</h1>
<p class="sub">The planner decides against a ceiling and cannot see the pool. The executor asks the pool and gets what is free.</p>

142" stroke-width="1"/><rect x="338" y="238" width="66" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-opacity="0.40" stroke-width="0.8"/><text x="371.0" y="247" fill="#4f5d75" font-size="7" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EXECUTOR</text><text x="344" y="270" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">requests 6 dynamic background workers</text><text x="344" y="286" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">from max_worker_processes (8) · max_parallel_workers (1 here)</text><rect x="344" y="300" width="28" height="20" rx="3" fill="#2d3142" fill-opacity="0.25" stroke="#2d3142" stroke-width="0.8"/><rect x="378" y="300" width="28" height="20" rx="3" fill="#2d3142" fill-opacity="0.25" stroke="#2d3142" stroke-width="0.8"/><rect x="412" y="300" width="28" height="20" rx="3" fill="#2d3142" fill-opacity="0.25" stroke="#2d3142" stroke-width="0.8"/><rect x="446" y="300" width="28" height="20" rx="3" fill="#2d3142" fill-opacity="0.25" stroke="#2d3142" stroke-width="0.8"/><rect x="480" y="300" width="28" height="20" rx="3" fill="#2d3142" fill-opacity="0.25" stroke="#2d3142" stroke-width="0.8"/><rect x="514" y="300" width="28" height="20" rx="3" fill="#2d3142" fill-opacity="0.25" stroke="#2d3142" stroke-width="0.8"/><rect x="548" y="300" width="28" height="20" rx="3" fill="#2d3142" fill-opacity="0.25" stroke="#2d3142" stroke-width="0.8"/><rect x="582" y="300" width="28" height="20" rx="3" fill="#eb6c36" fill-opacity="0.8" stroke="#eb6c36" stroke-width="0.8"/><text x="344" y="338" fill="#4f5d75" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">7 of 8 slots unavailable to parallel query (max_parallel_workers = 1)</text><text x="344" y="352" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">→ 1 launched · the leader runs the plan too, so it still completes</text><text x="344" y="368" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">on the default pool the same plan launched all 6</text><line x1="330" y1="360" x2="284" y2="360" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="680" y="90" width="296" height="200" rx="6" fill="#f5f5f5"/><rect x="680" y="90" width="296" height="200" rx="6" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/><rect x="688" y="96" width="120" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-opacity="0.40" stroke-width="0.8"/><text x="748.0" y="105" fill="#4f5d75" font-size="7" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">THE LAB'S FOUR RUNS</text><text x="700" y="132" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">setting</text><text x="900" y="132" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">planned</text><text x="960" y="132" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">launched</text><text x="700" y="152" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">defaults</text><text x="900" y="152" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">2</text><text x="960" y="152" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">2</text><text x="700" y="174" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">per_gather = 6 only</text><text x="900" y="174" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">2</text><text x="960" y="174" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">2</text><text x="700" y="196" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">+ table parallel_workers = 6</text><text x="900" y="196" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">6</text><text x="960" y="196" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">6</text><text x="700" y="218" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">+ max_parallel_workers = 1</text><text x="900" y="218" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">6</text><text x="960" y="218" fill="#eb6c36" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">1</text><text x="700" y="262" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">caught in pg_stat_activity: one client backend</text><text x="700" y="274" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">with leader_pid null, four parallel workers with its pid</text>
