<p class="eyebrow">AUTOVACUUM</p>
<h1>Three workers do not vacuum three times as fast</h1>
<p class="sub">They share one budget, divided evenly. The width of the bar is the cluster's vacuum I/O ceiling, and it does not change with the headcount.</p>

  <defs>
    <style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');/*]]>*/</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="32" y="44" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">AUTOVACUUMUPDATECOSTLIMIT: VACUUM_COST_LIMIT / NWORKERS_FOR_BALANCE — THE SAME TOTAL, HOWEVER MANY WORKERS</text><text x="32" y="98" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">one worker</text><text x="32" y="114" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">200 cost units per 2 ms each</text><rect x="240.0" y="86" width="560.0" height="36" rx="2" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36" stroke-width="0.8"/><text x="518.0" y="108" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">worker 1: limit 200</text><text x="814" y="108" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">= 200 units / 2 ms</text><text x="814" y="122" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">≈ 100,000 units/s</text><text x="32" y="198" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">three workers</text><text x="32" y="214" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">66 cost units per 2 ms each</text><rect x="240.0" y="186" width="182.66666666666666" height="36" rx="2" fill="#2d3142" fill-opacity="0.18" stroke="#2d3142" stroke-width="0.8"/><text x="331.3333333333333" y="208" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">worker 1: limit 66</text><rect x="426.66666666666663" y="186" width="182.66666666666666" height="36" rx="2" fill="#2d3142" fill-opacity="0.18" stroke="#2d3142" stroke-width="0.8"/><text x="518.0" y="208" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">worker 2: limit 66</text><rect x="613.3333333333333" y="186" width="182.66666666666666" height="36" rx="2" fill="#2d3142" fill-opacity="0.18" stroke="#2d3142" stroke-width="0.8"/><text x="704.6666666666666" y="208" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">worker 3: limit 66</text><text x="814" y="208" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">= 200 units / 2 ms</text><text x="814" y="222" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">≈ 100,000 units/s</text><rect x="240" y="232" width="744" height="40" rx="4" fill="#f5f5f5"/><rect x="240" y="232" width="744" height="40" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="254" y="250" fill="#eb6c36" font-size="9.5" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">to vacuum faster:</text><text x="370" y="250" fill="#2d3142" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">raise autovacuum_vacuum_cost_limit (or set it per table) · adding workers changes who does the I/O, not how much</text><text x="370" y="264" fill="#2d3142" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">at defaults: 50,000 page misses/s or 5,000 dirtied pages/s (≈ 39 MB/s) for the whole cluster</text><text x="32" y="300" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">a table with its own cost storage parameters is left out of the balance · a manual VACUUM has vacuum_cost_delay 0 and is not throttled at all</text>
