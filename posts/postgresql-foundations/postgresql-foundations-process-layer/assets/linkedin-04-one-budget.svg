<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img">
  <defs>
    <style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');/*]]>*/</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="80" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.24em">the mistake</text><text x="1000" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">4 / 6</text><line x1="80" y1="148" x2="1000" y2="148" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="232" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">More workers.</text><text x="80" y="300" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">Same speed.</text><text x="80" y="374" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Raising autovacuum_max_workers from 3 to 8 cannot make</text><text x="80" y="404" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">vacuum keep up, because all of them share one budget.</text><text x="80" y="546" fill="#eb6c36" font-size="15" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">one worker · 200 cost units per 2 ms each</text><rect x="80.0" y="560" width="920.0" height="54" rx="2" fill="#eb6c36" fill-opacity="0.16" stroke="#eb6c36" stroke-width="0.8"/><text x="537.0" y="592" fill="#eb6c36" font-size="14" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">limit 200</text><text x="1000" y="634" fill="#7a8399" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">= 200 units / 2 ms · the same total</text><text x="80" y="666" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">three workers · 66 cost units per 2 ms each</text><rect x="80.0" y="680" width="300.6666666666667" height="54" rx="2" fill="#2d3142" fill-opacity="0.16" stroke="#2d3142" stroke-width="0.8"/><text x="230.33333333333334" y="712" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">limit 66</text><rect x="386.6666666666667" y="680" width="300.6666666666667" height="54" rx="2" fill="#2d3142" fill-opacity="0.16" stroke="#2d3142" stroke-width="0.8"/><text x="537.0" y="712" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">limit 66</text><rect x="693.3333333333334" y="680" width="300.6666666666667" height="54" rx="2" fill="#2d3142" fill-opacity="0.16" stroke="#2d3142" stroke-width="0.8"/><text x="843.6666666666667" y="712" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">limit 66</text><text x="1000" y="754" fill="#7a8399" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">= 200 units / 2 ms · the same total</text><text x="80" y="786" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">eight workers · 25 cost units per 2 ms each</text><rect x="80.0" y="800" width="109.0" height="54" rx="2" fill="#2d3142" fill-opacity="0.16" stroke="#2d3142" stroke-width="0.8"/><rect x="195.0" y="800" width="109.0" height="54" rx="2" fill="#2d3142" fill-opacity="0.16" stroke="#2d3142" stroke-width="0.8"/><rect x="310.0" y="800" width="109.0" height="54" rx="2" fill="#2d3142" fill-opacity="0.16" stroke="#2d3142" stroke-width="0.8"/><rect x="425.0" y="800" width="109.0" height="54" rx="2" fill="#2d3142" fill-opacity="0.16" stroke="#2d3142" stroke-width="0.8"/><rect x="540.0" y="800" width="109.0" height="54" rx="2" fill="#2d3142" fill-opacity="0.16" stroke="#2d3142" stroke-width="0.8"/><rect x="655.0" y="800" width="109.0" height="54" rx="2" fill="#2d3142" fill-opacity="0.16" stroke="#2d3142" stroke-width="0.8"/><rect x="770.0" y="800" width="109.0" height="54" rx="2" fill="#2d3142" fill-opacity="0.16" stroke="#2d3142" stroke-width="0.8"/><rect x="885.0" y="800" width="109.0" height="54" rx="2" fill="#2d3142" fill-opacity="0.16" stroke="#2d3142" stroke-width="0.8"/><text x="1000" y="874" fill="#7a8399" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">= 200 units / 2 ms · the same total</text><text x="80" y="970" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">autovacuum_vacuum_cost_limit is divided among the running</text><text x="80" y="1002" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">workers. The bar's width is the cluster's vacuum I/O ceiling —</text><text x="80" y="1034" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">about 39 MB/s of dirtied pages at the defaults — and it never moves.</text><line x1="80" y1="1176" x2="1000" y2="1176" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="1216" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">To vacuum faster, raise the budget. Add workers only when</text><text x="80" y="1246" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">many tables need vacuuming at the same time.</text><text x="80" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.16em">how postgresql uses processes</text><text x="1000" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">canery</text>
</svg>