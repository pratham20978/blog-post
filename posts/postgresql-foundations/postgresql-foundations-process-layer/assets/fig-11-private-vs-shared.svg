<text x="32" y="44" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">ONE BACKEND'S PRIVATE MEMORY AGAINST THE SHARED SEGMENT FROM PART 1 — TO SCALE, POSTGRESQL 16.2 DEFAULTS</text><rect x="60" y="90" width="880.0" height="34" rx="2" fill="#2d3142" fill-opacity="0.1" stroke="#2d3142" stroke-width="0.8"/><text x="500.0" y="111" fill="#2d3142" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">shared memory segment · 143 MB · mapped by every process (part 1, figure 3)</text><rect x="60" y="140" width="80.0" height="20" rx="2" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36" stroke-width="0.8"/><text x="148.0" y="154" fill="#eb6c36" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">fresh backend · 13.0 MB resident</text><rect x="60" y="168" width="89.23076923076924" height="20" rx="2" fill="#eb6c36" fill-opacity="0.28" stroke="#eb6c36" stroke-width="0.8"/><text x="157.23076923076923" y="182" fill="#eb6c36" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">after one catalog query · 14.5 MB · relcache, catcache, plancache, memory contexts</text><rect x="60" y="206" width="880.0" height="20" rx="1" fill="#eb6c36" fill-opacity="0.06" stroke="#eb6c36" stroke-width="0.8"/><line x1="148.0" y1="206" x2="148.0" y2="226" stroke="#eb6c36" stroke-width="0.6" stroke-opacity="0.5"/><line x1="236.00000000000003" y1="206" x2="236.00000000000003" y2="226" stroke="#eb6c36" stroke-width="0.6" stroke-opacity="0.5"/><line x1="324.00000000000006" y1="206" x2="324.00000000000006" y2="226" stroke="#eb6c36" stroke-width="0.6" stroke-opacity="0.5"/><line x1="412.00000000000006" y1="206" x2="412.00000000000006" y2="226" stroke="#eb6c36" stroke-width="0.6" stroke-opacity="0.5"/><line x1="500.0" y1="206" x2="500.0" y2="226" stroke="#eb6c36" stroke-width="0.6" stroke-opacity="0.5"/><line x1="588.0000000000001" y1="206" x2="588.0000000000001" y2="226" stroke="#eb6c36" stroke-width="0.6" stroke-opacity="0.5"/><line x1="676.0000000000001" y1="206" x2="676.0000000000001" y2="226" stroke="#eb6c36" stroke-width="0.6" stroke-opacity="0.5"/><line x1="764.0000000000001" y1="206" x2="764.0000000000001" y2="226" stroke="#eb6c36" stroke-width="0.6" stroke-opacity="0.5"/><line x1="852.0000000000001" y1="206" x2="852.0000000000001" y2="226" stroke="#eb6c36" stroke-width="0.6" stroke-opacity="0.5"/><line x1="940.0" y1="206" x2="940.0" y2="226" stroke="#eb6c36" stroke-width="0.6" stroke-opacity="0.5"/><text x="60" y="242" fill="#eb6c36" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">100 idle connections at 14.5 MB each ≈ 1.4 GB, this bar drawn at 1/10 scale — ten times the shared segment, and none of it shared</text><text x="32" y="266" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">a warm backend grows past this as its caches fill · the shared segment is fixed at start; the private total is fixed by nothing but max_connections</text><line x1="32" y1="284" x2="984" y2="284" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="300" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><rect x="108" y="292" width="10" height="10" rx="2" fill="#2d3142" fill-opacity="0.18" stroke="#2d3142" stroke-width="0.8"/><text x="126" y="301" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">shared, once</text><rect x="240.4" y="292" width="10" height="10" rx="2" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36" stroke-width="0.8"/><text x="258.4" y="301" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">private, per connection</text>
