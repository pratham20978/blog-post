<p class="eyebrow">INTUITION</p>
<h1>The crew, and where the picture stops</h1>
<p class="sub">A supervisor who never cooks, a cook per table, and four people nobody ordered. Three properties carry over; three do not.</p>

<text x="32" y="44" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">THE RESTAURANT — ONE MAÎTRE D', A COOK PER TABLE, A PERMANENT CREW OF FOUR — AND WHERE THE PICTURE STOPS BEING TRUE</text><rect x="40" y="76" width="170" height="68" rx="6" fill="#f5f5f5"/><rect x="40" y="76" width="170" height="68" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><rect x="48" y="82" width="80" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-opacity="0.40" stroke-width="0.8"/><text x="88.0" y="91" fill="#eb6c36" font-size="7" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">POSTMASTER</text><text x="125.0" y="120.0" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">maître d'</text><text x="125.0" y="134.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">seats · never cooks</text><path d="M 125 145 V 160 Q 125 168 133 168 H 894" fill="none" stroke="#4f5d75" stroke-width="1"/><rect x="260" y="76" width="164" height="68" rx="6" fill="#f5f5f5"/><rect x="260" y="76" width="164" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="268" y="82" width="59" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/><text x="297.5" y="91" fill="#2d3142" font-size="7" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">BACKEND</text><text x="342.0" y="120.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">table 1</text><text x="342.0" y="134.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">own cook</text><line x1="342" y1="168" x2="342" y2="146" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="444" y="76" width="164" height="68" rx="6" fill="#f5f5f5"/><rect x="444" y="76" width="164" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="452" y="82" width="59" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/><text x="481.5" y="91" fill="#2d3142" font-size="7" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">BACKEND</text><text x="526.0" y="120.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">table 2</text><text x="526.0" y="134.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">own cook</text><line x1="526" y1="168" x2="526" y2="146" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="628" y="76" width="164" height="68" rx="6" fill="#f5f5f5"/><rect x="628" y="76" width="164" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="636" y="82" width="59" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/><text x="665.5" y="91" fill="#2d3142" font-size="7" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">BACKEND</text><text x="710.0" y="120.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">table 3</text><text x="710.0" y="134.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">own cook</text><line x1="710" y1="168" x2="710" y2="146" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="812" y="76" width="164" height="68" rx="6" fill="#f5f5f5"/><rect x="812" y="76" width="164" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="820" y="82" width="59" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/><text x="849.5" y="91" fill="#2d3142" font-size="7" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">BACKEND</text><text x="894.0" y="120.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">table 4</text><text x="894.0" y="134.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">own cook</text><line x1="894" y1="168" x2="894" y2="146" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><text x="618" y="190" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one cook per party, hired at the door — a client backend per connection</text><rect x="260" y="206" width="716" height="40" rx="6" fill="#f5f5f5"/><rect x="260" y="206" width="716" height="40" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/><text x="618" y="230" fill="#4f5d75" font-size="9.5" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the pantry — shared memory — every cook reaches into the same shelves</text><rect x="40" y="270" width="216" height="82" rx="6" fill="#f5f5f5"/><rect x="40" y="270" width="216" height="82" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="48" y="276" width="80" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-opacity="0.40" stroke-width="0.8"/><text x="88.0" y="285" fill="#4f5d75" font-size="7" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">WAL WRITER</text><text x="148" y="310" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">ledger</text><text x="148" y="327" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">writes every order down</text><text x="148" y="339" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the instant it is placed</text><rect x="280" y="270" width="216" height="82" rx="6" fill="#f5f5f5"/><rect x="280" y="270" width="216" height="82" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="288" y="276" width="129" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-opacity="0.40" stroke-width="0.8"/><text x="352.5" y="285" fill="#4f5d75" font-size="7" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">BACKGROUND WRITER</text><text x="388" y="310" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">plates</text><text x="388" y="327" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">tidies plates a little</text><text x="388" y="339" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">before a cook needs one</text><rect x="520" y="270" width="216" height="82" rx="6" fill="#f5f5f5"/><rect x="520" y="270" width="216" height="82" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="528" y="276" width="94" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-opacity="0.40" stroke-width="0.8"/><text x="575.0" y="285" fill="#4f5d75" font-size="7" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CHECKPOINTER</text><text x="628" y="310" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">sweep</text><text x="628" y="327" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">full clear every few minutes, then</text><text x="628" y="339" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">tears out the old ledger pages</text><rect x="760" y="270" width="216" height="82" rx="6" fill="#f5f5f5"/><rect x="760" y="270" width="216" height="82" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="768" y="276" width="143" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-opacity="0.40" stroke-width="0.8"/><text x="839.5" y="285" fill="#4f5d75" font-size="7" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">AUTOVACUUM LAUNCHER</text><text x="868" y="310" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">rounds</text><text x="868" y="327" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">walks the tables on a fixed round, calls</text><text x="868" y="339" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">for a busser when one is dirty enough</text><rect x="40" y="374" width="296" height="78" rx="4" fill="#f5f5f5"/><rect x="40" y="374" width="296" height="78" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3"/><text x="54" y="396" fill="#eb6c36" font-size="9.5" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">breaks: the pantry is shared</text><text x="54" y="414" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">a cook who spoils the pantry has spoiled</text><text x="54" y="426" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">every table's ingredients — so the whole</text><text x="54" y="438" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">room is cleared, not one table</text><rect x="360" y="374" width="296" height="78" rx="4" fill="#f5f5f5"/><rect x="360" y="374" width="296" height="78" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3"/><text x="374" y="396" fill="#eb6c36" font-size="9.5" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">breaks: hires only on request</text><text x="374" y="414" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the maître d' never decides to hire; the rounds-walker</text><text x="374" y="426" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">asks, and the maître d' only ever says yes</text><rect x="680" y="374" width="296" height="78" rx="4" fill="#f5f5f5"/><rect x="680" y="374" width="296" height="78" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3"/><text x="694" y="396" fill="#eb6c36" font-size="9.5" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">breaks: one guest blocks every table</text><text x="694" y="414" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the whole building shares one clock for</text><text x="694" y="426" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">'old enough to clear' — a lingering guest</text><text x="694" y="438" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">anywhere blocks clearing everywhere</text><line x1="32" y1="474" x2="984" y2="474" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="490" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><rect x="108" y="482" width="10" height="10" rx="2" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36" stroke-width="0.8"/><text x="126" y="491" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">the supervisor</text><rect x="254.8" y="482" width="10" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/><text x="272.8" y="491" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">a process</text><rect x="365.6" y="482" width="10" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="0.8" stroke-dasharray="3,2"/><text x="383.6" y="491" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">where the analogy fails</text>
</svg>
