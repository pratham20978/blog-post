<text x="32" y="44" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">PS -O PID,PPID,RSS,ARGS --PPID 128882 -P 128882 — POSTGRESQL 16.2, NO CLIENT CONNECTED</text><rect x="348" y="76" width="320" height="66" rx="6" fill="#f5f5f5"/><rect x="348" y="76" width="320" height="66" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><rect x="356" y="82" width="115" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-opacity="0.40" stroke-width="0.8"/><text x="413.5" y="91" fill="#eb6c36" font-size="7" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">THE ONLY PARENT</text><text x="508.0" y="119.0" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">postmaster</text><text x="508.0" y="133.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">pid 128882 · rss 18,176 kB · ppid 3166 (the shell)</text><line x1="508" y1="142" x2="508" y2="176" stroke="#4f5d75" stroke-width="1"/><line x1="124.0" y1="176" x2="892.0" y2="176" stroke="#4f5d75" stroke-width="1"/><line x1="124.0" y1="176" x2="124.0" y2="222" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="36.0" y="224" width="176" height="92" rx="6" fill="#f5f5f5"/><rect x="36.0" y="224" width="176" height="92" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="124.0" y="248" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">checkpointer</text><text x="124.0" y="266" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">pid 129064 · ppid 128882</text><text x="124.0" y="280" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">90,240 kB — shared pages touched</text><text x="124.0" y="300" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">dirty pages · fsyncs · checkpoints</text><line x1="316.0" y1="176" x2="316.0" y2="222" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="228.0" y="224" width="176" height="92" rx="6" fill="#f5f5f5"/><rect x="228.0" y="224" width="176" height="92" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="316.0" y="248" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">background writer</text><text x="316.0" y="266" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">pid 129065 · ppid 128882</text><text x="316.0" y="280" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">5,404 kB</text><text x="316.0" y="300" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">cleans ahead of the clock hand</text><line x1="508.0" y1="176" x2="508.0" y2="222" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="420.0" y="224" width="176" height="92" rx="6" fill="#f5f5f5"/><rect x="420.0" y="224" width="176" height="92" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="508.0" y="248" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">walwriter</text><text x="508.0" y="266" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">pid 129144 · ppid 128882</text><text x="508.0" y="280" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">8,204 kB</text><text x="508.0" y="300" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">flushes WAL nobody flushed</text><line x1="700.0" y1="176" x2="700.0" y2="222" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="612.0" y="224" width="176" height="92" rx="6" fill="#f5f5f5"/><rect x="612.0" y="224" width="176" height="92" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="700.0" y="248" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">autovacuum launcher</text><text x="700.0" y="266" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">pid 129145 · ppid 128882</text><text x="700.0" y="280" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">6,768 kB</text><text x="700.0" y="300" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">picks a database, asks for a worker</text><line x1="892.0" y1="176" x2="892.0" y2="222" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="804.0" y="224" width="176" height="92" rx="6" fill="#f5f5f5"/><rect x="804.0" y="224" width="176" height="92" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="892.0" y="248" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">logical replication launcher</text><text x="892.0" y="266" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">pid 129146 · ppid 128882</text><text x="892.0" y="280" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">5,856 kB</text><text x="892.0" y="300" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">idle without a subscription</text><text x="32" y="350" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">five children exist before any client connects · every ppid is 128882 · rss counts touched shared pages, which is why the checkpointer's is large</text><line x1="32" y1="368" x2="984" y2="368" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="384" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><rect x="108" y="376" width="10" height="10" rx="2" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36" stroke-width="0.8"/><text x="126" y="385" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">the supervisor</text><rect x="254.8" y="376" width="10" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/><text x="272.8" y="385" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">a child, forked by the postmaster</text>
