<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img">
  <defs>
    <style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');/*]]>*/</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="80" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.24em">what a commit waits for</text><text x="1000" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">5 / 6</text><line x1="80" y1="148" x2="1000" y2="148" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="232" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">Sixteen times faster.</text><text x="80" y="300" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">Zero corruption risk.</text><text x="80" y="374" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">5,000 single-row commits on the same disk. The only difference</text><text x="80" y="404" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">is whether the backend waits for fdatasync before replying.</text><rect x="140" y="842.66" width="180" height="17.34" rx="2" fill="#2d3142" fill-opacity="0.16" stroke="#2d3142" stroke-width="0.8"/><text x="230" y="826.66" fill="#2d3142" font-size="36" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="middle">867</text><text x="230" y="888" fill="#2d3142" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">synchronous_commit = on</text><text x="230" y="910" fill="#7a8399" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">transactions per second</text><text x="230" y="944" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">5,000 fdatasync calls</text><text x="230" y="964" fill="#7a8399" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">for 5,000 commits</text><rect x="580" y="584.5799999999999" width="180" height="275.42" rx="2" fill="#eb6c36" fill-opacity="0.16" stroke="#eb6c36" stroke-width="0.8"/><text x="670" y="568.5799999999999" fill="#eb6c36" font-size="36" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="middle">13,771</text><text x="670" y="888" fill="#2d3142" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">synchronous_commit = off</text><text x="670" y="910" fill="#7a8399" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">transactions per second</text><text x="670" y="944" fill="#eb6c36" font-size="14" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">2 fdatasync calls</text><text x="670" y="964" fill="#7a8399" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">for 5,000 commits</text><line x1="80" y1="860" x2="1000" y2="860" stroke="#bfc0c0" stroke-width="1.4"/><text x="80" y="1000" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">With on, the committing backend waits for the disk to confirm its</text><text x="80" y="1032" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">log record. With off, it replies at once and the WAL writer flushes</text><text x="80" y="1064" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">within 3 × wal_writer_delay = 600 ms. Nothing can be corrupted.</text><line x1="80" y1="1176" x2="1000" y2="1176" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="1216" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">off risks the last 600 ms of commits in a crash, never consistency.</text><text x="80" y="1246" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">It is a per-transaction setting: off for the reload, on for the payment.</text><text x="80" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.16em">how postgresql uses processes</text><text x="1000" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">canery</text>
</svg>