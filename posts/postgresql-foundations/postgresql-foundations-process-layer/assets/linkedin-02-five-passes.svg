<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img">
  <defs>
    <style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');/*]]>*/</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="80" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.24em">the surprise</text><text x="1000" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">2 / 6</text><line x1="80" y1="148" x2="1000" y2="148" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="232" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">Same delete.</text><text x="80" y="300" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">Five index passes.</text><text x="80" y="374" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">800,000 dead tuples, two indexes, one setting changed:</text><text x="80" y="404" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">the vacuum read its indexes five times instead of once.</text><text x="80" y="546" fill="#eb6c36" font-size="15" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.08em">maintenance_work_mem = 1 MB</text><rect x="80" y="560" width="920" height="30" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="0.8"/><text x="92" y="580" fill="#eb6c36" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">heap: 7,693 pages, read once</text><rect x="80.0" y="606" width="176.0" height="44" rx="2" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36" stroke-width="0.8"/><text x="168.0" y="633" fill="#eb6c36" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">both indexes, in full</text><rect x="264.0" y="606" width="176.0" height="44" rx="2" fill="#eb6c36" fill-opacity="0.22999999999999998" stroke="#eb6c36" stroke-width="0.8"/><text x="352.0" y="633" fill="#eb6c36" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">both indexes, in full</text><rect x="448.0" y="606" width="176.0" height="44" rx="2" fill="#eb6c36" fill-opacity="0.28" stroke="#eb6c36" stroke-width="0.8"/><text x="536.0" y="633" fill="#eb6c36" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">both indexes, in full</text><rect x="632.0" y="606" width="176.0" height="44" rx="2" fill="#eb6c36" fill-opacity="0.33" stroke="#eb6c36" stroke-width="0.8"/><text x="720.0" y="633" fill="#eb6c36" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">both indexes, in full</text><rect x="816.0" y="606" width="176.0" height="44" rx="2" fill="#eb6c36" fill-opacity="0.38" stroke="#eb6c36" stroke-width="0.8"/><text x="904.0" y="633" fill="#eb6c36" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">both indexes, in full</text><text x="80" y="678" fill="#eb6c36" font-size="15" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">5 index passes · 13,015 index pages read</text><text x="80" y="736" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.08em">maintenance_work_mem = 256 MB</text><rect x="80" y="750" width="920" height="30" rx="2" fill="#2d3142" fill-opacity="0.08" stroke="#2d3142" stroke-width="0.8"/><text x="92" y="770" fill="#2d3142" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">heap: 7,693 pages, read once</text><rect x="80.0" y="796" width="912.0" height="44" rx="2" fill="#2d3142" fill-opacity="0.18" stroke="#2d3142" stroke-width="0.8"/><text x="536.0" y="823" fill="#2d3142" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">both indexes, in full</text><text x="80" y="868" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">1 index pass · 2,603 index pages read</text><text x="80" y="970" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">In 16 a dead tuple costs 6 bytes of memory. When the list fills,</text><text x="80" y="1002" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">vacuum stops, walks every index in full, and resumes. 1 MB holds</text><text x="80" y="1034" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">174,761 of them; 800,000 dead rows means five complete passes.</text><line x1="80" y1="1176" x2="1000" y2="1176" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="1216" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">passes = ⌈ dead tuples × 6 B / maintenance_work_mem ⌉.</text><text x="80" y="1246" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">On a churning table, that one setting decides how long vacuum takes.</text><text x="80" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.16em">how postgresql uses processes</text><text x="1000" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">canery</text>
</svg>