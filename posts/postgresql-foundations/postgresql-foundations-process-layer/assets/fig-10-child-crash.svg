<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1016 446" width="1016" height="446" role="img">
  <defs>
    <style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');/*]]>*/</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="32" y="44" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">HANDLECHILDCRASH, POSTMASTER.C — WHAT HAPPENS WHEN SERVERLOOP COLLECTS AN EXIT STATUS</text><rect x="40" y="90" width="180" height="50" rx="6" fill="#f5f5f5"/><rect x="40" y="90" width="180" height="50" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="130.0" y="117.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">child exits</text><text x="130.0" y="131.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SIGCHLD → waitpid</text><line x1="220" y1="115" x2="262" y2="115" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="264" y="90" width="200" height="50" rx="6" fill="#f5f5f5"/><rect x="264" y="90" width="200" height="50" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="364" y="112" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">exit status clean?</text><text x="364" y="128" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0, or a signal we sent</text><line x1="464" y1="115" x2="556" y2="115" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="495.0" y="101" width="30" height="12" rx="2" fill="#f5f5f5"/><text x="510" y="110" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="560" y="90" width="200" height="50" rx="6" fill="#f5f5f5"/><rect x="560" y="90" width="200" height="50" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="660.0" y="117.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">release the slot</text><text x="660.0" y="131.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">carry on</text><line x1="364" y1="140" x2="364" y2="180" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="350.0" y="162" width="28" height="12" rx="2" fill="#f5f5f5"/><text x="364" y="171" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="96" y="182" width="536" height="30" rx="4" fill="#f5f5f5"/><rect x="96" y="182" width="536" height="30" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="110" y="201" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">log it</text><text x="626" y="201" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">"server process (PID n) was terminated by signal 9"</text><line x1="364" y1="212" x2="364" y2="218" stroke="#4f5d75" stroke-width="1"/><rect x="96" y="220" width="536" height="30" rx="4" fill="#f5f5f5"/><rect x="96" y="220" width="536" height="30" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="110" y="239" fill="#eb6c36" font-size="9.5" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">log 'terminating any other active server processes'</text><text x="626" y="239" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">SetQuitSignalReason(PMQUIT_FOR_CRASH)</text><line x1="364" y1="250" x2="364" y2="256" stroke="#4f5d75" stroke-width="1"/><rect x="96" y="258" width="536" height="30" rx="4" fill="#f5f5f5"/><rect x="96" y="258" width="536" height="30" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="110" y="277" fill="#eb6c36" font-size="9.5" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">SIGQUIT every other child</text><text x="626" y="277" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">backends, checkpointer, walwriter, workers — no exceptions</text><line x1="364" y1="288" x2="364" y2="294" stroke="#4f5d75" stroke-width="1"/><rect x="96" y="296" width="536" height="30" rx="4" fill="#f5f5f5"/><rect x="96" y="296" width="536" height="30" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="110" y="315" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">wait until none remain</text><text x="626" y="315" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">PM_WAIT_DEAD_END → PM_NO_CHILDREN</text><line x1="364" y1="326" x2="364" y2="332" stroke="#4f5d75" stroke-width="1"/><rect x="96" y="334" width="536" height="30" rx="4" fill="#f5f5f5"/><rect x="96" y="334" width="536" height="30" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="110" y="353" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">reinitialise shared memory · start recovery</text><text x="626" y="353" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">startup process replays from the last redo point</text><line x1="364" y1="364" x2="364" y2="370" stroke="#4f5d75" stroke-width="1"/><rect x="96" y="372" width="536" height="30" rx="4" fill="#f5f5f5"/><rect x="96" y="372" width="536" height="30" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="110" y="391" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">accept connections again</text><text x="626" y="391" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">a fresh set of children</text><rect x="680" y="200" width="300" height="78" rx="6" fill="#f5f5f5"/><rect x="680" y="200" width="300" height="78" rx="6" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/><text x="694" y="222" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">restart_after_crash = off</text><text x="694" y="240" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">same sequence, but the postmaster</text><text x="694" y="253" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">shuts down instead of reinitialising —</text><text x="694" y="266" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">for clusters with an external supervisor</text><text x="32" y="428" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">no branch inspects shared memory to decide how bad it is · the postmaster does not look; it resets</text>
</svg>