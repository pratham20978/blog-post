  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="32" y="44" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">WHICH PROCESS TOUCHES WHICH POOL FROM PART 1 — A MARK MEANS 'READS OR WRITES IT IN NORMAL OPERATION'</text><text x="286.0" y="80" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">shared buffers</text><text x="414.0" y="80" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">WAL buffers</text><text x="542.0" y="80" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">local memory</text><text x="670.0" y="80" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the disk</text><line x1="32" y1="130" x2="734" y2="130" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="116" fill="#eb6c36" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">postmaster</text><circle cx="286.0" cy="111" r="6" fill="none" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="2,2"/><circle cx="414.0" cy="111" r="6" fill="none" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="2,2"/><circle cx="542.0" cy="111" r="6" fill="none" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="2,2"/><circle cx="670.0" cy="111" r="6" fill="none" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="2,2"/><text x="748" y="115" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">creates shared memory, then never touches it</text><line x1="32" y1="168" x2="734" y2="168" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="154" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">client backend</text><circle cx="286.0" cy="149" r="6" fill="#2d3142" fill-opacity="0.75"/><circle cx="414.0" cy="149" r="6" fill="#2d3142" fill-opacity="0.75"/><circle cx="542.0" cy="149" r="6" fill="#2d3142" fill-opacity="0.75"/><circle cx="670.0" cy="149" r="6" fill="#2d3142" fill-opacity="0.75"/><text x="748" y="153" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">pages, WAL, work_mem, files on a miss</text><line x1="32" y1="206" x2="734" y2="206" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="192" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">checkpointer</text><circle cx="286.0" cy="187" r="6" fill="#2d3142" fill-opacity="0.75"/><circle cx="414.0" cy="187" r="6" fill="none" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="2,2"/><circle cx="542.0" cy="187" r="6" fill="none" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="2,2"/><circle cx="670.0" cy="187" r="6" fill="#2d3142" fill-opacity="0.75"/><text x="748" y="191" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">writes every dirty page, fsyncs every file</text><line x1="32" y1="244" x2="734" y2="244" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="230" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">background writer</text><circle cx="286.0" cy="225" r="6" fill="#2d3142" fill-opacity="0.75"/><circle cx="414.0" cy="225" r="6" fill="none" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="2,2"/><circle cx="542.0" cy="225" r="6" fill="none" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="2,2"/><circle cx="670.0" cy="225" r="6" fill="#2d3142" fill-opacity="0.75"/><text x="748" y="229" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">writes some dirty pages ahead of the sweep</text><line x1="32" y1="282" x2="734" y2="282" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="268" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">WAL writer</text><circle cx="286.0" cy="263" r="6" fill="none" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="2,2"/><circle cx="414.0" cy="263" r="6" fill="#2d3142" fill-opacity="0.75"/><circle cx="542.0" cy="263" r="6" fill="none" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="2,2"/><circle cx="670.0" cy="263" r="6" fill="#2d3142" fill-opacity="0.75"/><text x="748" y="267" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">flushes the WAL ring to its segment</text><line x1="32" y1="320" x2="734" y2="320" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="306" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">autovacuum worker</text><circle cx="286.0" cy="301" r="6" fill="none" stroke="#2d3142" stroke-width="1.4"/><circle cx="286.0" cy="301" r="2.5" fill="#2d3142"/><circle cx="414.0" cy="301" r="6" fill="#2d3142" fill-opacity="0.75"/><circle cx="542.0" cy="301" r="6" fill="#2d3142" fill-opacity="0.75"/><circle cx="670.0" cy="301" r="6" fill="#2d3142" fill-opacity="0.75"/><text x="748" y="305" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">own 256 kB ring · maintenance_work_mem</text><line x1="32" y1="358" x2="734" y2="358" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="344" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">parallel worker</text><circle cx="286.0" cy="339" r="6" fill="#2d3142" fill-opacity="0.75"/><circle cx="414.0" cy="339" r="6" fill="#2d3142" fill-opacity="0.75"/><circle cx="542.0" cy="339" r="6" fill="#2d3142" fill-opacity="0.75"/><circle cx="670.0" cy="339" r="6" fill="#2d3142" fill-opacity="0.75"/><text x="748" y="343" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">a backend in every respect, with its own work_mem</text><line x1="32" y1="396" x2="734" y2="396" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="382" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">autovacuum launcher</text><circle cx="286.0" cy="377" r="6" fill="none" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="2,2"/><circle cx="414.0" cy="377" r="6" fill="none" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="2,2"/><circle cx="542.0" cy="377" r="6" fill="none" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="2,2"/><circle cx="670.0" cy="377" r="6" fill="none" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="2,2"/><text x="748" y="381" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">reads pg_database, decides, signals</text><text x="32" y="418" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">the postmaster's row is empty on purpose · the launcher's is empty because it decides and signals but never opens a table</text><line x1="32" y1="438" x2="984" y2="438" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="454" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><circle cx="113" cy="451" r="4" fill="#2d3142"/><text x="126" y="455" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">touches it directly</text><circle cx="295.8" cy="451" r="4.5" fill="none" stroke="#2d3142" stroke-width="1.2"/><circle cx="295.8" cy="451" r="1.8" fill="#2d3142"/><text x="308.8" y="455" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">through its own ring (part 1)</text><circle cx="550.6" cy="451" r="4.5" fill="none" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="2,2"/><text x="563.6" y="455" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">never</text>
</svg>