  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="32" y="44" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">ONE CHECKPOINT INTERVAL (CHECKPOINT_TIMEOUT 5 MIN, COMPLETION_TARGET 0.9) AND THE LAB'S FORCED ONE, TO SCALE WITH EACH OTHER</text><text x="32" y="76" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">a scheduled checkpoint</text><line x1="60" y1="120" x2="956" y2="120" stroke="#bfc0c0" stroke-width="1"/><line x1="60.0" y1="116" x2="60.0" y2="124" stroke="#bfc0c0" stroke-width="1"/><text x="60.0" y="138" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0 min</text><line x1="239.2" y1="116" x2="239.2" y2="124" stroke="#bfc0c0" stroke-width="1"/><text x="239.2" y="138" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1 min</text><line x1="418.4" y1="116" x2="418.4" y2="124" stroke="#bfc0c0" stroke-width="1"/><text x="418.4" y="138" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">2 min</text><line x1="597.6" y1="116" x2="597.6" y2="124" stroke="#bfc0c0" stroke-width="1"/><text x="597.6" y="138" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">3 min</text><line x1="776.8" y1="116" x2="776.8" y2="124" stroke="#bfc0c0" stroke-width="1"/><text x="776.8" y="138" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">4 min</text><line x1="956.0" y1="116" x2="956.0" y2="124" stroke="#bfc0c0" stroke-width="1"/><text x="956.0" y="138" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">5 min</text><circle cx="60.0" cy="120" r="5" fill="#2d3142"/><text x="68.0" y="108" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">redo point noted</text><rect x="60.0" y="117" width="806.4" height="6" rx="2" fill="#2d3142" fill-opacity="0.14"/><rect x="291.52" y="95" width="343.36" height="16" rx="2" fill="#f5f5f5"/><text x="463.2" y="106" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">dirty buffers written, paced: CheckpointWriteDelay between batches</text><rect x="866.4" y="117" width="35.84000000000003" height="6" rx="2" fill="#eb6c36" fill-opacity="0.9"/><text x="884.32" y="108" fill="#eb6c36" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">fsync · checkpoint record · pg_control · recycle WAL</text><line x1="866.4" y1="126" x2="866.4" y2="150" stroke="#eb6c36" stroke-width="1" stroke-dasharray="3,3"/><text x="860.4" y="154" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">90% of the interval</text><text x="968.0" y="154" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">next one starts</text><text x="32" y="206" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">the lab's CHECKPOINT command — 10,137 dirty buffers, unpaced</text><line x1="60" y1="250" x2="956" y2="250" stroke="#bfc0c0" stroke-width="1"/><line x1="60.0" y1="246" x2="60.0" y2="254" stroke="#bfc0c0" stroke-width="1"/><text x="60.0" y="268" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0.0 s</text><line x1="284.0" y1="246" x2="284.0" y2="254" stroke="#bfc0c0" stroke-width="1"/><text x="284.0" y="268" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0.1 s</text><line x1="508.0" y1="246" x2="508.0" y2="254" stroke="#bfc0c0" stroke-width="1"/><text x="508.0" y="268" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0.2 s</text><line x1="732.0" y1="246" x2="732.0" y2="254" stroke="#bfc0c0" stroke-width="1"/><text x="732.0" y="268" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0.3 s</text><line x1="956.0" y1="246" x2="956.0" y2="254" stroke="#bfc0c0" stroke-width="1"/><text x="956.0" y="268" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0.4 s</text><rect x="60.0" y="247" width="123.19999999999999" height="6" rx="2" fill="#2d3142" fill-opacity="0.4"/><rect x="86.95999999999998" y="225" width="80.48" height="16" rx="2" fill="#f5f5f5"/><text x="127.19999999999999" y="236" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">write 0.055 s</text><rect x="183.2" y="247" width="470.3999999999999" height="6" rx="2" fill="#eb6c36" fill-opacity="0.5"/><rect x="336.08000000000004" y="225" width="209.44" height="16" rx="2" fill="#f5f5f5"/><text x="440.8" y="236" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">sync 0.210 s · 313 files · longest 5 ms</text><rect x="653.5999999999999" y="247" width="125.44000000000005" height="6" rx="2" fill="#4f5d75" fill-opacity="0.5"/><rect x="622.125" y="225.5" width="197.35000000000002" height="15.5" rx="2" fill="#f5f5f5"/><text x="720.8" y="236" fill="#4f5d75" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">record, pg_control, 8 segments recycled</text><text x="779.04" y="292" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">total 0.321 s</text><text x="32" y="330" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">the redo lsn (3/236669C0) is 56 bytes before the record's lsn (3/236669F8) · recovery starts at the redo point, not at the record</text><text x="32" y="346" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">a scheduled checkpoint spreads its writes so I/O is flat across the interval · a forced one pays it all at once, and the fsync phase dominates</text><line x1="32" y1="382" x2="984" y2="382" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="398" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><rect x="108" y="390" width="10" height="10" rx="2" fill="#2d3142" fill-opacity="0.18" stroke="#2d3142" stroke-width="0.8"/><text x="126" y="399" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">writing dirty buffers</text><rect x="305.20000000000005" y="390" width="10" height="10" rx="2" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36" stroke-width="0.8"/><text x="323.20000000000005" y="399" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">fsync</text><rect x="387.20000000000005" y="390" width="10" height="10" rx="2" fill="#4f5d75" fill-opacity="0.18" stroke="#4f5d75" stroke-width="0.8"/><text x="405.20000000000005" y="399" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">bookkeeping</text>
</svg>