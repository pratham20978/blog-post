t Mono', ui-monospace, monospace" text-anchor="start">heap finished</text><path d="M 781 150 H 804 Q 812 150 812 142 V 98 Q 812 90 820 90 H 842" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="914" y1="110" x2="914" y2="188" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="60" y="280" width="896" height="44" rx="6" fill="#f5f5f5"/><rect x="60" y="280" width="896" height="44" rx="6" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/><text x="76" y="298" fill="#2d3142" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the lab at 1 MB: num_dead_tuples climbs to 174,512 → vacuuming indexes → index_vacuum_count 1 → vacuuming heap through page 1,677 → scanning heap resumes at 1,678, counter reset · five times</text><text x="76" y="312" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">1,375 distinct samples caught every phase but final cleanup, which is too brief for the sampler</text><line x1="32" y1="346" x2="984" y2="346" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="362" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><rect x="108" y="354" width="10" height="10" rx="2" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36" stroke-width="0.8"/><text x="126" y="363" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">the loop that maintenance_work_mem controls</text><rect x="463.6" y="354" width="10" height="10" rx="2" fill="#2d3142" fill-opacity="0.18" stroke="#2d3142" stroke-width="0.8"/><text x="481.6" y="363" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.