<text x="80" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.24em">postgresql foundations · part 2 of 3</text><text x="1000" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">1 / 6</text><line x1="80" y1="148" x2="1000" y2="148" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="232" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">PostgreSQL is not</text><text x="80" y="300" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">one program.</text><text x="80" y="374" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">It is a supervisor and a crowd of single-purpose</text><text x="80" y="404" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">processes: one per connection, plus a fixed background cast.</text><rect x="380" y="520" width="44" height="44" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.6"/><text x="402.0" y="504" fill="#eb6c36" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">postmaster · never touches your data</text><line x1="402.0" y1="564" x2="102.0" y2="760" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="80.0" y="760" width="44" height="44" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/><text x="102.0" y="824" transform="rotate(-30 102.0 824)" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75" text-anchor="end">backend</text><line x1="402.0" y1="564" x2="211.5" y2="760" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="189.5 troke-width="1"/><text x="759.0" y="824" transform="rotate(-30 759.0 824)" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75" text-anchor="end">av launcher</text><line x1="402.0" y1="564" x2="868.5" y2="760" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="846.5" y="760" width="44" height="44" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/><text x="868.5" y="824" transform="rotate(-30 868.5 824)" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75" text-anchor="end">av worker</text><line x1="402.0" y1="564" x2="978.0" y2="760" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="956.0" y="760" width="44" height="44" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/><text x="978.0" y="824" transform="rotate(-30 978.0 824)" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" fill="#4f5d75" text-anchor="end">parallel wkr</text><text x="80" y="930" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Every process in a PostgreSQL server is a child of one</text><text x="80" y="962" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">supervisor that never runs a query, never reads a page,</text><text x="80" y="994" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">and is the only process allowed to fork.</text><line x1="80" y1="1176" x2="1000" y2="1176" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="1216" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">The autovacuum launcher cannot start a worker. A parallel</text><text x="80" y="1246" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">query cannot start its own. Every one of them asks the postmaster.</text><text x="80" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.16em">how postgresql uses processes</text><text x="1000" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">canery</text>
