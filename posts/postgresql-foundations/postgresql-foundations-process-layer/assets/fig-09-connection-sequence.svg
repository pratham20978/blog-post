  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="32" y="44" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">FROM CONNECT() TO THE FIRST QUERY — THE POSTMASTER'S INVOLVEMENT ENDS AT THE FORK</text><line x1="100" y1="100" x2="100" y2="470" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="2,3"/><rect x="38.0" y="70" width="124" height="26" rx="4" fill="#f5f5f5"/><rect x="38.0" y="70" width="124" height="26" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="100" y="88" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">client</text><line x1="320" y1="100" x2="320" y2="470" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="2,3"/><rect x="258.0" y="70" width="124" height="26" rx="4" fill="#f5f5f5"/><rect x="258.0" y="70" width="124" height="26" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="320" y="88" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">postmaster</text><line x1="580" y1="100" x2="580" y2="470" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="2,3"/><rect x="518.0" y="70" width="124" height="26" rx="4" fill="#f5f5f5"/><rect x="518.0" y="70" width="124" height="26" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="580" y="88" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">new backend</text><line x1="100" y1="122" x2="316" y2="122" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="120.16" y="105" width="179.68" height="16" rx="2" fill="#f5f5f5"/><text x="210.0" y="116" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">connect() to the listening socket</text><path d="M 320 140 H 356 V 158 H 324" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="360" y="141" width="199.52" height="16" rx="2" fill="#f5f5f5"/><text x="368" y="152" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">ServerLoop: accept() → BackendStartup</text><line x1="320" y1="186" x2="576" y2="186" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow-accent)"/><rect x="365.12" y="169" width="169.76" height="16" rx="2" fill="#f5f5f5"/><text x="450.0" y="180" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">fork_process() — a plain fork()</text><rect x="353.03" y="190" width="193.94" height="15" rx="2" fill="#f5f5f5"/><text x="450.0" y="200" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">the postmaster returns to ServerLoop here</text><line x1="100" y1="226" x2="576" y2="226" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="235.28" y="209" width="209.44" height="16" rx="2" fill="#f5f5f5"/><text x="340.0" y="220" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">startup packet: user, database, options</text><path d="M 580 244 H 616 V 262 H 584" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="620" y="245" width="254.07999999999998" height="16" rx="2" fill="#f5f5f5"/><text x="628" y="256" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">ClientAuthentication: pg_hba.conf, TLS, password</text><line x1="580" y1="290" x2="104" y2="290" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/><rect x="292.32" y="273" width="95.36" height="16" rx="2" fill="#f5f5f5"/><text x="340.0" y="284" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">AuthenticationOk</text><path d="M 580 308 H 616 V 326 H 584" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="620" y="309" width="174.72" height="16" rx="2" fill="#f5f5f5"/><text x="628" y="320" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">InitPostgres: take a PGPROC slot</text><path d="M 580 334 H 616 V 352 H 584" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="620" y="335" width="328.48" height="16" rx="2" fill="#f5f5f5"/><text x="628" y="346" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">register with sinval · relcache · catcache · plancache · pgstat</text><line x1="580" y1="380" x2="104" y2="380" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/><rect x="299.76" y="363" width="80.48" height="16" rx="2" fill="#f5f5f5"/><text x="340.0" y="374" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">ReadyForQuery</text><line x1="100" y1="410" x2="576" y2="410" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="312.16" y="393" width="55.68" height="16" rx="2" fill="#f5f5f5"/><text x="340.0" y="404" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">select 1</text><path d="M 580 428 H 616 V 446 H 584" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="620" y="429" width="323.52" height="16" rx="2" fill="#f5f5f5"/><text x="628" y="440" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">PostgresMain: parse → plan → execute → reply, until disconnect</text><rect x="314" y="200" width="12" height="262" rx="2" fill="#4f5d75" fill-opacity="0.06"/><rect x="284.1" y="325.5" width="71.80000000000001" height="15.5" rx="2" fill="#f5f5f5"/><text x="320" y="336" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">not involved</text><line x1="32" y1="488" x2="984" y2="488" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="504" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><line x1="108" y1="501" x2="120" y2="501" stroke="#eb6c36" stroke-width="1.4"/><text x="126" y="505" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">the one thing the postmaster does</text><line x1="391.6" y1="501" x2="403.6" y2="501" stroke="#4f5d75" stroke-width="1.4"/><text x="409.6" y="505" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">work done by the child</text><line x1="596.0" y1="501" x2="608.0" y2="501" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="3,2"/><text x="614.0" y="505" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">reply</text>
</svg>