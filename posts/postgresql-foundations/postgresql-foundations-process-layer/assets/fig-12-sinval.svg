  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="32" y="44" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">THE ONLY LINK BETWEEN PRIVATE CACHES — THE SHARED-INVALIDATION QUEUE, SINVALADT.C</text><circle cx="508" cy="180" r="70" fill="rgba(45,49,66,0.05)" stroke="#2d3142" stroke-width="1.2"/><circle cx="508" cy="180" r="48" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/><line x1="556.0" y1="180.0" x2="578.0" y2="180.0" stroke="#bfc0c0" stroke-width="0.8"/><line x1="552.3462175605417" y1="198.3688047535243" x2="572.67156727579" y2="206.78784026555627" stroke="#bfc0c0" stroke-width="0.8"/><line x1="541.9411254969543" y1="213.94112549695427" x2="557.4974746830583" y2="229.49747468305833" stroke="#bfc0c0" stroke-width="0.8"/><line x1="526.3688047535243" y1="224.34621756054176" x2="534.7878402655563" y2="244.67156727579007" stroke="#bfc0c0" stroke-width="0.8"/><line x1="508.0" y1="228.0" x2="508.0" y2="250.0" stroke="#bfc0c0" stroke-width="0.8"/><line x1="489.63119524647567" y1="224.34621756054176" x2="481.21215973444373" y2="244.67156727579007" stroke="#bfc0c0" stroke-width="0.8"/><line x1="474.05887450304573" y1="213.94112549695427" x2="458.50252531694167" y2="229.49747468305833" stroke="#bfc0c0" stroke-width="0.8"/><line x1="463.65378243945827" y1="198.36880475352433" x2="443.32843272420996" y2="206.7878402655563" stroke="#bfc0c0" stroke-width="0.8"/><line x1="460.0" y1="180.0" x2="438.0" y2="180.0" stroke="#bfc0c0" stroke-width="0.8"/><line x1="463.6537824394582" y1="161.6311952464757" x2="443.3284327242099" y2="153.21215973444373" stroke="#bfc0c0" stroke-width="0.8"/><line x1="474.05887450304573" y1="146.05887450304573" x2="458.50252531694167" y2="130.50252531694167" stroke="#bfc0c0" stroke-width="0.8"/><line x1="489.63119524647567" y1="135.65378243945824" x2="481.2121597344437" y2="115.32843272420995" stroke="#bfc0c0" stroke-width="0.8"/><line x1="508.0" y1="132.0" x2="508.0" y2="110.0" stroke="#bfc0c0" stroke-width="0.8"/><line x1="526.3688047535243" y1="135.65378243945824" x2="534.7878402655563" y2="115.32843272420993" stroke="#bfc0c0" stroke-width="0.8"/><line x1="541.9411254969543" y1="146.05887450304573" x2="557.4974746830583" y2="130.50252531694167" stroke="#bfc0c0" stroke-width="0.8"/><line x1="552.3462175605417" y1="161.63119524647567" x2="572.67156727579" y2="153.21215973444367" stroke="#bfc0c0" stroke-width="0.8"/><text x="508" y="178" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">sinval</text><text x="508" y="192" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">fixed ring</text><text x="508" y="204" fill="#7a8399" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">in shared memory</text><rect x="32" y="96" width="180" height="68" rx="6" fill="#f5f5f5"/><rect x="32" y="96" width="180" height="68" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="122" y="118" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">backend A</text><text x="122" y="134" fill="#4f5d75" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">relcache · catcache · plancache</text><text x="122" y="148" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">private — nobody else can read it</text><rect x="32" y="196" width="180" height="68" rx="6" fill="#f5f5f5"/><rect x="32" y="196" width="180" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="122" y="218" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">backend B</text><text x="122" y="234" fill="#4f5d75" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">relcache · catcache · plancache</text><text x="122" y="248" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">private — nobody else can read it</text><rect x="804" y="96" width="180" height="68" rx="6" fill="#f5f5f5"/><rect x="804" y="96" width="180" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="894" y="118" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">backend C</text><text x="894" y="134" fill="#4f5d75" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">relcache · catcache · plancache</text><text x="894" y="148" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">private — nobody else can read it</text><rect x="804" y="196" width="180" height="68" rx="6" fill="#f5f5f5"/><rect x="804" y="196" width="180" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="894" y="218" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">backend D</text><text x="894" y="234" fill="#4f5d75" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">relcache · catcache · plancache</text><text x="894" y="248" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">private — nobody else can read it</text><line x1="212" y1="130" x2="458" y2="130" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow-accent)"/><text x="224" y="108" fill="#eb6c36" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">ALTER TABLE … COMMIT:</text><text x="224" y="120" fill="#eb6c36" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">append invalidation message</text><line x1="459" y1="230" x2="214" y2="230" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/><text x="224" y="248" fill="#4f5d75" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">next transaction start:</text><text x="224" y="260" fill="#4f5d75" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">read new messages, drop stale entries</text><line x1="557" y1="130" x2="802" y2="130" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/><text x="792" y="108" fill="#4f5d75" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">far behind →</text><text x="792" y="120" fill="#4f5d75" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">catchup interrupt (ProcSignal)</text><line x1="557" y1="230" x2="802" y2="230" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/><text x="792" y="248" fill="#4f5d75" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">off the end of the ring →</text><text x="792" y="260" fill="#4f5d75" font-size="7.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">reset all caches</text><text x="32" y="298" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">backends never talk to each other about schema · they all read the same ring at their own pace, and a slow reader is nudged with a signal</text>
</svg>