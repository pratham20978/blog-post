  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="32" y="40" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">FOUR PHASES IN 1979, FOUR STAGES NOW</text><text x="335.0" y="82" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">System R · 1979</text><text x="705.0" y="82" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">PostgreSQL 18</text><rect x="220" y="100" width="230" height="50" rx="6" fill="#f5f5f5"/><rect x="220" y="100" width="230" height="50" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="335.0" y="127.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">parsing</text><text x="335.0" y="141.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">checks the syntax</text><rect x="590" y="100" width="230" height="50" rx="6" fill="#f5f5f5"/><rect x="590" y="100" width="230" height="50" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="705.0" y="127.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">parser</text><text x="705.0" y="141.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">grammar, then names (pass 2)</text><rect x="590" y="196" width="230" height="50" rx="6" fill="#f5f5f5"/><rect x="590" y="196" width="230" height="50" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="705.0" y="223.0" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">rewriter</text><text x="705.0" y="237.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">expands views</text><rect x="220" y="292" width="230" height="50" rx="6" fill="#f5f5f5"/><rect x="220" y="292" width="230" height="50" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="335.0" y="319.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">optimization</text><text x="335.0" y="333.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">looks names up · picks access paths</text><rect x="590" y="292" width="230" height="50" rx="6" fill="#f5f5f5"/><rect x="590" y="292" width="230" height="50" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="705.0" y="319.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">planner</text><text x="705.0" y="333.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">picks the cheapest path</text><rect x="220" y="388" width="230" height="50" rx="6" fill="#f5f5f5"/><rect x="220" y="388" width="230" height="50" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="335.0" y="415.0" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">code generation</text><text x="335.0" y="429.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">turns the choice into code</text><rect x="220" y="484" width="230" height="50" rx="6" fill="#f5f5f5"/><rect x="220" y="484" width="230" height="50" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="335.0" y="511.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">execution</text><text x="335.0" y="525.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">runs the generated code</text><rect x="590" y="484" width="230" height="50" rx="6" fill="#f5f5f5"/><rect x="590" y="484" width="230" height="50" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="705.0" y="511.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">executor</text><text x="705.0" y="525.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">walks the plan tree</text><line x1="335.0" y1="150" x2="335.0" y2="292" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="257.48" y="213.0" width="75.52" height="16" rx="2" fill="#f5f5f5"/><text x="325.0" y="224.0" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.04em">query blocks</text><text x="347.0" y="225.0" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">no rewrite stage</text><line x1="335.0" y1="342" x2="335.0" y2="388" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="193.0" y="357.0" width="140.0" height="16" rx="2" fill="#f5f5f5"/><text x="325.0" y="368.0" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.04em">join order + access paths</text><line x1="335.0" y1="438" x2="335.0" y2="484" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="247.56" y="453.0" width="85.44" height="16" rx="2" fill="#f5f5f5"/><text x="325.0" y="464.0" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.04em">generated code</text><line x1="705.0" y1="150" x2="705.0" y2="196" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="707.0" y="165.0" width="65.6" height="16" rx="2" fill="#f5f5f5"/><text x="715.0" y="176.0" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">query tree</text><line x1="705.0" y1="246" x2="705.0" y2="292" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="707.0" y="261.0" width="115.2" height="16" rx="2" fill="#f5f5f5"/><text x="715.0" y="272.0" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">rewritten query tree</text><line x1="705.0" y1="342" x2="705.0" y2="484" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="707.0" y="405.0" width="60.64" height="16" rx="2" fill="#f5f5f5"/><text x="715.0" y="416.0" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">plan tree</text><text x="693.0" y="417.0" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.02em">no code-generation stage</text><line x1="450" y1="125.0" x2="590" y2="125.0" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="2,3"/><rect x="492.16" y="117.0" width="55.68" height="16" rx="2" fill="#f5f5f5"/><text x="520.0" y="128.0" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">same job</text><line x1="450" y1="317.0" x2="590" y2="317.0" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="2,3"/><rect x="492.16" y="309.0" width="55.68" height="16" rx="2" fill="#f5f5f5"/><text x="520.0" y="320.0" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">same job</text><line x1="450" y1="509.0" x2="590" y2="509.0" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="2,3"/><rect x="492.16" y="501.0" width="55.68" height="16" rx="2" fill="#f5f5f5"/><text x="520.0" y="512.0" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">same job</text><line x1="32" y1="564" x2="984" y2="564" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="590" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Three phases match. Each list has one step the other lacks: System R generated code,</text><text x="32" y="610" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">PostgreSQL rewrites views. And the name lookups moved from the optimizer to the parser.</text>
</svg>