<p class="eyebrow">TWO SURPRISES</p>
<h1>NULL in a comparison and in a count</h1>
<p class="sub">= NULL is never true, so it matches nothing; count(column) skips the row whose value is unknown.</p>

  <defs>
    <style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');/*]]>*/</style>

<text x="32" y="40" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">NULL IN A COMPARISON AND IN A COUNT</text><text x="32" y="84" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">which rows does WHERE keep?</text><rect x="252" y="110" width="140" height="28" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="322.0" y="128" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">amount_cents = NULL</text><rect x="392" y="110" width="140" height="28" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="462.0" y="128" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">amount_cents IS NULL</text><rect x="32" y="138" width="220" height="34" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="42" y="158.0" fill="#2d3142" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">999,999 rows with an amount</text><rect x="252" y="138" width="140" height="34" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="322.0" y="159.0" fill="#7a8399" font-size="10" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">UNKNOWN</text><rect x="392" y="138" width="140" height="34" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="462.0" y="159.0" fill="#4f5d75" font-size="10" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">FALSE</text><rect x="32" y="172" width="220" height="34" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="42" y="192.0" fill="#2d3142" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">1 row whose amount is NULL</text><rect x="252" y="172" width="140" height="34" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="322.0" y="193.0" fill="#7a8399" font-size="10" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">UNKNOWN</text><rect x="392" y="172" width="140" height="34" fill="rgba(235,108,54,0.08)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="462.0" y="193.0" fill="#eb6c36" font-size="10" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">TRUE</text><rect x="32" y="206" width="220" height="34" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="42" y="226.0" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">rows kept (TRUE only)</text><rect x="252" y="206" width="140" height="34" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="322.0" y="227.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0</text><rect x="392" y="206" width="140" height="34" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="462.0" y="227.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1</text><text x="32" y="264" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">a comparison with NULL is UNKNOWN, and WHERE discards UNKNOWN like FALSE</text><text x="600" y="84" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">two counts over the same rows</text><rect x="600" y="110" width="384" height="78" rx="6" fill="#f5f5f5"/><rect x="600" y="110" width="384" height="78" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="616" y="138" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">count(*)</text><text x="968" y="140" fill="#2d3142" font-size="18" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">1,000,000</text><text x="616" y="170" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">counts rows</text><rect x="600" y="204" width="384" height="78" rx="6" fill="#f5f5f5"/><rect x="600" y="204" width="384" height="78" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="616" y="232" fill="#eb6c36" font-size="11" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">count(amount_cents)</text><text x="968" y="234" fill="#eb6c36" font-size="18" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">999,999</text><text x="616" y="264" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">counts values that are not NULL</text><text x="600" y="310" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">the difference is order 4242, the one blanked amount;</text><text x="600" y="324" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">sum() and avg() skip it the same way</text><line x1="32" y1="364" x2="984" y2="364" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="390" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">NULL is not a value. It is a marker for unknown, and unknown changes both answers.</text>
