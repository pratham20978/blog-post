<text x="80" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.24em">the surprise</text><text x="1000" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">2 / 6</text><line x1="80" y1="148" x2="1000" y2="148" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="232" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">It fits in cache.</text><text x="80" y="300" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">It is not cached.</text><text x="80" y="374" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">A 60 MB table, a 128 MB pool, and after every scan</text><text x="80" y="404" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">exactly 32 of its 7,693 pages are in shared buffers.</text><line x1="80" y1="640" x2="1000" y2="640" stroke="#bfc0c0" stroke-width="1.4"/><line x1="80.0" y1="634" x2="80.0" y2="646" stroke="#bfc0c0" stroke-width="1.4"/><text x="80.0" y="668" fill="#7a8399" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0</text><line x1="310.0" y1="634" x2="310.0" y2="646" stroke="#bfc0c0" stroke-width="1.4"/><text x="310.0" y="668" fill="#7a8399" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">4,096</text><line x1="540.0" y1="634" x2="540.0" y2="646" stroke="#bfc0c0" stroke-width="1.4"/><text x="540.0" y="668" fill="#7a8399" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">8,192</text><line x1="770.0" y1="634" x2="770.0" y2="646" stroke="#bfc0c0" stroke-width="1.4"/><text x="770.0" y="668" fill="#7a8399" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">12,288</text><line x1="1000.0" y1="634" x2="1000.0" y2="646" stroke="#bfc0c0" stroke-width="1.4"/><text x="1000.0" y="668" fill="#7a8399" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">16,384</text><text x="1000" y="694" fill="#7a8399" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.10em">pages · the pool is 16,384</text><rect x="80" y="570" width="39.8681640625" height="34" rx="2" fill="#2d3142" fill-opacity="0.14" stroke="#2d3142" stroke-width="0.8"/><text x="131.8681640625" y="593" fill="#2d3142" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">customers · 710 pages · cached whole</text><rect x="80" y="516" width="431.97998046875" height="34" rx="2" fill="#eb6c36" fill-opacity="0.16" stroke="#eb6c36" stroke-width="0.8"/><text x="523.97998046875" y="539" fill="#eb6c36" font-size="15" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">orders · 7,693 pages</text><line x1="310.0" y1="500" x2="310.0" y2="710" stroke="#eb6c36" stroke-width="1.6" stroke-dasharray="6,4"/><text x="310.0" y="736" fill="#eb6c36" font-size="14" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">NBuffers / 4 = 4,096 pages</text><text x="80" y="840" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Over the line, a scan runs through a 32-buffer ring</text><text x="80" y="872" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">and leaves 256 KB behind. The lab: shared hit=32 read=7661,</text><text x="80" y="904" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">every time, with 16,352 empty slots looking on.</text><line x1="80" y1="1176" x2="1000" y2="1176" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="1216" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">The buffer manager does not ask 'does it fit?'. It asks</text><text x="80" y="1246" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">'is this table bigger than a quarter of the pool?'</text><text x="80" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.16em">how postgresql uses memory</text><text x="1000" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">canery</text>
