<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1016 380" width="1016" height="380" role="img">
  <defs>
    <style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');/*]]>*/</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="32" y="44" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">THREE POSITIONS DECIDE WHETHER A DIRTY PAGE MAY BE WRITTEN: ITS PD_LSN, THE WAL FLUSH POSITION, AND THE CHECKPOINT</text><line x1="64" y1="130" x2="964" y2="130" stroke="#bfc0c0" stroke-width="1" marker-end="url(#arrow)"/><text x="964" y="152" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.18em">WAL POSITION (LSN) →</text><line x1="172.0" y1="122" x2="172.0" y2="138" stroke="#eb6c36" stroke-width="1.4"/><text x="172.0" y="110" fill="#eb6c36" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">page modified</text><text x="172.0" y="96" fill="#eb6c36" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">pd_lsn = A</text><line x1="406.0" y1="122" x2="406.0" y2="138" stroke="#2d3142" stroke-width="1.4"/><text x="406.0" y="110" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">COMMIT</text><text x="406.0" y="96" fill="#2d3142" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">XLogFlush → flush ≥ A</text><line x1="658.0" y1="122" x2="658.0" y2="138" stroke="#4f5d75" stroke-width="1.4"/><text x="658.0" y="110" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">checkpoint</text><text x="658.0" y="96" fill="#4f5d75" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">every dirty page written</text><line x1="874.0" y1="122" x2="874.0" y2="138" stroke="#7a8399" stroke-width="1.4"/><text x="874.0" y="110" fill="#7a8399" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">next change</text><text x="874.0" y="96" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">full-page image again</text><rect x="172.0" y="144" width="234.0" height="10" rx="1" fill="#eb6c36" fill-opacity="0.25"/><text x="289.0" y="170" fill="#eb6c36" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">may NOT be written: WAL up to A is not on disk</text><rect x="406.0" y="144" width="252.0" height="10" rx="1" fill="#2d3142" fill-opacity="0.1"/><text x="412.0" y="188" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">may be written by anyone: bgwriter, a backend needing the buffer, or the checkpointer</text><text x="64" y="210" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">THE BUFFER'S STATE WORD, OVER THE SAME SPAN</text><rect x="64.0" y="220" width="108.0" height="40" rx="3" fill="#f5f5f5"/><rect x="64.0" y="220" width="108.0" height="40" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="118.0" y="244" fill="#2d3142" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">VALID · clean</text><rect x="172.0" y="220" width="234.0" height="40" rx="3" fill="#f5f5f5"/><rect x="172.0" y="220" width="234.0" height="40" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="289.0" y="244" fill="#eb6c36" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">VALID · DIRTY</text><rect x="406.0" y="220" width="252.0" height="40" rx="3" fill="#f5f5f5"/><rect x="406.0" y="220" width="252.0" height="40" rx="3" fill="rgba(45,49,66,0.06)" stroke="#2d3142" stroke-width="1"/><text x="532.0" y="244" fill="#2d3142" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">VALID · DIRTY · flushable</text><rect x="658.0" y="220" width="306.0" height="40" rx="3" fill="#f5f5f5"/><rect x="658.0" y="220" width="306.0" height="40" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="811.0" y="244" fill="#2d3142" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">VALID · clean (written at the checkpoint)</text><text x="32" y="300" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">FlushBuffer(page) begins with XLogFlush(pd_lsn). Whoever writes — checkpointer, background writer, or a backend evicting a victim — calls the same function and waits on the same rule.</text><text x="32" y="318" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">the lab: pd_lsn 0/4E578B78 after the updates, isdirty = t, then CHECKPOINT → isdirty = f, still resident</text><line x1="32" y1="348" x2="984" y2="348" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="364" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><rect x="108" y="356" width="10" height="10" rx="2" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36" stroke-width="0.8"/><text x="126" y="365" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">write forbidden</text><rect x="262.0" y="356" width="10" height="10" rx="2" fill="#2d3142" fill-opacity="0.18" stroke="#2d3142" stroke-width="0.8"/><text x="280.0" y="365" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">write allowed</text>
</svg>