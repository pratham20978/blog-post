<p class="eyebrow">LOCAL MEMORY</p>
<h1>work_mem is per operation, per process</h1>
<p class="sub">EXPLAIN (ANALYZE) reported 'Memory Usage: 2065kB' three times and an external sort three times. Resource limits apply to each worker individually.</p>
