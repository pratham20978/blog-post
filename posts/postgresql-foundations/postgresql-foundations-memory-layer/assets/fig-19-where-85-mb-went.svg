<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1016 360" width="1016" height="360" role="img">
  <defs>
    <style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');/*]]>*/</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="32" y="44" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">WHERE THE SORT'S 85 MB WENT, AND THAT IT CAME BACK — POSTGRESQL 16.2, 1,000,000 ROWS</text><rect x="32" y="92" width="153.76574433703792" height="44" rx="2" fill="#eb6c36" fill-opacity="0.16" stroke="#eb6c36" stroke-width="0.8"/><text x="108.88287216851896" y="112" fill="#eb6c36" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SortTuple array</text><text x="108.88287216851896" y="126" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">25.2 MB</text><rect x="185.76574433703792" y="92" width="358.66929835013593" height="44" rx="2" fill="#2d3142" fill-opacity="0.12" stroke="#2d3142" stroke-width="0.8"/><text x="365.1003935121059" y="112" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">tuples ('Caller tuples')</text><text x="365.1003935121059" y="126" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">58.7 MB</text><rect x="544.4350426871738" y="92" width="7.56495731282615" height="44" rx="2" fill="#7a8399" fill-opacity="0.12" stroke="#7a8399" stroke-width="0.8"/><text x="32" y="156" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">25.2 + 58.7 + 1.2 = 85.1 MB (decimal), against 'quicksort  Memory: 81868kB'</text><text x="32" y="170" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">in EXPLAIN — the difference is block headers and binary-vs-decimal rounding</text><text x="32" y="188" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the array: 1,048,576 × 24 = 25,165,824 B,</text><text x="32" y="202" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">one 8 KB block short of the logged 25,174,064</text><text x="640" y="80" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">RESIDENT SET OF THE BACKEND (VMRSS)</text><text x="640" y="112" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">idle</text><rect x="730" y="96" width="26.400000000000002" height="24" rx="2" fill="#4f5d75" fill-opacity="0.12" stroke="#4f5d75" stroke-width="0.8"/><text x="764.4" y="112" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">12 MB</text><text x="640" y="156" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">cursor open</text><rect x="730" y="140" width="213.4" height="24" rx="2" fill="#eb6c36" fill-opacity="0.16" stroke="#eb6c36" stroke-width="0.8"/><text x="951.4" y="156" fill="#eb6c36" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">97 MB</text><text x="640" y="200" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">after CLOSE</text><rect x="730" y="184" width="39.6" height="24" rx="2" fill="#2d3142" fill-opacity="0.12" stroke="#2d3142" stroke-width="0.8"/><text x="777.6" y="200" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">18 MB</text><text x="640" y="242" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">6 MB stays after CLOSE: relcache and catcache, not a leak</text><text x="32" y="300" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">freeing was one MemoryContextDelete on the executor's context; the operating system got the pages back because whole blocks, not chunks, were released</text><line x1="32" y1="328" x2="984" y2="328" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="344" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><rect x="108" y="336" width="10" height="10" rx="2" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36" stroke-width="0.8"/><text x="126" y="345" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">SortTuple array</text><rect x="262.0" y="336" width="10" height="10" rx="2" fill="#2d3142" fill-opacity="0.18" stroke="#2d3142" stroke-width="0.8"/><text x="280.0" y="345" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">tuples</text><rect x="351.2" y="336" width="10" height="10" rx="2" fill="#4f5d75" fill-opacity="0.18" stroke="#4f5d75" stroke-width="0.8"/><text x="369.2" y="345" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">resident size</text>
</svg>