<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img">
  <defs>
    <style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');/*]]>*/</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="80" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.24em">local memory</text><text x="1000" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">5 / 6</text><line x1="80" y1="148" x2="1000" y2="148" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="232" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">work_mem is not</text><text x="80" y="300" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">a connection limit.</text><text x="80" y="374" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">It is a limit per sort or hash, per process — and hash tables</text><text x="80" y="404" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">get twice it (hash_mem_multiplier = 2.0).</text><rect x="80" y="520" width="288" height="300" rx="10" fill="#f5f5f5"/><rect x="80" y="520" width="288" height="300" rx="10" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="6,4"/><text x="224" y="552" fill="#2d3142" font-size="14" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">leader</text><rect x="100" y="580" width="248" height="92" rx="8" fill="#f5f5f5"/><rect x="100" y="580" width="248" height="92" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="224" y="616" fill="#2d3142" font-size="22" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Sort</text><text x="224" y="646" fill="#4f5d75" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">external merge · 2.5 MB</text><rect x="100" y="696" width="248" height="100" rx="8" fill="#f5f5f5"/><rect x="100" y="696" width="248" height="100" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="224" y="734" fill="#eb6c36" font-size="22" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">HashAggregate</text><text x="224" y="762" fill="#eb6c36" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">2,065 kB · 9 batches</text><text x="224" y="782" fill="#4f5d75" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">7.5 MB on disk</text><rect x="396" y="520" width="288" height="300" rx="10" fill="#f5f5f5"/><rect x="396" y="520" width="288" height="300" rx="10" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="6,4"/><text x="540" y="552" fill="#2d3142" font-size="14" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">worker 1</text><rect x="416" y="580" width="248" height="92" rx="8" fill="#f5f5f5"/><rect x="416" y="580" width="248" height="92" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="540" y="616" fill="#2d3142" font-size="22" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Sort</text><text x="540" y="646" fill="#4f5d75" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">external merge · 2.5 MB</text><rect x="416" y="696" width="248" height="100" rx="8" fill="#f5f5f5"/><rect x="416" y="696" width="248" height="100" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="540" y="734" fill="#eb6c36" font-size="22" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">HashAggregate</text><text x="540" y="762" fill="#eb6c36" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">2,065 kB · 9 batches</text><text x="540" y="782" fill="#4f5d75" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">7.5 MB on disk</text><rect x="712" y="520" width="288" height="300" rx="10" fill="#f5f5f5"/><rect x="712" y="520" width="288" height="300" rx="10" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="6,4"/><text x="856" y="552" fill="#2d3142" font-size="14" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">worker 2</text><rect x="732" y="580" width="248" height="92" rx="8" fill="#f5f5f5"/><rect x="732" y="580" width="248" height="92" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="856" y="616" fill="#2d3142" font-size="22" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Sort</text><text x="856" y="646" fill="#4f5d75" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">external merge · 2.5 MB</text><rect x="732" y="696" width="248" height="100" rx="8" fill="#f5f5f5"/><rect x="732" y="696" width="248" height="100" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="856" y="734" fill="#eb6c36" font-size="22" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">HashAggregate</text><text x="856" y="762" fill="#eb6c36" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">2,065 kB · 9 batches</text><text x="856" y="782" fill="#4f5d75" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">7.5 MB on disk</text><text x="80" y="880" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">work_mem was 1 MB. EXPLAIN printed 'Memory Usage: 2065kB' three times</text><text x="80" y="912" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">and 'external merge' three times: six budgets for one query.</text><text x="80" y="970" fill="#eb6c36" font-size="20" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">worst case = work_mem × operations × (leader + workers) × sessions</text><text x="80" y="1002" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">256 MB × 9 × 3 × 20 connections = 138 GB. Nothing stops it.</text><line x1="80" y1="1176" x2="1000" y2="1176" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="1216" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">The failure is not a slow query. It is the kernel killing a backend,</text><text x="80" y="1246" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">which takes the whole server down with it. Set it per session.</text><text x="80" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.16em">how postgresql uses memory</text><text x="1000" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">canery</text>
</svg>