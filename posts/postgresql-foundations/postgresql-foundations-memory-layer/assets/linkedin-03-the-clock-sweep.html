st Mono', ui-monospace, monospace" text-anchor="middle">buf 5</text><rect x="680" y="740" width="108" height="84" rx="8" fill="#f5f5f5"/><rect x="680" y="740" width="108" height="84" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="734.0" y="780" fill="#2d3142" font-size="30" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">2</text><text x="734.0" y="806" fill="#7a8399" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">buf 6</text><rect x="800" y="740" width="108" height="84" rx="8" fill="#f5f5f5"/><rect x="800" y="740" width="108" height="84" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="854.0" y="780" fill="#2d3142" font-size="30" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1</text><text x="854.0" y="806" fill="#7a8399" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">buf 7</text><rect x="920" y="740" width="108" height="84" rx="8" fill="#f5f5f5"/><rect x="920" y="740" width="108" height="84" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="974.0" y="780" fill="#2d3142" font-size="30" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0</text><text x="974.0" y="806" fill="#7a8399" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">buf 8</text><path d="M 614.0 840 L 605.0 858 L 623.0 858 Z" fill="#eb6c36"/><text x="80" y="960" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Pinned: skip. Count above 0: subtract one, skip. Count 0: evict.</text><text x="80" y="992" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Nothing is reordered; the hand is the only shared state.</text><text x="80" y="1024" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">In the lab, 710 pages at count 5 survived; 7,373 at count 1 did not.</text><line x1="80" y1="1176" x2="1000" y2="1176" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="1216" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">ARC lasted three months in 2005 (a patent). 2Q lasted seven.</text><text x="80" y="1246" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">The clock sweep has run since 8.1, because it never takes a list lock.</text><text x="80" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.16em">how postgresql uses memory</text><text x="1000" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">canery</text>
