      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="32" y="44" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">ONE UPDATE, FROM THE HEAP PAGE TO THE SEGMENT FILE</text><line x1="130" y1="100" x2="130" y2="540" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="2,3"/><rect x="68" y="70" width="124" height="26" rx="4" fill="#f5f5f5"/><rect x="68" y="70" width="124" height="26" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="130" y="88" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">backend</text><line x1="330" y1="100" x2="330" y2="540" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="2,3"/><rect x="268" y="70" width="124" height="26" rx="4" fill="#f5f5f5"/><rect x="268" y="70" width="124" height="26" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="330" y="88" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">insert position</text><line x1="540" y1="100" x2="540" y2="540" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="2,3"/><rect x="478" y="70" width="124" height="26" rx="4" fill="#f5f5f5"/><rect x="478" y="70" width="124" height="26" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="540" y="88" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">WAL buffers (4 MB)</text><line x1="740" y1="100" x2="740" y2="540" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="2,3"/><rect x="678" y="70" width="124" height="26" rx="4" fill="#f5f5f5"/><rect x="678" y="70" width="124" height="26" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="740" y="88" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">WAL writer</text><line x1="920" y1="100" x2="920" y2="540" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="2,3"/><rect x="858" y="70" width="124" height="26" rx="4" fill="#f5f5f5"/><rect x="858" y="70" width="124" height="26" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="920" y="88" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">segment file</text><path d="M 130 112 H 166 V 130 H 134" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="170" y="113" width="358.24" height="16" rx="2" fill="#f5f5f5"/><text x="178" y="124" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">modify the page in shared buffers; MarkBufferDirty (critical section)</text><line x1="130" y1="160" x2="326" y2="160" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="164.96" y="143" width="130.07999999999998" height="16" rx="2" fill="#f5f5f5"/><text x="230.0" y="154" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">reserve bytes: spinlock</text><rect x="172.09" y="164" width="115.82" height="15" rx="2" fill="#f5f5f5"/><text x="230.0" y="174" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">the one serialised step</text><line x1="330" y1="196" x2="134" y2="196" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/><rect x="172.4" y="179" width="115.2" height="16" rx="2" fill="#f5f5f5"/><text x="230.0" y="190" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">start, end positions</text><line x1="130" y1="222" x2="536" y2="222" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow-accent)"/><rect x="217.88" y="205" width="234.24" height="16" rx="2" fill="#f5f5f5"/><text x="335.0" y="216" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">copy the record under 1 of 8 insertion locks</text><rect x="264.07" y="226" width="141.86" height="15" rx="2" fill="#f5f5f5"/><text x="335.0" y="236" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">up to 8 backends copy at once</text><path d="M 130 246 H 166 V 264 H 134" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="170" y="247" width="353.28" height="16" rx="2" fill="#f5f5f5"/><text x="178" y="258" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">PageSetLSN(end position) — the page now says which WAL it depends on</text><line x1="130" y1="300" x2="536" y2="300" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow-accent)"/><rect x="255.07999999999998" y="283" width="159.84" height="16" rx="2" fill="#f5f5f5"/><text x="335.0" y="294" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">COMMIT: XLogFlush(commit LSN)</text><line x1="540" y1="326" x2="916" y2="326" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow-accent)"/><rect x="612.88" y="309" width="234.24" height="16" rx="2" fill="#f5f5f5"/><text x="730.0" y="320" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">write + fsync everything up to and beyond it</text><rect x="639.54" y="330" width="180.92" height="15" rx="2" fill="#f5f5f5"/><text x="730.0" y="340" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">piggybacks any WAL already in the ring</text><line x1="920" y1="356" x2="134" y2="356" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/><rect x="437.64" y="339" width="174.72" height="16" rx="2" fill="#f5f5f5"/><text x="525.0" y="350" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">durable — tell the client COMMIT</text><line x1="740" y1="400" x2="916" y2="400" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="757.52" y="383" width="144.96" height="16" rx="2" fill="#f5f5f5"/><text x="830.0" y="394" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">every 200 ms: write, fsync</text><rect x="752.56" y="404" width="154.88" height="15" rx="2" fill="#f5f5f5"/><text x="830.0" y="414" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">wal_writer_delay · async commits</text><rect x="32" y="436" width="72" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/><text x="68.0" y="445" fill="#2d3142" font-size="7" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RING FULL</text><line x1="130" y1="462" x2="536" y2="462" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="222.84" y="445" width="224.32" height="16" rx="2" fill="#f5f5f5"/><text x="335.0" y="456" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">need a buffer still holding unwritten WAL?</text><line x1="540" y1="490" x2="916" y2="490" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="575.6800000000001" y="473" width="308.64" height="16" rx="2" fill="#f5f5f5"/><text x="730.0" y="484" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">the inserter writes that buffer itself · wal_buffers_full++</text><rect x="650.39" y="494" width="159.22" height="15" rx="2" fill="#f5f5f5"/><text x="730.0" y="504" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">8,919 times during the lab's load</text><line x1="32" y1="568" x2="984" y2="568" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="584" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><line x1="108" y1="581" x2="120" y2="581" stroke="#eb6c36" stroke-width="1.4"/><text x="126" y="585" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">the write-ahead rule in motion</text><line x1="370.0" y1="581" x2="382.0" y2="581" stroke="#2d3142" stroke-width="1.4"/><text x="388.0" y="585" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">bookkeeping</text><line x1="495.2" y1="581" x2="507.2" y2="581" stroke="#4f5d75" stroke-width="1.4"/><text x="513.2" y="585" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">return</text>
</svg>