<text x="80" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.24em">the write-ahead rule</text><text x="1000" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">4 / 6</text><line x1="80" y1="148" x2="1000" y2="148" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="232" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">7,544 bytes,</text><text x="80" y="300" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">then 176.</text><text x="80" y="374" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">pg_walinspect on the same one-column UPDATE, run twice.</text><text x="80" y="404" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">The only difference: a checkpoint before the first.</text><text x="80" y="540" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">first update after CHECKPOINT</text><rect x="80" y="560" width="851.9200000000001" height="60" rx="2" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36" stroke-width="0.8"/><text x="505.96000000000004" y="596" fill="#eb6c36" font-size="16" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">full-page image · 7,408 bytes</text><rect x="931.9200000000001" y="560" width="7.4750000000000005" height="60" rx="2" fill="#2d3142" fill-opacity="0.25" stroke="#2d3142" stroke-width="0.8"/><rect x="945.3950000000001" y="560" width="3.91" height="60" rx="2" fill="#2d3142" fill-opacity="0.25" stroke="#2d3142" stroke-width="0.8"/><text x="80" y="650" fill="#2d3142" font-size="15" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">7,544 bytes of WAL for a two-byte change</text><text x="80" y="740" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">second update, same row, same page</text><rect x="80" y="760" width="6.785" height="60" rx="2" fill="#2d3142" fill-opacity="0.25" stroke="#2d3142" stroke-width="0.8"/><rect x="89.785" y="760" width="8.05" height="60" rx="2" fill="#2d3142" fill-opacity="0.25" stroke="#2d3142" stroke-width="0.8"/><rect x="100.835" y="760" width="3.91" height="60" rx="2" fill="#2d3142" fill-opacity="0.25" stroke="#2d3142" stroke-width="0.8"/><text x="121.74499999999999" y="796" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">← 176 bytes, to the same scale</text><text x="80" y="850" fill="#4f5d75" font-size="15" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">PRUNE 59 · HOT_UPDATE 70 · COMMIT 34</text><text x="80" y="960" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">The first change to a page after a checkpoint logs the whole page,</text><text x="80" y="992" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">because an 8 KB disk write is not assumed to be atomic.</text><text x="80" y="1024" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">The hole between line pointers and tuples is skipped: 8,192 − 784.</text><line x1="80" y1="1176" x2="1000" y2="1176" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="1216" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">A dirty page cannot be written until the log describing it is on disk.</text><text x="80" y="1246" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">That rule is why checkpoints, wal_buffers and shared_buffers are one decision.</text><text x="80" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.16em">how postgresql uses memory</text><text x="1000" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">canery</text>
