<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1016 400" width="1016" height="400" role="img">
  <defs>
    <style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');/*]]>*/</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="32" y="44" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">THE THREE RINGS ON POSTGRESQL 16.2, AND WHAT CHANGED IN 17 AND 18</text><text x="32" y="76" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">RING</text><text x="150" y="76" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">SIZE · BUFFERS</text><text x="300" y="76" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">WHO USES IT</text><text x="604" y="76" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">DIRTY PAGES</text><text x="800" y="76" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">17 / 18</text><line x1="32" y1="84" x2="984" y2="84" stroke="#bfc0c0" stroke-width="0.8"/><rect x="32" y="100" width="952" height="62" rx="4" fill="#f5f5f5"/><rect x="32" y="100" width="952" height="62" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="48" y="136" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">bulk read</text><text x="150" y="136" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">256 KB · 32</text><text x="300" y="124" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">sequential scans of tables over NBuffers / 4</text><text x="604" y="124" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">ejected from the ring, so a WAL</text><text x="604" y="137" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">flush is never paid</text><text x="800" y="124" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">18: grows by io_combine_limit ×</text><text x="800" y="137" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">effective_io_concurrency (2,304 KB with</text><text x="800" y="150" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">defaults)</text><rect x="32" y="172" width="952" height="62" rx="4" fill="#f5f5f5"/><rect x="32" y="172" width="952" height="62" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="48" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">bulk write</text><text x="150" y="208" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">16 MB · 2,048</text><text x="300" y="196" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">COPY FROM · CREATE TABLE AS · REFRESH MATERIALIZED VIEW ·</text><text x="300" y="209" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">table rewrites</text><text x="604" y="196" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">kept; WAL flushed as needed</text><text x="800" y="196" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">unchanged</text><rect x="32" y="244" width="952" height="62" rx="4" fill="#f5f5f5"/><rect x="32" y="244" width="952" height="62" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="48" y="280" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">vacuum</text><text x="150" y="280" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">256 KB · 32</text><text x="300" y="268" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">VACUUM · ANALYZE · autovacuum, sized by</text><text x="300" y="281" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">vacuum_buffer_usage_limit</text><text x="604" y="268" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">kept; WAL flushed as needed</text><text x="800" y="268" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">17: default 2 MB · 16+:</text><text x="800" y="281" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">BUFFER_USAGE_LIMIT per call</text><text x="32" y="334" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">every ring is capped at NBuffers / 8 (2,048 buffers here, so the bulk-write ring is exactly at its cap) · a ring slot is reused only while unpinned and at usage ≤ 1</text><text x="32" y="352" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">a table qualifies for a ring when it has more than NBuffers / 4 pages: 4,096 pages = 32 MB on the default pool</text><line x1="32" y1="368" x2="984" y2="368" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="384" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><rect x="108" y="376" width="10" height="10" rx="2" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36" stroke-width="0.8"/><text x="126" y="385" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">the ring the worked example used</text><rect x="384.4" y="376" width="10" height="10" rx="2" fill="#2d3142" fill-opacity="0.18" stroke="#2d3142" stroke-width="0.8"/><text x="402.4" y="385" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">the other two</text>
</svg>