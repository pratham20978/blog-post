<text x="80" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.24em">postgresql foundations · part 1 of 3</text><text x="1000" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">1 / 6</text><line x1="80" y1="148" x2="1000" y2="148" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="232" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">PostgreSQL keeps RAM</text><text x="80" y="300" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">in three pools.</text><text x="80" y="374" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Not one cache. A shared page pool, a small log ring,</text><text x="80" y="404" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">and private working memory in every process.</text><rect x="80" y="520" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="130" y="520" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="180" y="520" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="230" y="520" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="280" y="520" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="330" y="520" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="380" y="520" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="430" y="520" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="480" y="520" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="530" y="520" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="580" y="520" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="630" y="520" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="80" y="570" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="130" y="570" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="180" y="570" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="230" y="570" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="280" y="570" width="40" height="40" rx="5" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.6"/><rect x="330" y="570" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="380" y="570" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="430" y="570" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="480" y="570" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="530" y="570" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="580" y="570" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="630" y="570" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="80" y="620" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="130" y="620" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="180" y="620" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="230" y="620" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="280" y="620" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="330" y="620" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="380" y="620" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="430" y="620" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="480" y="620" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="530" y="620" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="580" y="620" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="630" y="620" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="80" y="692" fill="#2d3142" font-size="24" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">shared buffers</text><text x="80" y="716" fill="#4f5d75" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">128 MB · 16,384 pages · every process maps it</text><rect x="80" y="758" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="130" y="758" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="180" y="758" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="230" y="758" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="280" y="758" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="80" y="830" fill="#2d3142" font-size="24" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">WAL buffers</text><text x="80" y="854" fill="#4f5d75" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">4 MB · must reach disk before any page may</text><rect x="80" y="896" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="130" y="896" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="180" y="896" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="230" y="896" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="280" y="896" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="330" y="896" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="380" y="896" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="80" y="946" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="130" y="946" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="180" y="946" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="230" y="946" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="280" y="946" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="330" y="946" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="380" y="946" width="40" height="40" rx="5" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="80" y="1018" fill="#2d3142" font-size="24" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">local memory</text><text x="80" y="1042" fill="#4f5d75" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">work_mem · per sort, per hash, per process</text><line x1="80" y1="1176" x2="1000" y2="1176" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="1216" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">The kernel's page cache is a fourth pool underneath —</text><text x="80" y="1246" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">PostgreSQL relies on it and cannot see it.</text><text x="80" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.16em">how postgresql uses memory</text><text x="1000" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">canery</text>
