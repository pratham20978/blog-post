<p class="eyebrow">SHARED BUFFERS</p>
<h1>What a buffer actually is</h1>
<p class="sub">The descriptor is what the clock sweep and the pins touch; the page is what queries read. They live in two arrays, joined by an index.</p>

    <style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');/*]]>*/</style>

<text x="32" y="44" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">ONE BUFFER = A 64-BYTE DESCRIPTOR + AN 8,192-BYTE PAGE, PLUS ONE HASH-TABLE ENTRY</text><rect x="32" y="68" width="400" height="60" rx="6" fill="#f5f5f5"/><rect x="32" y="68" width="400" height="60" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="232.0" y="100.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">buffer lookup table</text><text x="232.0" y="114.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">shared hash · tag → buffer id · 128 partition locks</text><text x="232" y="148" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">hash(tag) picks the partition; a lookup takes it shared, a re-tag takes it exclusive</text><text x="32" y="190" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.10em">BufferDesc — 64 bytes, drawn to scale (1 byte = 10 px)</text><rect x="32" y="200" width="200" height="44" rx="3" fill="#f5f5f5"/><rect x="32" y="200" width="200" height="44" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="132.0" y="220" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">tag</text><text x="132.0" y="234" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">20 B</text><text x="132.0" y="260" fill="#4f5d75" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">spcOid · dbOid · relNumber · forkNum · blockNum</text><rect x="232" y="200" width="40" height="44" rx="3" fill="#f5f5f5"/><rect x="232" y="200" width="40" height="44" rx="3" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/><text x="252.0" y="220" fill="#4f5d75" font-size="7" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">buf_id</text><text x="252.0" y="234" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">4 B</text><rect x="272" y="200" width="40" height="44" rx="3" fill="#f5f5f5"/><rect x="272" y="200" width="40" height="44" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="292.0" y="220" fill="#eb6c36" font-size="7" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">state</text><text x="292.0" y="234" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">4 B</text><rect x="312" y="200" width="40" height="44" rx="3" fill="#f5f5f5"/><rect x="312" y="200" width="40" height="44" rx="3" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/><text x="332.0" y="220" fill="#4f5d75" font-size="7" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">waiter</text><text x="332.0" y="234" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">4 B</text><rect x="352" y="200" width="40" height="44" rx="3" fill="#f5f5f5"/><rect x="352" y="200" width="40" height="44" rx="3" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/><text x="372.0" y="220" fill="#4f5d75" font-size="7" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">freeNext</text><text x="372.0" y="234" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">4 B</text><rect x="392" y="200" width="160" height="44" rx="3" fill="#f5f5f5"/><rect x="392" y="200" width="160" height="44" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="472.0" y="220" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">content_lock</text><text x="472.0" y="234" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">16 B</text><text x="472.0" y="260" fill="#4f5d75" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">LWLock · shared to read · exclusive to write</text><rect x="552" y="200" width="120" height="44" rx="3" fill="#f5f5f5"/><rect x="552" y="200" width="120" height="44" rx="3" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.25)" stroke-width="1"/><text x="612.0" y="220" fill="#7a8399" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">pad</text><text x="612.0" y="234" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">12 B</text><text x="612.0" y="260" fill="#4f5d75" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">to 64</text><path d="M 272 244 L 272 292 M 312 244 L 312 292" stroke="#eb6c36" stroke-width="0.8" stroke-dasharray="3,3" fill="none"/><text x="32" y="288" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.10em">the state word — 32 bits, one atomic integer, three facts</text><rect x="32" y="300" width="360.0" height="40" rx="3" fill="#f5f5f5"/><rect x="32" y="300" width="360.0" height="40" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="212.0" y="318" fill="#eb6c36" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">refcount (pins)</text><text x="212.0" y="332" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">18 bits</text><text x="212.0" y="356" fill="#4f5d75" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">MAX_BACKENDS = 2¹⁸ − 1</text><rect x="392.0" y="300" width="80.0" height="40" rx="3" fill="#f5f5f5"/><rect x="392.0" y="300" width="80.0" height="40" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="432.0" y="318" fill="#eb6c36" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">usage count</text><text x="432.0" y="332" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">4 bits</text><text x="432.0" y="356" fill="#4f5d75" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0 … 5</text><rect x="472.0" y="300" width="200.0" height="40" rx="3" fill="#f5f5f5"/><rect x="472.0" y="300" width="200.0" height="40" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="572.0" y="318" fill="#eb6c36" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">10 flags</text><text x="572.0" y="332" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">10 bits</text><text x="672.0" y="356" fill="#4f5d75" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">LOCKED · DIRTY · VALID · IO_IN_PROGRESS · …</text><text x="32" y="382" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">pinning = one compare-and-swap on this word; the header spinlock is the LOCKED bit, not a separate field (9.6, commit 48354581)</text><rect x="720" y="200" width="264" height="232" rx="6" fill="#f5f5f5"/><rect x="720" y="200" width="264" height="232" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="852" y="230" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the page</text><text x="852" y="248" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">8,192 bytes · one block of one fork</text><rect x="736" y="266" width="232" height="18" rx="2" fill="#f5f5f5"/><rect x="736" y="266" width="232" height="18" rx="2" fill="rgba(45,49,66,0.10)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="852" y="279" fill="#2d3142" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">24-byte header · pd_lsn first</text><rect x="736" y="290" width="232" height="22" rx="2" fill="#f5f5f5"/><rect x="736" y="290" width="232" height="22" rx="2" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="852" y="305" fill="#4f5d75" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">line pointers →</text><rect x="736" y="318" width="232" height="40" rx="2" fill="#f5f5f5"/><rect x="736" y="318" width="232" height="40" rx="2" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="3,3"/><text x="852" y="342" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">free space (the hole)</text><rect x="736" y="364" width="232" height="50" rx="2" fill="#f5f5f5"/><rect x="736" y="364" width="232" height="50" rx="2" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="852" y="393" fill="#4f5d75" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">← tuples</text><text x="852" y="450" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">128 × the descriptor, in a separate array</text><line x1="680" y1="222" x2="716" y2="222" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="616.39" y="172" width="159.22" height="15" rx="2" fill="#f5f5f5"/><text x="696" y="182" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">buf_id = index into Buffer Blocks</text><line x1="32" y1="468" x2="984" y2="468" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="484" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><rect x="108" y="476" width="10" height="10" rx="2" fill="#2d3142" fill-opacity="0.18" stroke="#2d3142" stroke-width="0.8"/><text x="126" y="485" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">identity and locks</text><rect x="283.6" y="476" width="10" height="10" rx="2" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36" stroke-width="0.8"/><text x="301.6" y="485" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">the atomic state word</text><rect x="480.80000000000007" y="476" width="10" height="10" rx="2" fill="#4f5d75" fill-opacity="0.18" stroke="#4f5d75" stroke-width="0.8"/><text x="498.80000000000007" y="485" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">page bytes</text>
