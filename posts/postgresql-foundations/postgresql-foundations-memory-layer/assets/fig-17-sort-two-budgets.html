<p class="eyebrow">LOCAL MEMORY</p>
<h1>The same sort, two budgets</h1>
<p class="sub">PostgreSQL 16.2, parallel query off. From EXPLAIN (ANALYZE, BUFFERS): 40,464 kB of temp files versus 81,868 kB of memory.</p>
