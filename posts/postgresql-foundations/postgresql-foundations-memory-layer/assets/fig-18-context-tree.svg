  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="32" y="44" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">PG_LOG_BACKEND_MEMORY_CONTEXTS ON THE LAB BACKEND, WITH THE 256 MB SORT HELD OPEN IN A CURSOR</text><rect x="32" y="76" width="220" height="46" rx="6" fill="#f5f5f5"/><rect x="32" y="76" width="220" height="46" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="142.0" y="101.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">TopMemoryContext</text><text x="142.0" y="115.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">root · never reset</text><rect x="96" y="140" width="236" height="46" rx="6" fill="#f5f5f5"/><rect x="96" y="140" width="236" height="46" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="214.0" y="165.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">CacheMemoryContext</text><text x="214.0" y="179.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">512 kB · relcache, catcache</text><path d="M 64 122 H 84 Q 92 122 92 130 V 163" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="96" y="200" width="236" height="46" rx="6" fill="#f5f5f5"/><rect x="96" y="200" width="236" height="46" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="214.0" y="225.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">MessageContext</text><text x="214.0" y="239.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">64 kB · reset per command</text><path d="M 64 122 H 84 Q 92 122 92 130 V 223" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="96" y="260" width="236" height="46" rx="6" fill="#f5f5f5"/><rect x="96" y="260" width="236" height="46" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="214.0" y="285.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">TopTransactionContext</text><text x="214.0" y="299.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">reset at transaction end</text><path d="M 64 122 H 84 Q 92 122 92 130 V 283" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="96" y="320" width="236" height="46" rx="6" fill="#f5f5f5"/><rect x="96" y="320" width="236" height="46" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="214.0" y="345.0" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">PortalContext →</text><text x="214.0" y="359.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">per-portal, the cursor</text><path d="M 64 122 H 84 Q 92 122 92 130 V 343" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="372" y="320" width="220" height="46" rx="6" fill="#f5f5f5"/><rect x="372" y="320" width="220" height="46" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="482.0" y="345.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">ExecutorState</text><text x="482.0" y="359.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the running query</text><line x1="332" y1="343" x2="368" y2="343" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="632" y="320" width="172" height="46" rx="6" fill="#f5f5f5"/><rect x="632" y="320" width="172" height="46" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="718.0" y="345.0" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">TupleSort main</text><text x="718.0" y="359.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">25,174,064 B</text><line x1="592" y1="343" x2="628" y2="343" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="632" y="396" width="172" height="46" rx="6" fill="#f5f5f5"/><rect x="632" y="396" width="172" height="46" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="718.0" y="421.0" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Caller tuples</text><text x="718.0" y="435.0" fill="#7a8399" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">58,720,256 B · 17 blocks</text><path d="M 612 366 V 419 H 628" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><text x="720" y="458" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1,000,000 chunks — one per row</text><text x="718" y="372" fill="#eb6c36" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">= 2²⁰ SortTuples × 24 B</text><rect x="832" y="320" width="152" height="122" rx="6" fill="#f5f5f5"/><rect x="832" y="320" width="152" height="122" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="848" y="340" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">GRAND TOTAL</text><text x="908" y="372" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">85,132,832 B</text><text x="908" y="392" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">209 blocks · 143 free chunks</text><text x="908" y="412" fill="#7a8399" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">idle: 118 contexts, 1,298 kB</text><text x="908" y="428" fill="#4f5d75" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the query owns 98.5% of it</text><text x="32" y="478" fill="#2d3142" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">CLOSE the cursor and COMMIT: ExecutorState is deleted with its children, 84 MB goes back in one call, and no tuple is freed individually</text><line x1="32" y1="492" x2="984" y2="492" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="508" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><rect x="108" y="500" width="10" height="10" rx="2" fill="#4f5d75" fill-opacity="0.18" stroke="#4f5d75" stroke-width="0.8"/><text x="126" y="509" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">permanent</text><rect x="218.8" y="500" width="10" height="10" rx="2" fill="#2d3142" fill-opacity="0.18" stroke="#2d3142" stroke-width="0.8"/><text x="236.8" y="509" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">per command or transaction</text><rect x="452.0" y="500" width="10" height="10" rx="2" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36" stroke-width="0.8"/><text x="470.0" y="509" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">the sort's memory</text>
</svg>