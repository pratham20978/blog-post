<p class="eyebrow">THE PROBLEM</p>
<h1>The three pools</h1>
<p class="sub">Shared buffers and WAL buffers live in one region every process maps; working memory is per process; the kernel cache underneath is a fourth pool PostgreSQL cannot see.</p>
