<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img">
  <defs>
    <style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');/*]]>*/</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="80" y="120" fill="#7a8399" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.24em">memory contexts</text><text x="1000" y="120" fill="#eb6c36" font-size="15" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">6 / 6</text><line x1="80" y1="148" x2="1000" y2="148" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="232" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">Where 85 MB went,</text><text x="80" y="300" fill="#2d3142" font-size="58" font-weight="400" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">and how it came back.</text><text x="80" y="374" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">A backend never frees a sort's million tuples one by one.</text><text x="80" y="404" fill="#4f5d75" font-size="21" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">It drops the context they live in.</text><rect x="80" y="540" width="272.0470861347594" height="70" rx="2" fill="#eb6c36" fill-opacity="0.16" stroke="#eb6c36" stroke-width="0.8"/><text x="216.0235430673797" y="572" fill="#eb6c36" font-size="14" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SortTuple array</text><text x="216.0235430673797" y="594" fill="#eb6c36" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">25.2 MB</text><rect x="352.0470861347594" y="540" width="634.5687586194713" height="70" rx="2" fill="#2d3142" fill-opacity="0.12" stroke="#2d3142" stroke-width="0.8"/><text x="669.331465444495" y="572" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the tuples themselves</text><text x="669.331465444495" y="594" fill="#2d3142" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">58.7 MB</text><rect x="986.6158447542307" y="540" width="13.38415524576934" height="70" rx="2" fill="#7a8399" fill-opacity="0.12" stroke="#7a8399" stroke-width="0.8"/><text x="80" y="640" fill="#4f5d75" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">2²⁰ slots × 24 bytes = 25.2 MB · 1,000,000 chunks in 17 blocks = 58.7 MB</text><text x="80" y="728" fill="#2d3142" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">idle</text><rect x="330" y="706" width="76.80000000000001" height="34" rx="2" fill="#4f5d75" fill-opacity="0.12" stroke="#4f5d75" stroke-width="0.8"/><text x="418.8" y="728" fill="#4f5d75" font-size="16" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">12 MB</text><text x="80" y="788" fill="#2d3142" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">cursor open, sort done</text><rect x="330" y="766" width="620.8000000000001" height="34" rx="2" fill="#eb6c36" fill-opacity="0.16" stroke="#eb6c36" stroke-width="0.8"/><text x="962.8000000000001" y="788" fill="#eb6c36" font-size="16" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">97 MB</text><text x="80" y="848" fill="#2d3142" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">after CLOSE</text><rect x="330" y="826" width="115.2" height="34" rx="2" fill="#2d3142" fill-opacity="0.12" stroke="#2d3142" stroke-width="0.8"/><text x="457.2" y="848" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">18 MB</text><text x="80" y="900" fill="#7a8399" font-size="13" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">resident set of one backend (VmRSS), PostgreSQL 16.2, work_mem = 256 MB</text><text x="80" y="960" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">The memory came back in one call: the executor's context was deleted</text><text x="80" y="992" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">with every child, and no tuple was freed individually.</text><text x="80" y="1024" fill="#2d3142" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Twenty-two figures, one lab, and every number reproducible.</text><line x1="80" y1="1176" x2="1000" y2="1176" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="80" y="1216" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Three pools, one rule, and a lab you can run: PostgreSQL 16.2,</text><text x="80" y="1246" fill="#2d3142" font-size="22" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">default settings, two tables, every EXPLAIN quoted verbatim.</text><text x="80" y="1300" fill="#eb6c36" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.16em">read it on canery →</text><text x="1000" y="1300" fill="#7a8399" font-size="14" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.24em">canery</text>
</svg>