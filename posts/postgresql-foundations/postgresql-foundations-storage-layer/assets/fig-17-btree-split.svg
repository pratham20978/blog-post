onospace, monospace" text-anchor="start">block 1 · left leaf</text><rect x="32" y="230" width="420" height="40" rx="2" fill="#ffffff" fill-opacity="1" stroke="#2d3142" stroke-width="0.8"/><rect x="32" y="230" width="378.37095191364085" height="40" rx="2" fill="#5e7a9b" fill-opacity="0.35" stroke="#5e7a9b" stroke-width="0.8"/><text x="40" y="254" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">keys 1 … 366 + high key 367</text><text x="446" y="286" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">808 B free</text><text x="532" y="222" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">block 2 · right leaf</text><rect x="532" y="230" width="420" height="40" rx="2" fill="#ffffff" fill-opacity="1" stroke="#2d3142" stroke-width="0.8"/><rect x="532" y="230" width="43.4838076545633" height="40" rx="2" fill="#5e7a9b" fill-opacity="0.35" stroke="#5e7a9b" stroke-width="0.8"/><text x="540" y="254" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">keys 367 … 408</text><text x="946" y="286" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">7,308 B free</text><path d="M 680 166 V 190 Q 680 196 674 196 H 248 Q 242 196 242 202 V 228" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><text x="460" y="190" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">−∞</text><path d="M 780 166 V 190 Q 780 196 774 196 H 748 Q 742 196 742 202 V 228" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><text x="800" y="190" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">367</text><line x1="454" y1="244" x2="530" y2="244" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/><rect x="457.0" y="256" width="70" height="12" rx="2" fill="#f5f5f5"/><text x="492" y="265" fill="#2e5aa8" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RIGHT-LINK</text><text x="32" y="318" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.02em">the left page kept 366 of 407 keys (90% full): at the right edge PostgreSQL assumes keys keep ascending, so it leaves the left page at the leaf fill factor</text><text x="32" y="386" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">a split in the middle of a tree, after 41 more keys: free space is equalised instead</text><text x="32" y="404" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">block 1 · 204 items</text><rect x="32" y="412" width="420" height="40" rx="2" fill="#ffffff" fill-opacity="1" stroke="#2d3142" stroke-width="0.8"/><rect x="32" y="412" width="210.41216879293424" height="40" rx="2" fill="#5e7a9b" fill-opacity="0.35" stroke="#5e7a9b" stroke-width="0.8"/><text x="40" y="436" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start"></text><text x="446" y="468" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">4,068 B free</text><text x="532" y="404" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">block 4 · 205 items (new)</text><rect x="532" y="412" width="420" height="40" rx="2" fill="#ffffff" fill-opacity="1" stroke="#2d3142" stroke-width="0.8"/><rect x="532" y="412" width="211.44259077526988" hei