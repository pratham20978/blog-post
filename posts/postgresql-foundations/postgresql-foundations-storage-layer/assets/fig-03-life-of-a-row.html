onospace" text-anchor="middle">(7692,41)</text><text x="288" y="168" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">page 32 had no room</text><text x="288" y="186" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">+1 entry in each index</text><text x="288" y="204" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">322 B of WAL, 5 records</text><line x1="500" y1="158.0" x2="514" y2="158.0" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="516" y="76" width="224" height="164" rx="6" fill="#f5f5f5"/><rect x="516" y="76" width="224" height="164" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="530" y="100" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">3 · a reader prunes</text><rect x="530" y="114" width="196" height="30" rx="4" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="0.8"/><text x="628.0" y="134" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">(7692,41)</text><text x="530" y="168" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">old (32,82) cut to a 4 B stub</text><text x="530" y="186" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">56 B freed on page 32</text><text x="530" y="204" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">57 B PRUNE record</text><line x1="742" y1="158.0" x2="756" y2="158.0" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="758" y="76" width="224" height="164" rx="6" fill="#f5f5f5"/><rect x="758" y="76" width="224" height="1 no', ui-monospace, monospace" text-anchor="middle">(7692,43)</text><text x="530" y="366" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">index pages 290 → 860 → 1068</text><text x="530" y="384" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">index says (7692,41): 41 → 42 → 43</text><text x="530" y="402" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">13 buffers in all</text><line x1="742" y1="356.0" x2="756" y2="356.0" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="758" y="274" width="224" height="164" rx="6" fill="#f5f5f5"/><rect x="758" y="274" width="224" height="164" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="772" y="298" fill="#eb6c36" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">8 · crash and replay</text><rect x="772" y="312" width="196" height="30" rx="4" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="0.8"/><text x="870.0" y="332" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">(7692,44)</text><text x="772" y="366" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">redo from 3/F6D691A0</text><text x="772" y="384" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">file was one change behind</text><text x="772" y="402" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">after replay: caught up</text><path d="M 870.0 242 V 257.0 H 144.0 V 272" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="32" y1="462" x2="984" y2="462" stroke
