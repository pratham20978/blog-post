<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The price of the skip</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Positioning map · Figure 07</p>
    <h1>What each structure cost, and what it bought</h1>

    <svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- axes -->
      <line x1="160" y1="420" x2="920" y2="420" stroke="#bfc0c0" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="160" y1="420" x2="160" y2="96" stroke="#bfc0c0" stroke-width="1" marker-end="url(#arrow)"/>

      <text x="160" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PAID UP FRONT — BUILD TIME, MEMORY, MAINTENANCE</text>
      <text x="140" y="96" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">MANY</text>
      <text x="140" y="416" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">ONE</text>
      <text x="80" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CANDIDATES ELIMINATED PER PROBE</text>

      <!-- faint reference line: the ceiling nothing in the comparison model beats -->
      <line x1="160" y1="132" x2="920" y2="132" stroke="rgba(45,49,66,0.12)" stroke-width="0.8" stroke-dasharray="4,3"/>
      <rect x="676" y="112" width="188" height="12" rx="2" fill="#f5f5f5"/>
      <text x="768" y="121" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">COMPARISON-MODEL CEILING</text>

      <!-- ===== points ===== -->

      <!-- linear scan : prepays nothing -->
      <circle cx="216" cy="392" r="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="236" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Linear scan</text>
      <text x="236" y="404" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">no structure at all</text>

      <!-- KMP -->
      <circle cx="336" cy="188" r="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="356" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">KMP</text>
      <text x="356" y="200" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">failure table, pattern only</text>

      <!-- Boyer-Moore -->
      <circle cx="432" cy="248" r="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="452" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Boyer–Moore</text>
      <text x="452" y="260" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">skip tables, right-to-left</text>

      <!-- binary search -->
      <circle cx="472" cy="148" r="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="492" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Binary search</text>
      <text x="492" y="160" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">sorted order, kept sorted</text>

      <!-- Dijkstra -->
      <circle cx="576" cy="312" r="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="596" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Dijkstra</text>
      <text x="596" y="324" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">non-negative weights</text>

      <!-- A* -->
      <circle cx="668" cy="200" r="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="688" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">A*</text>
      <text x="688" y="212" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">an admissible estimate</text>

      <!-- HNSW : FOCAL, dashed ring because its height is bought with recall -->
      <circle cx="844" cy="164" r="12" fill="none" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3" opacity="0.8"/>
      <circle cx="844" cy="164" r="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="748" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">HNSW</text>
      <text x="748" y="304" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">a navigable proximity graph</text>
      <path d="M 812 276 H 836 A 8 8 0 0 0 844 268 V 184" fill="none" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3"/>

      <!-- editorial callout -->
      <text x="592" y="112" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">Only one of these pays in correctness.</text>

      <!-- legend -->
      <line x1="30" y1="480" x2="970" y2="480" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="500" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <circle cx="128" cy="496" r="5" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="144" y="500" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">EXACT — THE ANSWER IS GUARANTEED</text>
      <circle cx="512" cy="496" r="5" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <circle cx="512" cy="496" r="9" fill="none" stroke="#eb6c36" stroke-width="0.8" stroke-dasharray="4,3"/>
      <text x="532" y="500" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">APPROXIMATE — ELIMINATION BOUGHT WITH RECALL</text>
    </svg>
  </div>
</body>
</html>
