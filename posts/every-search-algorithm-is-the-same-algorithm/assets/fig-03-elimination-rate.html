<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidates eliminated per probe</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Bar chart · Figure 03</p>
    <h1>What one probe buys you</h1>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- y-axis gridlines and ticks: 1 unit = 36px, baseline y=400 -->
      <line x1="160" y1="112" x2="900" y2="112" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="160" y1="184" x2="900" y2="184" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="160" y1="256" x2="900" y2="256" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="160" y1="328" x2="900" y2="328" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="160" y1="400" x2="900" y2="400" stroke="#bfc0c0" stroke-width="1"/>

      <text x="144" y="116" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">8</text>
      <text x="144" y="188" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">6</text>
      <text x="144" y="260" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">4</text>
      <text x="144" y="332" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">2</text>
      <text x="144" y="404" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0</text>

      <text x="80" y="88" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CANDIDATES ELIMINATED BY THAT PROBE</text>

      <!-- ===== probe 1 : linear 1, ordered 8 ===== -->
      <rect x="196" y="364" width="80" height="36" rx="4" fill="rgba(79,93,117,0.25)" stroke="#4f5d75" stroke-width="1"/>
      <text x="236" y="356" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1</text>
      <rect x="284" y="112" width="80" height="288" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="324" y="104" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">8</text>
      <text x="280" y="424" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PROBE 1</text>

      <!-- ===== probe 2 : linear 1, ordered 5 ===== -->
      <rect x="416" y="364" width="80" height="36" rx="4" fill="rgba(79,93,117,0.25)" stroke="#4f5d75" stroke-width="1"/>
      <text x="456" y="356" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1</text>
      <rect x="504" y="220" width="80" height="180" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="544" y="212" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">5</text>
      <text x="500" y="424" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PROBE 2</text>

      <!-- ===== probe 3 : linear 1, ordered 2 ===== -->
      <rect x="636" y="364" width="80" height="36" rx="4" fill="rgba(79,93,117,0.25)" stroke="#4f5d75" stroke-width="1"/>
      <text x="676" y="356" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1</text>
      <rect x="724" y="328" width="80" height="72" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="764" y="320" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2</text>
      <text x="720" y="424" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PROBE 3</text>

      <!-- editorial note -->
      <text x="836" y="200" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">Same array,</text>
      <text x="836" y="220" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">same target.</text>
      <text x="836" y="248" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">SCAN: 10 PROBES</text>
      <text x="836" y="264" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">ORDERED: 3 PROBES</text>

      <!-- legend -->
      <line x1="30" y1="460" x2="970" y2="460" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="480" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="468" width="16" height="12" rx="2" fill="rgba(79,93,117,0.25)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="144" y="478" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">IGNORING THE ORDER</text>
      <rect x="332" y="468" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="356" y="478" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">USING THE ORDER</text>
    </svg>
  </div>
</body>
</html>
