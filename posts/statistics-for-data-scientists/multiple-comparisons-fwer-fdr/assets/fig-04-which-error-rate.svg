.5)"><rect/><foreignObject width="158.015625" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>How do the tests<br />depend on each other?</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-P-6" data-look="classic" transform="translate(619.703125, 291.5078125)"><rect class="basic label-container" style="" x="-107.234375" y="-45.75" width="214.46875" height="91.5"/><g class="label" style="" transform="translate(-83.234375, -33.75)"><rect/><foreignObject width="166.46875" height="67.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>Count the forks:<br />pre-specify the analysis,<br />or correct for all of them</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-BH-8" data-look="classic" transform="translate(237.640625, 551.765625)"><rect class="basic label-container" style="" x="-110.5703125" y="-34.5" width="221.140625" height="69"/><g class="label" style="" transform="translate(-86.5703125, -22.5)"><rect/><foreignObject width="173.140625" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>False discovery rate<br />Benjamini–Hochberg at q</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-BY-10" data-look="classic" transform="translate(480.28125, 551.765625)"><rect class="basic label-container" style="" x="-92.0703125" y="-45.75" width="184.140625" height="91.5"/><g class="label" style="" transform="translate(-68.0703125, -33.75)"><rect/><foreignObject width="136.140625" height="67.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap;