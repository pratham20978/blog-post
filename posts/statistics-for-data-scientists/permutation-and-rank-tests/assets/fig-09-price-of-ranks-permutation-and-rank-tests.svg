<text x="32" y="40" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">20 PER GROUP, A SHIFT OF 0.91 SD (80% POWER FOR STUDENT'S T ON NORMAL DATA), 100,000 DATA SETS</text><text x="330" y="80" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">power of a 5% test, by shape of the distribution (each scaled to SD 1)</text><line x1="330.0" y1="96.0" x2="330.0" y2="440.0" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="330.0" y="455" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">70%</text><line x1="408.3" y1="96.0" x2="408.3" y2="440.0" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="408.33333333333337" y="455" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">75%</text><line x1="486.7" y1="96.0" x2="486.7" y2="440.0" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="486.6666666666668" y="455" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">80%</text><line x1="565.0" y1="96.0" x2="565.0" y2="440.0" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="565.0" y="455" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">85%</text><line x1="643.3" y1="96.0" x2="643.3" y2="440.0" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="643.3333333333334" y="455" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">90%</text><line x1="721.7" y1="96.0" x2="721.7" y2="440.0" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="721.6666666666666" y="455" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">95%</text><line x1="800.0" y1="96.0" x2="800.0" y2="440.0" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="800.0" y="455" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">100%</text><line x1="330.0" y1="440.0" x2="800.0" y2="440.0" stroke="#bfc0c0" stroke-width="1.0"/><line x1="330.0" y1="96.0" x2="330.0" y2="440.0" stroke="#bfc0c0" stroke-width="1.0"/><text x="800" y="472" fill="#7a8399" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">power</text><text x="150" y="80" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">ARE</text><text x="802" y="486" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">labels: Mann–Whitney vs Welch</text><text x="320" y="120.5" fill="#2d3142" font-size="8.8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">parabolic</text><text x="150" y="120.5" fill="#eb6c36" font-size="8.8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">0.864</text><line x1="485.7" y1="117.5" x2="394.1" y2="117.5" stroke="#bfc0c0" stroke-width="2.2"/><circle cx="485.7" cy="117.5" r="4.4" fill="#2d3142"/><circle cx="394.1" cy="117.5" r="4.4" fill="#eb6c36"/><text x="495.664" y="120.5" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">74.1% vs 79.9%</text><text x="320" y="163.5" fill="#2d3142" font-size="8.8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">normal</text><text x="150" y="163.5" fill="#eb6c36" font-size="8.8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">0.955</text><line x1="482.6" y1="160.5" x2="448.6" y2="160.5" stroke="#bfc0c0" stroke-width="2.2"/><circle cx="482.6" cy="160.5" r="4.4" fill="#2d3142"/><circle cx="448.6" cy="160.5" r="4.4" fill="#eb6c36"/><text x="492.6246666666667" y="163.5" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">77.6% vs 79.7%</text><text x="320" y="206.5" fill="#2d3142" font-size="8.8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">uniform</text><text x="150" y="206.5" fill="#2e5aa8" font-size="8.8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">1.000</text><line x1="484.1" y1="203.5" x2="384.7" y2="203.5" stroke="#bfc0c0" stroke-width="2.2"/><circle cx="484.1" cy="203.5" r="4.4" fill="#2d3142"/><circle cx="384.7" cy="203.5" r="4.4" fill="#eb6c36"/><text x="494.1286666666667" y="206.5" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">73.5% vs 79.8%</text><text x="320" y="249.5" fill="#2d3142" font-size="8.8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">logistic</text><text x="150" y="249.5" fill="#2e5aa8" font-size="8.8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">1.097</text><line x1="485.6" y1="246.5" x2="517.3" y2="246.5" stroke="#bfc0c0" stroke-width="2.2"/><circle cx="485.6" cy="246.5" r="4.4" fill="#2d3142"/><circle cx="517.3" cy="246.5" r="4.4" fill="#eb6c36"/><text x="527.3263333333334" y="249.5" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">82.0% vs 79.9%</text><text x="320" y="292.5" fill="#2d3142" font-size="8.8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">t, 5 df</text><text x="150" y="292.5" fill="#2e5aa8" font-size="8.8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">1.241</text><line x1="499.9" y1="289.5" x2="580.9" y2="289.5" stroke="#bfc0c0" stroke-width="2.2"/><circle cx="499.9" cy="289.5" r="4.4" fill="#2d3142"/><circle cx="580.9" cy="289.5" r="4.4" fill="#eb6c36"/><text x="590.8546666666667" y="292.5" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">86.0% vs 80.8%</text><text x="320" y="335.5" fill="#2d3142" font-size="8.8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">contaminated normal</text><text x="150" y="335.5" fill="#2e5aa8" font-size="8.8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">1.373</text><line x1="493.8" y1="332.5" x2="630.9" y2="332.5" stroke="#bfc0c0" stroke-width="2.2"/><circle cx="493.8" cy="332.5" r="4.4" fill="#2d3142"/><circle cx="630.9" cy="332.5" r="4.4" fill="#eb6c36"/><text x="640.9253333333334" y="335.5" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">89.2% vs 80.5%</text><text x="320" y="378.5" fill="#2d3142" font-size="8.8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">Laplace</text><text x="150" y="378.5" fill="#2e5aa8" font-size="8.8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">1.500</text><line x1="484.3" y1="375.5" x2="611.5" y2="375.5" stroke="#bfc0c0" stroke-width="2.2"/><circle cx="484.3" cy="375.5" r="4.4" fill="#2d3142"/><circle cx="611.5" cy="375.5" r="4.4" fill="#eb6c36"/><text x="621.5143333333333" y="378.5" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">88.0% vs 79.8%</text><text x="320" y="421.5" fill="#2d3142" font-size="8.8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">t, 3 df</text><text x="150" y="421.5" fill="#2e5aa8" font-size="8.8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">1.900</text><line x1="549.9" y1="418.5" x2="721.1" y2="418.5" stroke="#bfc0c0" stroke-width="2.2"/><circle cx="549.9" cy="418.5" r="4.4" fill="#2d3142"/><circle cx="721.1" cy="418.5" r="4.4" fill="#eb6c36"/><text x="731.1339999999999" y="421.5" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">95.0% vs 84.0%</text><text x="32" y="470.0" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">ARE: the large-sample ratio of sample sizes for equal power against a small shift, 12σ²(∫f²)²; 3/π = 0.955 for the normal,</text><text x="32" y="485.5" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">never below 108/125 = 0.864. At n = 20 the uniform (ARE 1) still costs Mann–Whitney 6 points: ARE is a limit</text><line x1="32" y1="503" x2="984" y2="503" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="519" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><circle cx="116.0" cy="516.0" r="4.4" fill="#2d3142"/><text x="132" y="520" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Welch's t</text><circle cx="212.6" cy="516.0" r="4.4" fill="#eb6c36"/><text x="228.6" y="520" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Mann–Whitney</text>
