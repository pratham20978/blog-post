  </defs><text x="32" y="40" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">CHAMPERNOWNE'S WALK: ONE RULE TURNS A LOGNORMAL INTO A POWER LAW</text><clipPath id="c10"><rect x="110" y="104" width="560" height="290"/></clipPath><text x="110" y="76" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">P(X ≥ x): income doubles with probability 1/3, halves with 2/3</text><line x1="110.0" y1="394.0" x2="670.0" y2="394.0" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="102" y="397.0" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">1e−10</text><line x1="110.0" y1="336.0" x2="670.0" y2="336.0" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="102" y="339.0" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">1e−8</text><line x1="110.0" y1="278.0" x2="670.0" y2="278.0" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="102" y="281.0" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">1e−6</text><line x1="110.0" y1="220.0" x2="670.0" y2="220.0" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="102" y="223.0" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">1e−4</text><line x1="110.0" y1="162.0" x2="670.0" y2="162.0" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="102" y="165.0" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">1e−2</text><line x1="110.0" y1="104.0" x2="670.0" y2="104.0" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="102" y="107.0" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">1</text><text x="110.0" y="409" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1</text><text x="250.0" y="409" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">32</text><text x="390.0" y="409" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1,024</text><text x="530.0" y="409" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">32,768</text><text x="670.0" y="409" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1,048,576</text><line x1="110.0" y1="394.0" x2="670.0" y2="394.0" stroke="#bfc0c0" stroke-width="1.0"/><line x1="110.0" y1="104.0" x2="110.0" y2="394.0" stroke="#bfc0c0" stroke-width="1.0"/><text x="110" y="92" fill="#7a8399" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">P(X ≥ x), log scale</text><text x="670" y="426" fill="#7a8399" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">x, log scale (powers of 2)</text><g clip-path="url(#c10)"><polyline points="110.0,104.0 138.0,112.7 166.0,121.5 194.0,130.2 222.0,138.9 250.0,147.6 278.0,156.4 306.0,165.1 334.0,173.8 362.0,182.6 390.0,191.3 418.0,200.0 446.0,208.8 474.0,217.5 502.0,226.2 530.0,234.9 558.0,243.7 586.0,252.4 614.0,261.1 642.0,269.9 670.0,278.6" fill="none" stroke="#2e5aa8" stroke-width="2.0" stroke-linejoin="round"/><polyline points="110.0,134.1 166.0,145.3 222.0,158.7 278.0,174.4 334.0,192.6 390.0,213.5 446.0,237.4 502.0,264.8 558.0,296.5 614.0,334.0 670.0,380.7" fill="none" stroke="#eb6c36" stroke-width="2.0" stroke-linejoin="round"/><circle cx="110.0" cy="134.1" r="3.0" fill="#eb6c36"/><circle cx="166.0" cy="145.3" r="3.0" fill="#eb6c36"/><circle cx="222.0" cy="158.7" r="3.0" fill="#eb6c36"/><circle cx="278.0" cy="174.4" r="3.0" fill="#eb6c36"/><circle cx="334.0" cy="192.6" r="3.0" fill="#eb6c36"/><circle cx="390.0" cy="213.5" r="3.0" fill="#eb6c36"/><circle cx="446.0" cy="237.4" r="3.0" fill="#eb6c36"/><circle cx="502.0" cy="264.8" r="3.0" fill="#eb6c36"/><circle cx="558.0" cy="296.5" r="3.0" fill="#eb6c36"/><circle cx="614.0" cy="334.0" r="3.0" fill="#eb6c36"/><circle cx="670.0" cy="380.7" r="3.0" fill="#eb6c36"/><circle cx="110.0" cy="104.0" r="3.4" fill="#f5f5f5" stroke="#2e5aa8" stroke-width="1.2"/><circle cx="138.0" cy="112.8" r="3.4" fill="#f5f5f5" stroke="#2e5aa8" stroke-width="1.2"/><circle cx="166.0" cy="121.5" r="3.4" fill="#f5f5f5" stroke="#2e5aa8" stroke-width="1.2"/><circle cx="194.0" cy="130.2" r="3.4" fill="#f5f5f5" stroke="#2e5aa8" stroke-width="1.2"/><circle cx="222.0" cy="138.8" r="3.4" fill="#f5f5f5" stroke="#2e5aa8" stroke-width="1.2"/><circle cx="250.0" cy="147.5" r="3.4" fill="#f5f5f5" stroke="#2e5aa8" stroke-width="1.2"/><circle cx="278.0" cy="156.2" r="3.4" fill="#f5f5f5" stroke="#2e5aa8" stroke-width="1.2"/><circle cx="306.0" cy="164.6" r="3.4" fill="#f5f5f5" stroke="#2e5aa8" stroke-width="1.2"/><circle cx="334.0" cy="173.7" r="3.4" fill="#f5f5f5" stroke="#2e5aa8" stroke-width="1.2"/><circle cx="362.0" cy="182.8" r="3.4" fill="#f5f5f5" stroke="#2e5aa8" stroke-width="1.2"/><circle cx="390.0" cy="192.1" r="3.4" fill="#f5f5f5" stroke="#2e5aa8" stroke-width="1.2"/></g><text x="700" y="132" fill="#2e5aa8" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">with a floor at 1</text><text x="700" y="147" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">P(X ≥ x) = 1/x: a power law</text><text x="700" y="162" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">a straight line of slope −1</text><text x="700" y="177" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">200,000 walkers after 400 steps:</text><text x="700" y="192" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">within 0.0014 of it</text><text x="700" y="232" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">no floor, after 20 steps</text><text x="700" y="247" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">log₂ X = 2U − 20, U ~ binomial(20, 1/3)</text><text x="700" y="262" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">a discrete lognormal: it bends</text><text x="700" y="277" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">P(X ≥ 2²⁰) = 2.9 × 10⁻¹⁰ against 9.5 × 10⁻⁷</text><text x="110" y="448" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">same multiplicative steps in both; the only change is a lower barrier (Champernowne's model, after Mitzenmacher 2004)</text><line x1="32" y1="482" x2="984" y2="482" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="498" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><line x1="108.0" y1="495.0" x2="126.0" y2="495.0" stroke="#2e5aa8" stroke-width="2.0"/><text x="132" y="499" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">with a floor, exact</text><circle cx="268.6" cy="495.0" r="3.4" fill="#f5f5f5" stroke="#2e5aa8" stroke-width="1.2"/><text x="284.6" y="499" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">with a floor, simulated</text><line x1="434.8" y1="495.0" x2="452.8" y2="495.0" stroke="#eb6c36" stroke-width="1.8"/><circle cx="443.8" cy="495.0" r="3.2" fill="#eb6c36"/><text x="458.8" y="499" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">no floor, exact</text>
