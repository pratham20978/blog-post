<p class="eyebrow">WHAT R-HAT COMPARES</p>
<h1>Which R-hat sees which failure</h1>
<p class="sub">Four versions of R-hat on four ways chains fail to converge: a shared trend, a shifted chain, a narrow chain, and a mode no chain visited.</p>
