o', ui-monospace, monospace" text-anchor="start">20.1% to 99.7%, estimate 88.9%</text><text x="728.2857142857142" y="124" fill="#2d3142" font-size="8.2" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">no efficacy</text><text x="150" y="318" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Exact test of no efficacy on the 1-to-9 split, the vaccine share 0.5009 under the null: twice the smaller tail gives p = 0.0212,</text><text x="150" y="333" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the version the Clopper–Pearson interval inverts; scipy.stats.binomtest and R's poisson.test sum the outcomes no likelier</text><text x="150" y="348" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">than the observed one and give 0.0116. Both are below 0.05.</text><line x1="32" y1="378" x2="984" y2="378" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="394" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><line x1="108.0" y1="391.0" x2="126.0" y2="391.0" stroke="#2e5aa8" stroke-width="2.0"/><circle cx="117.0" cy="391.0" r="2.6" fill="#2e5aa8"/><text x="132" y="395" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">vaccine arm</text><line x1="215.4" y1="391.0" x2="233.4" y2="391.0" stroke="#2d3142" stroke-width="2.0"/><circle cx="224.4" cy="391.0" r="2.6" fill="#2d3142"/><text x="239.4" y="395" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">placebo arm</text><rect x="322.8" y="385.0" width="16.0" height="12.0" rx="0" fill="#eb6c36" fill-opacity="0.16" stroke="none" stroke-width="0"/><text x="346.8" y="395" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the arms' intervals overlap</text><line x1="516.6" y1="391.0" x2="534.6" y2="391.0" stroke="#2d3142" stroke-width="1.4" stroke-dasharray="5,3"/><text x="540.6" y="395" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">efficacy 0</text>
