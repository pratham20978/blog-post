ht="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">published 2023: 0.116</text><line x1="384.0" y1="377.9" x2="384.0" y2="293.1" stroke="#2d3142" stroke-width="1.6" stroke-dasharray="5,3"/><text x="116" y="393.9130434782609" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">125 reruns at R = 20,000: SD 0.0021; formula √(p(1 − p)/R) = 0.0023</text><text x="389.98311111111093" y="140.60869565217394" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">R = 2,000,000: 0.1170 ± 0.0002</text><text x="700" y="150" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the same experiment, rerun with</text><text x="700" y="166" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">fresh random numbers:</text><text x="700" y="182" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">each published value sits inside</text><text x="700" y="198" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the spread of reruns at its own R,</text><text x="700" y="214" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">so the change between the two</text><text x="700" y="230" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">versions is within simulation</text><text x="700" y="246" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">noise; an MCSE beside each</text><text x="700" y="262" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">would have shown it</text><text x="110" y="470" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">published values: Wilcox and Rousselet's 2017 preprint (R = 5,000) and their 2023 update; the 2023 replication count is not stated unambiguously</text><line x1="32" y1="522" x2="984" y2="522" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="538" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><rect x="108.0" y="529.0" width="16.0" height="12.0" rx="0" fill="#2e5aa8" fill-opacity="0.22" stroke="#2e5aa8" stroke-width="1.0"/><text x="132" y="539" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">reruns of the simulation</text><line x1="287.6" y1="535.0" x2="305.6" y2="535.0" stroke="#eb6c36" stroke-width="2.0"/><text x="311.6" y="539" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">published value</text><line x1="418.6" y1="535.0" x2="436.6" y2="535.0" stroke="#2d3142" stroke-width="1.4" stroke-dasharray="5,3"/><text x="442.6" y="539" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">high-precision value</text>
