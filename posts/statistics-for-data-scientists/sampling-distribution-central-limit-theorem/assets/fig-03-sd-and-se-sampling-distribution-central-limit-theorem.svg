  </defs><text x="32" y="40" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">THE STANDARD DEVIATION DESCRIBES CUSTOMERS; THE STANDARD ERROR DESCRIBES MEANS</text><clipPath id="c3"><rect x="110" y="104" width="560" height="300"/></clipPath><text x="110" y="76" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">spread in pounds, against sample size n, log–log</text><line x1="110.0" y1="362.5" x2="670.0" y2="362.5" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="102" y="365.476710002076" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">100</text><line x1="110.0" y1="312.7" x2="670.0" y2="312.7" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="102" y="315.6912051718098" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">300</text><line x1="110.0" y1="258.1" x2="670.0" y2="258.1" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="102" y="261.1311074161711" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">1,000</text><line x1="110.0" y1="208.3" x2="670.0" y2="208.3" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="102" y="211.3456025859049" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">3,000</text><line x1="110.0" y1="153.8" x2="670.0" y2="153.8" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="102" y="156.7855048302662" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">10,000</text><line x1="110.0" y1="104.0" x2="670.0" y2="104.0" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="102" y="107.0" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">30,000</text><text x="146.2628235963964" y="419" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">10</text><text x="224.25183153045248" y="419" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">30</text><text x="309.72024068396536" y="419" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">100</text><text x="387.70924861802143" y="419" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">300</text><text x="473.1776577715342" y="419" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1,000</text><text x="551.1666657055903" y="419" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">3,000</text><text x="636.6350748591032" y="419" fill="#7a8399" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">10,000</text><line x1="110.0" y1="404.0" x2="670.0" y2="404.0" stroke="#bfc0c0" stroke-width="1.0"/><line x1="110.0" y1="104.0" x2="110.0" y2="404.0" stroke="#bfc0c0" stroke-width="1.0"/><text x="110" y="92" fill="#7a8399" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">£</text><text x="670" y="436" fill="#7a8399" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">sample size n</text><g clip-path="url(#c3)"><polygon points="146.3,235.1 224.3,233.6 309.7,247.3 387.7,263.6 473.2,302.3 551.2,333.2 636.6,364.8 636.6,379.3 551.2,361.8 473.2,353.3 387.7,346.1 309.7,339.3 224.3,332.1 146.3,332.6" fill="#eb6c36" fill-opacity="0.14" stroke="none"/><polyline points="146.3,292.7 224.3,301.3 309.7,307.3 387.7,315.9 473.2,325.2 551.2,345.1 636.6,371.5" fill="none" stroke="#eb6c36" stroke-width="1.8" stroke-linejoin="round"/><line x1="110.0" y1="162.4" x2="670.0" y2="162.4" stroke="#2d3142" stroke-width="1.6" stroke-dasharray="6,3"/><polyline points="110.0,203.0 670.0,381.8" fill="none" stroke="#2d3142" stroke-width="1.8" stroke-linejoin="round"/><circle cx="146.3" cy="214.5" r="3.6" fill="#2e5aa8"/><circle cx="224.3" cy="239.8" r="3.6" fill="#2e5aa8"/><circle cx="309.7" cy="266.7" r="3.6" fill="#2e5aa8"/><circle cx="387.7" cy="291.8" r="3.6" fill="#2e5aa8"/><circle cx="473.2" cy="319.0" r="3.6" fill="#2e5aa8"/><circle cx="551.2" cy="343.9" r="3.6" fill="#2e5aa8"/><circle cx="636.6" cy="371.1" r="3.6" fill="#2e5aa8"/></g><text x="501.96108014847385" y="180.41155403262505" fill="#2d3142" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">σ = £8,267: the SD of one customer's spend</text><text x="700" y="150" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">at n = 30</text><text x="700" y="166" fill="#2d3142" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">true standard error σ/√30 = £1,509</text><text x="700" y="182" fill="#2e5aa8" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">simulated SD of the means £1,498</text><text x="700" y="198" fill="#eb6c36" font-size="8.5" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">typical estimate s/√30 = £386</text><text x="700" y="214" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">s &lt; σ in 88.1% of samples,</text><text x="700" y="230" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">yet s²/σ² averages 0.986</text><text x="700" y="246" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">± 0.014 (unbiased)</text><text x="700" y="300" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">the band: 10th to 90th percentile</text><text x="700" y="315" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">of s/√n over the samples</text><text x="110" y="470" fill="#4f5d75" font-size="8.5" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">R = 100,000 samples per n; the simulated SD of the means sits on σ/√n at every n, within its Monte Carlo error</text><line x1="32" y1="510" x2="984" y2="510" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="526" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text><line x1="108.0" y1="523.0" x2="126.0" y2="523.0" stroke="#2d3142" stroke-width="1.4" stroke-dasharray="5,3"/><text x="132" y="527" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">σ</text><line x1="163.4" y1="523.0" x2="181.4" y2="523.0" stroke="#2d3142" stroke-width="2.0"/><text x="187.4" y="527" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">σ/√n</text><circle cx="243.0" cy="523.0" r="3.6" fill="#2e5aa8"/><text x="259.0" y="527" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">simulated SD of means</text><line x1="398.4" y1="523.0" x2="416.4" y2="523.0" stroke="#eb6c36" stroke-width="2.0"/><text x="422.4" y="527" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">median s/√n</text><rect x="507.8" y="517.0" width="16.0" height="12.0" rx="0" fill="#eb6c36" fill-opacity="0.14" stroke="none" stroke-width="0"/><text x="531.8" y="527" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">10–90% of s/√n</text>
