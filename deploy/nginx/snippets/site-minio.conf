# minio.canery.in — public object reads, so an <img src> can point straight at
# storage instead of streaming through the API.
#
# Scoped hard, on purpose. The same MinIO holds the `blogs` bucket, which is
# article Markdown including unpublished drafts. A blanket proxy to :9000 would
# put every draft one guessed key away from the public, and would expose the
# S3 admin API alongside it. Nothing but the media bucket is reachable here,
# and nothing but GET and HEAD.
#
# The backend does NOT come through this door — it talks to minio:9000 over the
# private network, which is why BLOGS_OBJECT_STORE_SECURE stays false. Nothing
# here is signed, so no request depends on the Host header surviving intact.

# Nothing is uploaded through this name; reads only.
client_max_body_size 1m;

# Everything that is not the media bucket, including /minio/admin/, the other
# bucket, and the console. 404 rather than 403: there is no reason to confirm
# what exists here.
location / {
    return 404;
}

location /media/ {
    limit_except GET HEAD {
        deny all;
    }

    set $upstream http://minio:9000;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy-headers.conf;

    proxy_buffering off;

    # MinIO has no session to set, and a Set-Cookie surviving from storage onto
    # a public asset origin would be a way to write cookies for this domain.
    proxy_hide_header Set-Cookie;

    # Keys are content-addressed: the bytes at a key never change, so a browser
    # or CDN can hold them indefinitely.
    #
    # Both headers are repeated rather than inherited — nginx drops every
    # add_header from an outer level as soon as one is declared here, so the
    # HSTS header from tls-params.conf would silently vanish from this location.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
