# api.canery.in — the FastAPI backend.
#
# The browser does not normally come here: the site calls the API through its
# own BFF route handler, server side, which injects tokens the browser cannot
# read. This name exists for direct API consumers and for debugging.

client_max_body_size 25m;

location / {
    set $upstream http://api:8000;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy-headers.conf;

    # Announcements walk a recipient sheet in-request and can outrun the 60s
    # default.
    proxy_read_timeout 120s;
}
