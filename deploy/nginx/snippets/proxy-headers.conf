# Shared by every proxied site.
#
# Host is passed through unmodified because the applications behind this build
# their own absolute URLs from it — pgAdmin and the MinIO console both do, and
# both produce links to their container name if it is rewritten.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# WebSocket upgrades. $connection_upgrade is a map defined in the generated
# site config; on a plain request it evaluates to "close".
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;
