# Included once at http level, so every server block inherits it.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# One year, and no `preload` — preload is a one-way door: it is baked into
# browser binaries and takes months to undo if a subdomain ever needs plain
# HTTP again.
add_header Strict-Transport-Security "max-age=31536000" always;
