# portainer.canery.in — the Portainer already running on this host, on :9000.
# It is not a service in this stack: it manages this stack.
#
# Portainer's own HTTPS listener on :9443 is bypassed — this hop stays inside
# the machine, and terminating TLS twice would mean trusting its self-signed
# certificate.

location / {
    # Literal, unlike the other sites: host.docker.internal comes from the
    # host-gateway entry in /etc/hosts, and the `resolver` used elsewhere talks
    # to Docker's DNS, which does not serve it. Resolving it at startup is also
    # safe in a way the containers are not — the host gateway is always there.
    proxy_pass http://host.docker.internal:9000;
    include /etc/nginx/snippets/proxy-headers.conf;

    # Container consoles and log streams are long-lived WebSockets.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
