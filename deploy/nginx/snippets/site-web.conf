# canery.in — the Next.js reader site.

client_max_body_size 25m;

location / {
    # Resolved per request rather than at startup. A literal hostname here is
    # looked up once when the configuration loads, so nginx would refuse to
    # boot whenever this container happened to be down — taking every other
    # site on this box with it. Through a variable it is a 502 for this name
    # alone, and it recovers on its own.
    set $upstream http://web:3000;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy-headers.conf;
}
