# minioview.canery.in — the MinIO console on :9001.
#
# The S3 API on :9000 is deliberately not exposed. The console reaches it over
# the private network on the browser's behalf, so object browsing works without
# putting the storage API on the internet.

# Console uploads and downloads stream through here whole; buffering them to
# disk first would cap object size at nginx's temp file limits.
client_max_body_size 0;
proxy_buffering off;
proxy_request_buffering off;
chunked_transfer_encoding off;

location / {
    set $upstream http://minio:9001;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_read_timeout 300s;
}
